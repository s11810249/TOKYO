<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>旅遊分帳 Pro Max</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // 替換為淺粉/燕麥奶柔和色系 (Pastel Warm Beige)
                        primary: {
                            50: '#FBF9F6',
                            100: '#F2EBE5',
                            200: '#E4D7CD',
                            300: '#D2BEB0',
                            400: '#BCA08E',
                            500: '#A3816B',
                            600: '#8A6853',
                            700: '#6E503F',
                            800: '#574032',
                            900: '#453329',
                            950: '#261A14',
                        },
                        // 莫蘭迪紅改為較輕柔的色調
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        },
                        // 莫蘭迪綠改為較輕柔的色調
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        amber: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro TC", "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #FBF9F6; 
            color: #574032;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .input-focus { transition: all 0.2s; }
        .input-focus:focus-within {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-color: #BCA08E; 
        }
        
        /* 動畫設定 */
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-slide-in-left { animation: slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* 避免 iOS Safari 點擊 input 或 select 時自動放大 */
        input:not(.text-4xl):not(.text-2xl):not(.text-3xl), 
        select, textarea { 
            font-size: 16px !important; 
        }

        /* 修復 iOS Date Input 破圖與高度壓縮問題 */
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 48px;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className, onClick }) => {
            const iconMap = {
                Plus: 'fa-solid fa-plus',
                Trash2: 'fa-regular fa-trash-can',
                Edit: 'fa-solid fa-pen-to-square',
                Users: 'fa-solid fa-user-group',
                Plane: 'fa-solid fa-plane',
                Bed: 'fa-solid fa-bed',
                Utensils: 'fa-solid fa-utensils',
                Bus: 'fa-solid fa-train-subway', 
                Ticket: 'fa-solid fa-ticket',
                ShoppingBag: 'fa-solid fa-bag-shopping',
                Wifi: 'fa-solid fa-wifi',
                Other: 'fa-solid fa-receipt',
                ArrowLeft: 'fa-solid fa-arrow-left',
                ArrowRight: 'fa-solid fa-arrow-right',
                Check: 'fa-solid fa-check',
                MapPin: 'fa-solid fa-location-dot',
                Calendar: 'fa-regular fa-calendar-days',
                ChevronDown: 'fa-solid fa-chevron-down',
                ChevronRight: 'fa-solid fa-chevron-right',
                MapPlane: 'fa-solid fa-plane-departure',
                Yen: 'fa-solid fa-yen-sign',
                Settings: 'fa-solid fa-gear',
                Cash: 'fa-solid fa-money-bill-wave',
                Visa: 'fa-brands fa-cc-visa',
                Mastercard: 'fa-brands fa-cc-mastercard',
                Jcb: 'fa-brands fa-cc-jcb', 
                Xmark: 'fa-solid fa-xmark',
                Bars: 'fa-solid fa-bars',
                FileInvoiceDollar: 'fa-solid fa-file-invoice-dollar',
                Wallet: 'fa-solid fa-wallet',
                RightLeft: 'fa-solid fa-right-left',
                MoneyBillTransfer: 'fa-solid fa-money-bill-transfer',
                List: 'fa-solid fa-list-ul',
            };

            const faClass = iconMap[name] || 'fa-solid fa-circle-question';

            return (
                <i 
                    className={`${faClass} ${className || ''}`} 
                    style={{ fontSize: size, width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                    onClick={onClick}
                ></i>
            );
        };

        // --- Constants ---
        const CATEGORIES = [
            { id: 'food', name: '餐飲', icon: 'Utensils' },
            { id: 'transport', name: '交通', icon: 'Bus' },
            { id: 'flight', name: '機票', icon: 'Plane' },
            { id: 'hotel', name: '住宿', icon: 'Bed' },
            { id: 'ticket', name: '門票', icon: 'Ticket' },
            { id: 'shopping', name: '購物', icon: 'ShoppingBag' },
            { id: 'wifi', name: '網路', icon: 'Wifi' },
            { id: 'other', name: '其他', icon: 'Other' },
        ];

        const PAYMENT_METHODS = [
            { id: 'cash', name: '現金', icon: null }, 
            { id: 'visa', name: 'VISA', icon: 'Visa' },
            { id: 'mastercard', name: 'Master', icon: 'Mastercard' },
            { id: 'jcb', name: 'JCB', icon: 'Jcb' }, 
        ];

        // --- Helper Functions ---
        const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);

        const calculateBaseTWD = (amount, currency, rate) => {
            const num = parseFloat(amount);
            if (isNaN(num)) return 0;
            return currency === 'JPY' ? Math.ceil(num * (parseFloat(rate) || 0)) : Math.ceil(num);
        };

        const calculateSplit = (expense, allFriends) => {
            const baseTWD = expense.baseTWD;
            const finalTotal = expense.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
            const count = expense.payerIds.length;
            const perPerson = count > 0 ? Math.ceil(finalTotal / count) : 0;
            return { finalTotal, perPerson };
        };

        const calculateFriendShare = (exp, targetId) => {
            if (!exp.payerIds.includes(targetId)) return 0;
            const baseTWD = exp.baseTWD;
            const finalTotal = exp.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;

            if (exp.splitMode === 'exact') {
                const exactAmt = parseFloat(exp.exactAmounts[targetId] || 0);
                const originalTotal = parseFloat(exp.originalAmount || 1);
                if (originalTotal === 0) return 0;
                
                const ratio = exactAmt / originalTotal;
                return Math.round(finalTotal * ratio);
            } else {
                return Math.ceil(finalTotal / exp.payerIds.length);
            }
        };

        const getOffsetDateString = (dateStr, offsetDays) => {
            if (!offsetDays || offsetDays === 0) return dateStr;
            const d = new Date(dateStr);
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        };

        // --- Main Component ---
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [phase, setPhase] = useState('trip');
            const [selectedDate, setSelectedDate] = useState('');
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            
            const [selectedDetailUserId, setSelectedDetailUserId] = useState(null);
            const [detailTab, setDetailTab] = useState('pre');
            const [detailSelectedTripDate, setDetailSelectedTripDate] = useState('');

            const [myName, setMyName] = useState(() => localStorage.getItem('tokyo_pro_my_name') || '我自己');
            const [friends, setFriends] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_friends')) || []; } catch { return []; } });
            const [expenses, setExpenses] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_expenses')) || []; } catch { return []; } });
            const [repayments, setRepayments] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_repayments')) || []; } catch { return []; } });
            const [lastRate, setLastRate] = useState(() => localStorage.getItem('tokyo_last_rate') || '0.22');
            const [rateConfig, setRateConfig] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_rates')) || {}; } catch { return {}; } });
            const [cardRateRules, setCardRateRules] = useState(() => { 
                try { return JSON.parse(localStorage.getItem('tokyo_pro_card_rules')) || { visa: 0, mastercard: 0, jcb: 0 }; } 
                catch { return { visa: 0, mastercard: 0, jcb: 0 }; } 
            });

            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({
                title: '', amount: '', currency: 'TWD', rate: lastRate,
                category: 'food', hasFee: false, payerIds: [], paidBy: 'me',
                date: new Date().toISOString().split('T')[0],
                paymentMethod: 'cash',
                note: '',
                splitMode: 'equal', 
                exactAmounts: {} 
            });
            const [newFriendName, setNewFriendName] = useState('');
            const [isFriendModalOpen, setIsFriendModalOpen] = useState(false);
            
            const [repaymentForm, setRepaymentForm] = useState({
                payerId: '', payeeId: 'me', amount: '', currency: 'TWD', 
                date: new Date().toISOString().split('T')[0], refDate: '', spotBuy: '', cashBuy: '', note: '', twdAmount: '',
                isDateLocked: false
            });
            
            const [isRateModalOpen, setIsRateModalOpen] = useState(false);
            const [rateForm, setRateForm] = useState({
                date: new Date().toISOString().split('T')[0],
                cash: '', visa: '', mastercard: '', jcb: '', spotBuy: '', cashBuy: ''
            });

            useEffect(() => { localStorage.setItem('tokyo_pro_my_name', myName); }, [myName]);
            useEffect(() => { localStorage.setItem('tokyo_pro_friends', JSON.stringify(friends)); }, [friends]);
            useEffect(() => { localStorage.setItem('tokyo_pro_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('tokyo_pro_repayments', JSON.stringify(repayments)); }, [repayments]);
            useEffect(() => { localStorage.setItem('tokyo_last_rate', lastRate); }, [lastRate]);
            useEffect(() => { localStorage.setItem('tokyo_pro_rates', JSON.stringify(rateConfig)); }, [rateConfig]);
            useEffect(() => { localStorage.setItem('tokyo_pro_card_rules', JSON.stringify(cardRateRules)); }, [cardRateRules]);

            const getRateForConfig = useCallback((date, method) => {
                let targetDate = date;
                if (method !== 'cash' && cardRateRules[method] !== undefined) {
                    targetDate = getOffsetDateString(date, cardRateRules[method]);
                }
                if (rateConfig[targetDate] && rateConfig[targetDate][method]) return rateConfig[targetDate][method];
                return lastRate;
            }, [rateConfig, lastRate, cardRateRules]);

            useEffect(() => {
                if (form.currency === 'JPY' && !editingId) {
                    const suggestedRate = getRateForConfig(form.date, form.paymentMethod);
                    setForm(prev => ({ ...prev, rate: suggestedRate }));
                }
            }, [form.date, form.paymentMethod, form.currency, getRateForConfig, editingId]);

            useEffect(() => {
                if (repaymentForm.currency === 'JPY' && repaymentForm.refDate) {
                    const sBuy = rateConfig[repaymentForm.refDate]?.spotBuy || '';
                    const cBuy = rateConfig[repaymentForm.refDate]?.cashBuy || '';
                    
                    setRepaymentForm(prev => {
                        let newTwd = prev.twdAmount;
                        let newJpy = prev.amount;
                        const parsedS = parseFloat(sBuy) || 0;
                        const parsedC = parseFloat(cBuy) || 0;
                        
                        if (parsedS > 0 && parsedC > 0) {
                             const eff = parsedS - (parsedS - parsedC) * 0.5;
                             if (prev.twdAmount && !prev.amount) {
                                 newJpy = Math.ceil(parseFloat(prev.twdAmount) / eff).toString();
                             } else if (prev.amount) {
                                 newTwd = Math.round(parseFloat(prev.amount) * eff).toString();
                             }
                        }
                        return { ...prev, spotBuy: sBuy, cashBuy: cBuy, twdAmount: newTwd, amount: newJpy };
                    });
                }
            }, [repaymentForm.refDate, repaymentForm.currency, rateConfig]); 

            // 統一排序處理：將符合條件的資料由新到舊排序
            const currentPhaseExpenses = useMemo(() => expenses.filter(e => e.phase === phase).sort((a,b) => new Date(b.date) - new Date(a.date)), [expenses, phase]);
            
            const preDates = useMemo(() => {
                const preExps = expenses.filter(e => e.phase === 'pre');
                const dates = [...new Set(preExps.map(e => e.date))];
                return dates.sort((a, b) => new Date(b) - new Date(a));
            }, [expenses]);
            
            const tripDates = useMemo(() => {
                const tripExps = expenses.filter(e => e.phase === 'trip');
                const dates = [...new Set(tripExps.map(e => e.date))];
                return dates.sort((a, b) => new Date(b) - new Date(a));
            }, [expenses]);

            useEffect(() => {
                if (phase === 'trip' && tripDates.length > 0 && !tripDates.includes(selectedDate)) {
                    setSelectedDate(tripDates[0]);
                }
            }, [tripDates, phase, selectedDate]);

            useEffect(() => {
                if (detailTab === 'trip' && tripDates.length > 0 && !tripDates.includes(detailSelectedTripDate)) {
                    setDetailSelectedTripDate(tripDates[0]);
                }
            }, [detailTab, tripDates, detailSelectedTripDate]);

            const selectedDateExpenses = useMemo(() => {
                if (phase !== 'trip' || !selectedDate) return [];
                return currentPhaseExpenses.filter(e => e.date === selectedDate);
            }, [currentPhaseExpenses, selectedDate, phase]);

            const selectedDateTotal = useMemo(() => {
                return selectedDateExpenses.reduce((sum, item) => {
                    const baseTWD = item.baseTWD;
                    const finalTotal = item.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
                    return sum + finalTotal;
                }, 0);
            }, [selectedDateExpenses]);

            const handleEdit = useCallback((exp) => {
                setEditingId(exp.id);
                setForm({
                    title: exp.title, amount: exp.originalAmount, currency: exp.currency, rate: exp.rate,
                    category: exp.category, hasFee: exp.hasFee, payerIds: exp.payerIds, paidBy: exp.paidBy,
                    date: exp.date, paymentMethod: exp.paymentMethod || 'cash',
                    note: exp.note || '',
                    splitMode: exp.splitMode || 'equal',
                    exactAmounts: exp.exactAmounts || {}
                });
                setPhase(exp.phase);
                setView('addExpense');
            }, []);

            const handleSaveExpense = () => {
                if (!form.title || !form.amount || form.payerIds.length === 0) return alert('請填寫完整資訊');
                
                if (form.splitMode === 'exact') {
                    const sumEntered = form.payerIds.reduce((acc, id) => acc + parseFloat(form.exactAmounts[id] || 0), 0);
                    const targetAmount = parseFloat(form.amount);
                    if (Math.abs(sumEntered - targetAmount) > 2) {
                        return alert(`個別分攤金額總和 (${sumEntered}) 與輸入總金額 (${targetAmount}) 落差過大，請修正後再儲存。`);
                    }
                }

                if (form.currency === 'JPY') setLastRate(form.rate);

                const baseTWD = calculateBaseTWD(form.amount, form.currency, form.rate);
                const newData = {
                    id: editingId || Date.now().toString(),
                    ...form,
                    originalAmount: parseFloat(form.amount),
                    baseTWD,
                    phase: phase
                };

                setExpenses(prev => editingId ? prev.map(e => e.id === editingId ? newData : e) : [newData, ...prev]);
                setForm(prev => ({ ...prev, title: '', amount: '', payerIds: [], paidBy: 'me', note: '', exactAmounts: {}, splitMode: 'equal' }));
                setEditingId(null);
                setView('dashboard');
                if (phase === 'trip') setSelectedDate(form.date);
            };

            const handleDeleteExpense = (id) => {
                if(confirm('確定刪除這筆花費？')) {
                    setExpenses(prev => prev.filter(e => e.id !== id));
                    if(editingId === id) setView('dashboard');
                }
            };

            const handleDeleteRepayment = (id) => {
                if(confirm('確定刪除這筆還款紀錄？')) {
                    setRepayments(prev => prev.filter(r => r.id !== id));
                }
            };

            const handleSaveRepayment = () => {
                if (!repaymentForm.payerId || !repaymentForm.payeeId) {
                    return alert('請填寫還款與收款人');
                }
                if (repaymentForm.payerId === repaymentForm.payeeId) {
                    return alert('還款人與收款人不能是同一人');
                }

                let finalTwdOffset = 0;
                let effectiveRate = null;

                if (repaymentForm.currency === 'TWD') {
                    finalTwdOffset = parseInt(repaymentForm.amount);
                    if (!finalTwdOffset) return alert('請輸入還款金額');
                } else {
                    finalTwdOffset = parseInt(repaymentForm.twdAmount);
                    if (!finalTwdOffset || !repaymentForm.amount) return alert('請輸入日幣還款金額或欲折抵台幣');
                    
                    const sBuy = parseFloat(repaymentForm.spotBuy) || 0;
                    const cBuy = parseFloat(repaymentForm.cashBuy) || 0;
                    if (sBuy === 0 || cBuy === 0) return alert('請輸入有效的即期買入與現鈔買入匯率');
                    
                    const costPerUnit = (sBuy - cBuy) * 0.5;
                    effectiveRate = sBuy - costPerUnit;
                }

                const newRepayment = {
                    id: Date.now().toString(),
                    ...repaymentForm,
                    effectiveRate,
                    amountTwd: finalTwdOffset
                };

                setRepayments(prev => [newRepayment, ...prev]);
                setView('checkoutDetail');
                setDetailTab('records'); 
            };

            const changeView = (newView) => {
                setView(newView);
                if (newView !== 'checkoutDetail' && newView !== 'addRepayment') {
                    setSelectedDetailUserId(null);
                }
            };

            // --- View: Settings ---
            if (view === 'settings') {
                const handleSaveRate = () => {
                    if (!rateForm.date) return alert('請選擇日期');
                    setRateConfig(prev => ({
                        ...prev,
                        [rateForm.date]: {
                            cash: rateForm.cash || prev[rateForm.date]?.cash || lastRate,
                            visa: rateForm.visa || prev[rateForm.date]?.visa || lastRate,
                            mastercard: rateForm.mastercard || prev[rateForm.date]?.mastercard || lastRate,
                            jcb: rateForm.jcb || prev[rateForm.date]?.jcb || lastRate,
                            spotBuy: rateForm.spotBuy || prev[rateForm.date]?.spotBuy || '',
                            cashBuy: rateForm.cashBuy || prev[rateForm.date]?.cashBuy || ''
                        }
                    }));
                    setIsRateModalOpen(false); 
                };

                const handleEditRate = (date, rates) => {
                    setRateForm({
                        date: date,
                        cash: rates.cash || '',
                        visa: rates.visa || '',
                        mastercard: rates.mastercard || '',
                        jcb: rates.jcb || '',
                        spotBuy: rates.spotBuy || '',
                        cashBuy: rates.cashBuy || ''
                    });
                    setIsRateModalOpen(true); 
                };

                const handleDeleteRate = (date) => {
                    const displayDate = date.replace(/-/g, '/');
                    if (confirm(`確定要刪除 ${displayDate} 的匯率設定嗎？`)) {
                        setRateConfig(prev => {
                            const newConfig = { ...prev };
                            delete newConfig[date];
                            return newConfig;
                        });
                    }
                };

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white relative pb-24 animate-fade-in">
                        <div className="bg-white sticky top-0 z-10 shadow-sm border-b border-primary-100 px-5 pt-5 pb-3">
                            <div className="flex items-center gap-2">
                                <button onClick={() => changeView('dashboard')} className="w-10 h-10 rounded-full flex items-center justify-center text-primary-900 hover:bg-primary-100 transition active:scale-95 -ml-2">
                                    <Icon name="ArrowLeft" size={24}/>
                                </button>
                                <h1 className="text-2xl font-black text-primary-900 tracking-tight">系統與匯率設定</h1>
                            </div>
                        </div>

                        <div className="p-6">
                            <div className="mb-6 space-y-3">
                                <h3 className="font-bold text-primary-400 text-xs uppercase tracking-wider pl-1">發卡組織匯率抓取規則</h3>
                                <div className="bg-primary-50 rounded-2xl p-4 border border-primary-100">
                                    <p className="text-xs text-primary-500 mb-3">設定記帳時，信用卡要抓取「當天」還是「前一日」的設定匯率。</p>
                                    <div className="space-y-3">
                                        {['visa', 'mastercard', 'jcb'].map(card => (
                                            <div key={card} className="flex justify-between items-center">
                                                <span className="text-sm font-bold text-primary-800 uppercase w-24">{card}</span>
                                                <div className="flex bg-white rounded-lg p-1 border border-primary-200">
                                                    <button onClick={() => setCardRateRules(prev => ({...prev, [card]: 0}))} className={`px-3 py-1 text-xs font-bold rounded-md transition ${cardRateRules[card] === 0 ? 'bg-primary-500 text-white shadow-sm' : 'text-primary-400 hover:text-primary-600'}`}>當天</button>
                                                    <button onClick={() => setCardRateRules(prev => ({...prev, [card]: -1}))} className={`px-3 py-1 text-xs font-bold rounded-md transition ${cardRateRules[card] === -1 ? 'bg-primary-500 text-white shadow-sm' : 'text-primary-400 hover:text-primary-600'}`}>前一日</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="space-y-2">
                                <h3 className="font-bold text-primary-400 text-xs uppercase tracking-wider pl-1">已設定日期匯率</h3>

                                                        <button onClick={() => { const newIds = isSelected ? form.payerIds.filter(pid => pid !== id) : [...form.payerIds, id]; setForm({...form, payerIds: newIds}); }} className="flex items-center gap-2 min-w-0 pr-2">
                                                            <div className={`w-4 h-4 flex-shrink-0 rounded-full flex items-center justify-center ${isSelected ? 'bg-primary-500 text-white' : 'bg-primary-200'}`}><Icon name="Check" size={10}/></div>
                                                            <span className={`truncate ${isSelected ? 'text-primary-800 font-bold' : 'text-primary-400'}`}>{name}</span>
                                                        </button>
                                                        {isSelected && (
                                                            <div className="flex items-center gap-1.5 flex-shrink-0">
                                                                <input type="number" inputMode="decimal" value={form.exactAmounts[id] || ''} onChange={e => setForm({...form, exactAmounts: {...form.exactAmounts, [id]: e.target.value}})} className="w-24 text-right bg-primary-50 p-1.5 rounded-md text-sm font-bold text-primary-800 outline-none focus:ring-1 focus:ring-primary-400" placeholder="0" />
                                                                <span className="text-xs font-bold text-primary-400 w-8">{form.currency}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) 
                                            })}
                                        </div>
                                    )}
                                </div>
                                
                                <hr className="border-primary-100 mt-2" />
                                
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">備註 (選填)</label>
                                    <textarea 
                                        value={form.note} 
                                        onChange={e => setForm({...form, note: e.target.value})} 
                                        className="w-full bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 text-[16px] resize-none leading-relaxed" 
                                        placeholder="新增備註說明..."
                                        rows="3"
                                    ></textarea>
                                </div>
                            </div>
                        </div>
                        <div className="p-4 border-t border-primary-100 bg-white sticky bottom-0 safe-bottom">
                            <div className="flex justify-between items-center mb-3 text-sm font-bold text-primary-500">
                                <span>{form.payerIds.length} 人分攤</span>
                                {form.splitMode === 'equal' ? (
                                    <span>每人: <span className="text-primary-800 text-lg">{formatMoney(perPerson)}</span></span>
                                ) : (
                                    <span className={Math.abs(exactRemaining) > 2 ? 'text-rose-500' : 'text-emerald-500'}>
                                        未分配: <span className="text-lg">{Math.abs(exactRemaining) > 0.01 ? exactRemaining.toFixed(1) : '0'}</span> {form.currency}
                                    </span>
                                )}
                            </div>
                            <button onClick={handleSaveExpense} className="w-full bg-primary-800 text-white py-3.5 rounded-xl font-bold shadow-md active:scale-[0.98] transition hover:bg-primary-900">確認記帳</button>
                        </div>
                    </div>
                );
            }

            // --- View: Add Repayment ---
            if (view === 'addRepayment') {
                const isJPY = repaymentForm.currency === 'JPY';
                
                let effRate = 0;
                const s = parseFloat(repaymentForm.spotBuy) || 0;
                const c = parseFloat(repaymentForm.cashBuy) || 0;
                if (s > 0 && c > 0) {
                    effRate = s - (s - c) * 0.5;
                }

                const effectiveRateStr = effRate > 0 ? effRate.toFixed(4) : '-';

                const handleMainAmountChange = (e) => {
                    const val = e.target.value;
                    if (isJPY) {
                        const twd = (val && effRate > 0) ? Math.round(parseFloat(val) * effRate).toString() : '';
                        setRepaymentForm(prev => ({ ...prev, amount: val, twdAmount: twd }));
                    } else {
                        setRepaymentForm(prev => ({ ...prev, amount: val }));
                    }
                };

                const handleTwdAmountChange = (e) => {
                    const val = e.target.value;
                    const jpy = (val && effRate > 0) ? Math.ceil(parseFloat(val) / effRate).toString() : '';
                    setRepaymentForm(prev => ({ ...prev, twdAmount: val, amount: jpy }));
                };

                const handleManualRateChange = (field, val) => {
                    setRepaymentForm(prev => {
                        const next = { ...prev, [field]: val };
                        const sVal = parseFloat(next.spotBuy) || 0;
                        const cVal = parseFloat(next.cashBuy) || 0;
                        if (sVal > 0 && cVal > 0) {
                             const newEff = sVal - (sVal - cVal) * 0.5;
                             if (next.twdAmount) {
                                 next.amount = Math.ceil(parseFloat(next.twdAmount) / newEff).toString();
                             } else if (next.amount) {
                                 next.twdAmount = Math.round(parseFloat(next.amount) * newEff).toString();
                             }
                        }
                        return next;
                    });
                };

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in">
                        <div className="bg-white sticky top-0 z-10 shadow-sm border-b border-primary-100 px-5 pt-5 pb-3">
                            <div className="flex items-center gap-2">
                                <button onClick={() => changeView('checkoutDetail')} className="w-10 h-10 rounded-full flex items-center justify-center text-primary-900 hover:bg-primary-100 transition active:scale-95 -ml-2">
                                    <Icon name="ArrowLeft" size={24}/>
                                </button>
                                <h1 className="text-2xl font-black text-primary-900 tracking-tight">新增收支紀錄</h1>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 pb-32">
                            <div><label className="text-xs font-bold text-primary-400 block mb-1">記錄日期</label><input type="date" value={repaymentForm.date} onChange={e => setRepaymentForm({...repaymentForm, date: e.target.value})} className="w-full appearance-none block bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none text-[16px] text-center" /></div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">還款人 (付款方)</label>
                                    <div className="relative">
                                        <select value={repaymentForm.payerId} onChange={e => setRepaymentForm({...repaymentForm, payerId: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-rose-600 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                            <option value="" disabled>選擇成員</option>
                                            <option value="me">{myName}</option>
                                            {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                        </select>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">收款人 (收款方)</label>
                                    <div className="relative">
                                        <select value={repaymentForm.payeeId} onChange={e => setRepaymentForm({...repaymentForm, payeeId: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-emerald-600 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                            <option value="" disabled>選擇成員</option>
                                            <option value="me">{myName}</option>
                                            {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                        </select>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                    </div>
                                </div>
                            </div>

                            <hr className="border-primary-100" />

                            <div className="space-y-4">
                                <div className="flex justify-between items-end">
                                    <label className="text-xs font-bold text-primary-400">輸入金額 & 幣別</label>
                                    <div className="flex bg-primary-100 rounded-lg p-1">
                                        {['TWD', 'JPY'].map(c => (
                                            <button key={c} onClick={() => setRepaymentForm({...repaymentForm, currency: c})} className={`px-3 py-1 rounded-md text-xs font-bold transition ${repaymentForm.currency === c ? 'bg-white shadow text-primary-800' : 'text-primary-400'}`}>{c}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="relative input-focus bg-primary-50 rounded-2xl border border-transparent flex items-center">
                                    <input 
                                        type="number" 
                                        inputMode="decimal" 
                                        value={repaymentForm.amount} 
                                        onChange={handleMainAmountChange} 
                                        className="w-full bg-transparent p-4 text-4xl font-black text-primary-800 outline-none placeholder-primary-200" 
                                        placeholder={isJPY ? "輸入日幣" : "0"} 
                                    />
                                    {isJPY && <span className="pr-4 font-bold text-primary-300">JPY</span>}
                                </div>
                            </div>

                            {isJPY && (
                                <div className="bg-amber-50 rounded-2xl p-5 border border-amber-100 space-y-4 animate-fade-in">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="text-amber-700 font-bold text-sm flex items-center gap-2">
                                            <Icon name="RightLeft" size={16} /> 日幣現鈔智慧換算
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="text-[10px] font-bold text-amber-600 block mb-1 uppercase tracking-wider">選擇對應消費日 (自動抓匯率)</label>
                                        <div className="relative">
                                            <select 
                                                value={repaymentForm.refDate} 
                                                onChange={e => setRepaymentForm({...repaymentForm, refDate: e.target.value})} 
                                                disabled={repaymentForm.isDateLocked}
                                                className={`w-full appearance-none bg-white p-3 rounded-xl font-bold outline-none border transition text-[16px] ${repaymentForm.isDateLocked ? 'border-transparent opacity-70 text-amber-700' : 'border-amber-200 focus:border-amber-400 text-amber-900'}`}
                                            >
                                                <option value="" disabled>請選擇消費日</option>
                                                {[...new Set([...preDates, ...tripDates])].sort().map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                            </select>
                                            {!repaymentForm.isDateLocked && <div className="absolute right-3 top-1/2 -translate-y-1/2 text-amber-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] font-bold text-amber-600 block mb-1">即期買入</label>
                                            <input type="number" step="0.0001" value={repaymentForm.spotBuy} onChange={e => handleManualRateChange('spotBuy', e.target.value)} placeholder="0.2002" className="w-full bg-white border border-amber-200 p-2.5 rounded-xl font-bold outline-none focus:border-amber-400 transition text-[16px] text-amber-900" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-amber-600 block mb-1">現鈔買入</label>
                                            <input type="number" step="0.0001" value={repaymentForm.cashBuy} onChange={e => handleManualRateChange('cashBuy', e.target.value)} placeholder="0.1937" className="w-full bg-white border border-amber-200 p-2.5 rounded-xl font-bold outline-none focus:border-amber-400 transition text-[16px] text-amber-900" />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white/60 p-3 rounded-xl border border-amber-200/50 mt-2">
                                        <div className="flex justify-between items-center mb-2 pb-2 border-b border-amber-200/50 text-[12px] text-amber-800">
                                            <div>
                                                <span className="block font-bold">目前有效匯率</span>
                                            </div>
                                            <span className="font-black text-lg">{effectiveRateStr}</span>
                                        </div>
                                        
                                        <div className="flex justify-between items-center pt-1">
                                            <span className="font-bold text-amber-800 text-[12px]">欲折抵台幣總額 <br/><span className="text-[9px] font-normal opacity-80">(直接輸入，自動推算日幣)</span></span>
                                            <div className="flex items-center gap-1.5">
                                                <input 
                                                    type="number" 
                                                    inputMode="decimal" 
                                                    value={repaymentForm.twdAmount} 
                                                    onChange={handleTwdAmountChange} 
                                                    placeholder="輸入台幣" 
                                                    className="w-24 text-right bg-white p-2 rounded-md text-sm font-black text-rose-600 outline-none border border-amber-200 focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-all"
                                                />
                                                <span className="text-xs font-bold text-amber-600">TWD</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="text-xs font-bold text-primary-400 block mb-1">備註 (選填)</label>
                                <textarea 
                                    value={repaymentForm.note} 
                                    onChange={e => setRepaymentForm({...repaymentForm, note: e.target.value})} 
                                    className="w-full bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 text-[16px] resize-none leading-relaxed" 
                                    placeholder="例：午餐代墊還款..."
                                    rows="2"
                                ></textarea>
                            </div>
                        </div>

                        <div className="p-4 border-t border-primary-100 bg-white sticky bottom-0 safe-bottom">
                            {isJPY && repaymentForm.amount && (
                                <div className="text-center text-xs font-bold text-primary-500 mb-3 animate-fade-in">
                                    此筆將折抵收款人 <span className="text-primary-800 text-base mx-1 bg-primary-50 px-2 py-0.5 rounded">{formatMoney(repaymentForm.twdAmount || 0)}</span> TWD 欠款
                                </div>
                            )}
                            <button onClick={handleSaveRepayment} className="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold shadow-md active:scale-[0.98] transition hover:bg-emerald-700">儲存紀錄</button>
                        </div>
                    </div>
                );
            }

            // --- View: Summary ---
            if (view === 'summary') {
                return (
                    <div className="max-w-3xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in relative pb-24">
                        <div className="bg-white sticky top-0 z-20 shadow-sm border-b border-primary-100">
                            <div className="px-5 pt-5 pb-3 flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <button onClick={() => changeView('dashboard')} className="w-10 h-10 rounded-full flex items-center justify-center text-primary-900 hover:bg-primary-100 transition active:scale-95 -ml-2">
                                        <Icon name="ArrowLeft" size={24}/>
                                    </button>
                                    <h1 className="text-2xl font-black text-primary-900 tracking-tight">結算清單</h1>
                                </div>
                            </div>
                            <div className="flex px-5 pb-4 gap-4 mt-2">
                                <button onClick={() => { setPhase('pre'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前</button>
                                <button onClick={() => { setPhase('trip'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中</button>
                            </div>
                        </div>

                        <div className="p-4 space-y-4">
                            {(() => {
                                if (phase === 'trip' && (!selectedDate || tripDates.length === 0)) {
                                    return (
                                        <div className="text-center py-12 animate-fade-in">
                                            <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="MapPlane" size={32} className="text-primary-200" /></div>
                                            <p className="text-primary-400 font-bold">無旅程中消費紀錄</p>
                                        </div>
                                    );
                                }

                                const users = { 'me': { id: 'me', name: myName, paid: 0, shouldPay: 0 } };
                                friends.forEach(f => users[f.id] = { id: f.id, name: f.name, paid: 0, shouldPay: 0 });

                                const currentExpenses = phase === 'pre' 
                                    ? expenses.filter(e => e.phase === 'pre') 
                                    : expenses.filter(e => e.phase === 'trip' && e.date === selectedDate);

                                if (currentExpenses.length === 0) {
                                    return (
                                        <div className="text-center py-12 animate-fade-in">
                                            <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="Check" size={32} className="text-primary-200" /></div>
                                            <p className="text-primary-400 font-bold">目前無帳目需要結算</p>
                                        </div>
                                    );
                                }

                                const totalPhaseExpense = currentExpenses.reduce((sum, exp) => sum + (exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD), 0);

                                currentExpenses.forEach(exp => {
                                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                                    if (users[exp.paidBy]) users[exp.paidBy].paid += finalTotal;
                                    exp.payerIds.forEach(pid => {
                                        if (users[pid]) users[pid].shouldPay += calculateFriendShare(exp, pid);
                                    });
                                });

                                const balances = Object.values(users).map(u => ({
                                    ...u,
                                    net: u.shouldPay - u.paid
                                }));

                                let center;
                                if (phase === 'pre') {
                                    center = balances.find(b => b.id === 'me');
                                } else {
                                    center = balances.reduce((max, u) => u.paid > max.paid ? u : max, balances[0]);
                                }

                                const others = balances.filter(b => b.id !== center.id);
                                const othersNetSum = others.reduce((sum, b) => sum + b.net, 0);
                                center.net = -othersNetSum;
                                center.shouldPay = center.paid + center.net;

                                const displayBalances = [
                                    balances.find(b => b.id === 'me'),
                                    ...balances.filter(b => b.id !== 'me')
                                ];

                                return (
                                    <div className="animate-fade-in">
                                        {phase === 'trip' ? (
                                            <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                                <div className="relative w-[150px] flex-shrink-0">
                                                    <select value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); setSelectedDetailUserId(null); }} className="w-full appearance-none bg-primary-50 py-2.5 pl-3 pr-8 rounded-xl font-bold text-primary-800 outline-none border border-transparent focus:border-primary-300 transition text-[16px] text-center">
                                                        {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                                    </select>
                                                    <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                                </div>
                                                <div className="flex-1 text-right pr-1">
                                                    <div className="text-[10px] font-bold text-primary-400 mb-0.5">本日花費總額</div>
                                                    <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(totalPhaseExpense)}</div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                                <div className="flex items-center gap-3 pl-3 py-1 flex-shrink-0">
                                                    <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                                                        <Icon name="Calendar" size={20} />
                                                    </div>
                                                    <span className="font-bold text-primary-800 text-[16px]">出發前</span>
                                                </div>
                                                <div className="flex-1 text-right pr-1">
                                                    <div className="text-[10px] font-bold text-primary-400 mb-0.5">行前花費總額</div>
                                                    <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(totalPhaseExpense)}</div>
                                                </div>
                                            </div>
                                        )}

                                        <h3 className="text-xs font-bold text-primary-400 uppercase tracking-widest mb-3 pl-1">結算明細</h3>
                                        <div className="space-y-3">
                                            {displayBalances.map(b => {
                                                const isCenter = b.id === center.id;
                                                let statusLabel, statusAmount, statusColor;

                                                if (isCenter) {
                                                    if (b.net < 0) {
                                                        statusLabel = '總應收回';
                                                        statusAmount = formatMoney(Math.abs(b.net));
                                                        statusColor = 'emerald';
                                                    } else if (b.net > 0) {
                                                        statusLabel = '總應付給他人';
                                                        statusAmount = formatMoney(b.net);
                                                        statusColor = 'rose';
                                                    } else {
                                                        statusLabel = '剛好打平';
                                                        statusColor = 'gray';
                                                    }
                                                } else {
                                                    const centerName = center.id === 'me' ? myName : center.name;
                                                    if (b.net > 0) {
                                                        statusLabel = `應付給 ${centerName}`;
                                                        statusAmount = formatMoney(b.net);
                                                        statusColor = 'rose';
                                                    } else if (b.net < 0) {
                                                        statusLabel = `${centerName} 需退還`;
                                                        statusAmount = formatMoney(Math.abs(b.net));
                                                        statusColor = 'emerald';
                                                    } else {
                                                        statusLabel = '剛好打平';
                                                        statusColor = 'gray';
                                                    }
                                                }

                                                return (
                                                    <div 
                                                        key={b.id} 
                                                        className="bg-white border border-primary-100 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer hover:border-primary-300 hover:shadow-md transition-all active:scale-[0.98]"
                                                        onClick={() => setSelectedDetailUserId(b.id)}
                                                    >
                                                        <div className="flex items-center gap-3 min-w-0 pr-2">
                                                            <div className="w-10 h-10 rounded-full bg-primary-50 text-primary-700 font-bold flex items-center justify-center flex-shrink-0 border border-primary-100">
                                                                {b.id === 'me' ? (myName || '我')[0] : (b.name || '某')[0]}
                                                            </div>
                                                            <span className="font-bold text-primary-900 truncate">{b.id === 'me' ? myName : b.name}</span>
                                                        </div>
                                                        <div className="text-right flex-shrink-0">
                                                            {statusColor !== 'gray' ? (
                                                                <div>
                                                                    <div className={`text-[10px] font-bold text-${statusColor}-500 mb-0.5`}>{statusLabel}</div>
                                                                    <div className={`font-black text-${statusColor}-600 text-lg`}>{statusAmount}</div>
                                                                </div>
                                                            ) : (
                                                                <div className="font-bold text-primary-400 bg-primary-50 px-3 py-1 rounded-lg text-xs border border-primary-100">剛好打平</div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                );
            }

            // --- View: Checkout List ---
            if (view === 'checkoutList') {
                const users = { 'me': { id: 'me', name: myName }, ...friends.reduce((acc, f) => ({...acc, [f.id]: f}), {}) };
                Object.keys(users).forEach(id => {
                    users[id].totalExpenseDebt = 0; 
                    users[id].totalPaid = 0;        
                    users[id].repaidOut = 0;        
                    users[id].repaidIn = 0;         
                });

                expenses.forEach(exp => {
                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                    if (users[exp.paidBy]) users[exp.paidBy].totalPaid += finalTotal;
                    exp.payerIds.forEach(pid => {

                                        <div className="w-9 h-9 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Wallet" size={16}/></div>
                                        收付款紀錄
                                    </button>
                                    <hr className="my-2 border-primary-100 mx-6"/>
                                    <button onClick={() => { changeView('settings'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-3.5 font-bold text-primary-800 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-9 h-9 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Settings" size={16}/></div>
                                        系統與匯率管理
                                    </button>
                                    <button onClick={() => { changeView('friends'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-3.5 font-bold text-primary-800 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-9 h-9 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Users" size={16}/></div>
                                        成員管理
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white sticky top-0 z-10 shadow-sm border-b border-primary-100 px-5 pt-5 pb-3">
                        <div className="flex items-center justify-between relative">
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsMenuOpen(true)} className="w-10 h-10 rounded-full flex items-center justify-center text-primary-900 hover:bg-primary-100 transition active:scale-95 -ml-2">
                                    <Icon name="Bars" size={24} />
                                </button>
                                <h1 className="text-2xl font-black text-primary-900 tracking-tight">旅遊分帳</h1>
                            </div>
                        </div>
                        <div className="flex pb-1 gap-4 mt-3">
                            <button onClick={() => setPhase('pre')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前 (行前款)</button>
                            <button onClick={() => setPhase('trip')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中 (當地消費)</button>
                        </div>
                    </div>

                    <div className="p-4 space-y-4">
                        <div className="animate-fade-in">
                            {/* Trip 日期選單與當日總額 */}
                            {phase === 'trip' && (
                                tripDates.length > 0 ? (
                                    <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                        <div className="relative w-[150px] flex-shrink-0">
                                            <select value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="w-full appearance-none bg-primary-50 py-2.5 pl-3 pr-8 rounded-xl font-bold text-primary-800 outline-none border border-transparent focus:border-primary-300 transition text-[16px] text-center">
                                                {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                            </select>
                                            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                        <div className="flex-1 text-right pr-1">
                                            <div className="text-[10px] font-bold text-primary-400 mb-0.5">當日總額</div>
                                            <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(selectedDateTotal)}</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-12">
                                        <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="MapPlane" size={32} className="text-primary-200" /></div>
                                        <p className="text-primary-400 font-bold">尚未新增當地消費</p>
                                        <p className="text-xs text-primary-300 mt-1">點擊右下角按鈕開始記帳</p>
                                    </div>
                                )
                            )}

                            {/* Pre 空狀態 */}
                            {phase === 'pre' && expensesToRender.length === 0 && (
                                <div className="text-center py-12 animate-fade-in">
                                    <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="Calendar" size={32} className="text-primary-200" /></div>
                                    <p className="text-primary-400 font-bold">尚未新增行前花費</p>
                                    <p className="text-xs text-primary-300 mt-1">點擊右下角按鈕開始記帳</p>
                                </div>
                            )}

                            {/* 帳目列表 */}
                            {expensesToRender.length > 0 && (
                                <div className="mt-4 bg-white rounded-2xl border border-primary-100 shadow-sm overflow-hidden animate-fade-in">
                                    <div className="divide-y divide-primary-50">
                                        {expensesToRender.map(exp => {
                                            return (
                                                <div key={exp.id} className="p-4 flex justify-between items-start cursor-pointer hover:bg-primary-50 transition active:bg-primary-100" onClick={() => handleEdit(exp)}>
                                                    <div className="flex items-start gap-3 flex-1 min-w-0 pr-4">
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 shadow-inner mt-0.5 ${phase === 'pre' ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                                            <Icon name={CATEGORIES.find(c=>c.id===exp.category)?.icon} />
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="font-bold text-primary-800 text-[16px] leading-snug whitespace-normal break-words">{exp.title}</div>
                                                            {exp.note && <div className="text-xs text-primary-500 mt-1 line-clamp-1">{exp.note}</div>}
                                                            <div className="text-xs text-primary-400 mt-1.5 flex items-center gap-1">
                                                                {exp.date.replace(/-/g, '/')} • 由 {exp.paidBy === 'me' ? myName : friends.find(f=>f.id===exp.paidBy)?.name} 代墊
                                                                {exp.splitMode === 'exact' && <span className="ml-1 bg-primary-100 text-primary-600 px-1 rounded text-[9px] font-bold">自訂分配</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="font-bold text-primary-700 whitespace-nowrap pt-0.5">
                                                        {formatMoney(exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD)}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <button onClick={() => { setEditingId(null); setForm(prev => ({...prev, title: '', amount: '', payerIds: [], paidBy: 'me', splitMode: 'equal', exactAmounts: {}, note: ''})); changeView('addExpense'); }} className={`fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-md text-white flex items-center justify-center active:scale-[0.85] transition-transform transform hover:scale-105 z-30 ${phase === 'pre' ? 'bg-amber-600' : 'bg-primary-800'}`}><Icon name="Plus" size={28} /></button>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
