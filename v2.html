                                                            <Icon name={isPre ? 'Calendar' : 'MapPlane'} size={16} />
                                                        </div>
                                                        <span className="font-bold text-primary-900 text-[16px]">{label}</span>
                                                    </div>
                                                    <div className={`text-right font-black text-lg ${net > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                                        {net > 0 ? `應付 +${formatMoney(net)}` : `代墊 ${formatMoney(Math.abs(net))}`}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                        {Object.values(dailyNet).every(n => n === 0) && (
                                            <div className="p-10 text-center">
                                                <div className="w-16 h-16 bg-primary-50 text-primary-200 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name="Utensils" size={24} /></div>
                                                <p className="text-primary-400 font-bold text-sm">無費用產生</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Tab Content: 收付款紀錄 */}
                            {detailTab === 'records' && (
                                <div className="animate-fade-in">
                                    {userRepayments.length === 0 ? (
                                        <div className="bg-white rounded-3xl border border-primary-100 border-dashed p-10 text-center shadow-sm">
                                            <div className="w-16 h-16 bg-primary-50 text-primary-300 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="RightLeft" size={24} /></div>
                                            <p className="text-primary-500 font-bold text-sm">無收付款紀錄</p>
                                            <p className="text-primary-300 text-xs mt-1.5">點擊右下角按鈕新增紀錄</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {userRepayments.sort((a,b) => new Date(b.id) - new Date(a.id)).map(rep => {
                                                const isPayer = rep.payerId === userId;
                                                const otherId = isPayer ? rep.payeeId : rep.payerId;
                                                const otherName = otherId === 'me' ? myName : (friends.find(f => f.id === otherId)?.name || '未知');
                                                
                                                return (
                                                    <div key={rep.id} className="bg-white border border-primary-100 rounded-3xl p-5 shadow-sm flex items-start gap-4">
                                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 shadow-inner mt-1 ${isPayer ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}`}>
                                                            <Icon name={isPayer ? 'ArrowRight' : 'ArrowLeft'} size={20} />
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex justify-between items-start mb-1">
                                                                <span className="font-bold text-primary-900 text-[16px] truncate leading-tight mt-0.5">
                                                                    {isPayer ? `支付給 ${otherName}` : `收到來自 ${otherName}`}
                                                                </span>
                                                                <div className={`font-black whitespace-nowrap ml-2 text-xl leading-none ${isPayer ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                    {isPayer ? '-' : '+'}{formatMoney(rep.amountTwd)}
                                                                </div>
                                                            </div>
                                                            <div className="text-xs text-primary-400 flex justify-between items-center mb-1.5">
                                                                <div className="flex items-center gap-1.5 mt-1">
                                                                    <span>{rep.date.replace(/-/g, '/')}</span>
                                                                    {rep.currency === 'JPY' && <span className="bg-primary-50 px-2 py-0.5 rounded-md text-[10px] font-bold text-primary-500 border border-primary-100 shadow-sm">¥{parseFloat(rep.amount).toLocaleString()}</span>}
                                                                </div>
                                                                <button onClick={() => handleDeleteRepayment(rep.id)} className="text-primary-300 hover:text-rose-500 transition py-1 px-2 -mr-2 rounded flex items-center gap-1 bg-white">
                                                                    <Icon name="Trash2" size={12} /> 刪除
                                                                </button>
                                                            </div>
                                                            {rep.note && <div className="text-[12px] text-primary-600 mt-2 bg-primary-50/50 p-2.5 rounded-xl truncate border border-primary-50">{rep.note}</div>}
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* FAB 新增還款按鈕 (永遠顯示在結帳明細頁的右下角) */}
                        <button onClick={() => {
                            // 自動決定誰付給誰 (欠錢的人是 Payer)
                            const defaultPayer = globalNet > 0 ? userId : 'me';
                            const defaultPayee = globalNet > 0 ? 'me' : userId;
                            
                            setRepaymentForm({
                                payerId: defaultPayer, payeeId: defaultPayee, amount: '', currency: 'TWD', 
                                date: new Date().toISOString().split('T')[0], refDate: tripDates[tripDates.length - 1] || '', 
                                spotBuy: '', cashBuy: '', note: ''
                            });
                            changeView('addRepayment');
                        }} className="fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-md bg-emerald-600 text-white flex items-center justify-center active:scale-90 transition transform hover:scale-105 z-30">
                            <Icon name="Plus" size={28} />
                        </button>
                    </div>
                );
            }

            // --- View: Dashboard ---
            const expensesToRender = phase === 'pre' ? currentPhaseExpenses : selectedDateExpenses;

            return (
                <div className="max-w-3xl mx-auto min-h-screen pb-24 relative animate-fade-in">
                    
                    {/* 左側抽屜選單 Modal */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            {/* 半透明遮罩 */}
                            <div className="absolute inset-0 bg-primary-950/40 backdrop-blur-sm transition-opacity animate-fade-in" onClick={() => setIsMenuOpen(false)}></div>
                            
                            {/* 滑出式選單 */}
                            <div className="relative w-72 max-w-[80%] bg-white h-full shadow-2xl flex flex-col animate-slide-in-left">
                                <div className="p-6 border-b border-primary-100 flex items-center justify-between bg-primary-50">
                                    <h2 className="text-xl font-black text-primary-900">設定</h2>
                                    <button onClick={() => setIsMenuOpen(false)} className="text-primary-400 p-2 -mr-2 hover:bg-white rounded-full transition"><Icon name="Xmark" size={20}/></button>
                                </div>
                                <div className="flex-1 py-4">
                                    <button onClick={() => { changeView('settings'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 font-bold text-primary-700 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Settings" size={16}/></div>
                                        匯率管理
                                    </button>
                                    <button onClick={() => { changeView('friends'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 font-bold text-primary-700 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Users" size={16}/></div>
                                        成員管理
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white sticky top-0 z-10 shadow-sm border-b border-primary-100">
                        <div className="px-5 pt-6 pb-2 flex items-center justify-between relative">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsMenuOpen(true)} className="p-2 -ml-2 text-primary-900 rounded-full hover:bg-primary-50 transition active:scale-95">
                                    <Icon name="Bars" size={24} />
                                </button>
                                <h1 className="text-2xl font-black text-primary-900 tracking-tight">旅遊分帳</h1>
                            </div>
                            
                            <button onClick={() => changeView('summary')} className="flex items-center gap-1.5 bg-primary-100 text-primary-700 px-3 py-1.5 rounded-full font-bold text-sm hover:bg-primary-200 transition active:scale-95 shadow-sm">
                                <Icon name="FileInvoiceDollar" size={14} />
                                結算清單
                            </button>
                        </div>
                        <div className="flex px-5 pb-4 gap-4 mt-2">
                            <button onClick={() => setPhase('pre')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前 (行前款)</button>
                            <button onClick={() => setPhase('trip')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中 (當地消費)</button>
                        </div>
                    </div>

                    <div className="p-4 space-y-4">
                        <div className="animate-fade-in">
                            {/* Trip 日期選單與當日總額 */}

                                            <div className="text-[10px] font-bold text-primary-400 mb-0.5">當日總額</div>

                        </div>
                    </div>
                    <button onClick={() => { setEditingId(null); setForm(prev => ({...prev, title: '', amount: '', payerIds: [], paidBy: 'me', splitMode: 'equal', exactAmounts: {}, note: ''})); changeView('addExpense'); }} className={`fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-md text-white flex items-center justify-center active:scale-[0.85] transition-transform transform hover:scale-105 z-30 ${phase === 'pre' ? 'bg-amber-600' : 'bg-primary-800'}`}><Icon name="Plus" size={28} /></button>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
