<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 防快取機制：確保 Web App 每次重整都抓取最新版本 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>旅遊分帳 Pro Max</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f4f7fb',
                            100: '#e9eef5',
                            200: '#cedce9',
                            300: '#a2bed7',
                            400: '#709bc0',
                            500: '#4a78a0',
                            600: '#3c658d',
                            700: '#315273',
                            800: '#2c4660',
                            900: '#293c51',
                            950: '#1b2736',
                        },
                        accent: {
                            500: '#e11d48',
                            600: '#be123c',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro TC", "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f4f7fb; 
            color: #2c4660;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .input-focus { transition: all 0.2s; }
        .input-focus:focus-within {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-color: #709bc0; 
        }
        
        /* 動畫設定 */
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-slide-in-left { animation: slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* 避免 iOS Safari 點擊 input 或 select 時自動放大 */
        input:not(.text-4xl):not(.text-2xl):not(.text-3xl), 
        select, textarea { 
            font-size: 16px !important; 
        }

        /* 修復 iOS Date Input 破圖與高度壓縮問題 */
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 48px;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className, onClick }) => {
            const iconMap = {
                Plus: 'fa-solid fa-plus',
                Trash2: 'fa-regular fa-trash-can',
                Edit: 'fa-solid fa-pen-to-square',
                Users: 'fa-solid fa-user-group',
                Plane: 'fa-solid fa-plane',
                Bed: 'fa-solid fa-bed',
                Utensils: 'fa-solid fa-utensils',
                Bus: 'fa-solid fa-train-subway', 
                Ticket: 'fa-solid fa-ticket',
                ShoppingBag: 'fa-solid fa-bag-shopping',
                Wifi: 'fa-solid fa-wifi',
                Other: 'fa-solid fa-receipt',
                ArrowLeft: 'fa-solid fa-arrow-left',
                Check: 'fa-solid fa-check',
                MapPin: 'fa-solid fa-location-dot',
                Calendar: 'fa-regular fa-calendar-days',
                ChevronDown: 'fa-solid fa-chevron-down',
                ChevronRight: 'fa-solid fa-chevron-right',
                MapPlane: 'fa-solid fa-plane-departure',
                Yen: 'fa-solid fa-yen-sign',
                Settings: 'fa-solid fa-gear',
                Cash: 'fa-solid fa-money-bill-wave',
                Visa: 'fa-brands fa-cc-visa',
                Mastercard: 'fa-brands fa-cc-mastercard',
                Jcb: 'fa-brands fa-cc-jcb', 
                Xmark: 'fa-solid fa-xmark',
                Bars: 'fa-solid fa-bars',
                FileInvoiceDollar: 'fa-solid fa-file-invoice-dollar',
            };

            const faClass = iconMap[name] || 'fa-solid fa-circle-question';

            return (
                <i 
                    className={`${faClass} ${className || ''}`} 
                    style={{ fontSize: size, width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                    onClick={onClick}
                ></i>
            );
        };

        // --- Constants ---
        const CATEGORIES = [
            { id: 'food', name: '餐飲', icon: 'Utensils' },
            { id: 'transport', name: '交通', icon: 'Bus' },
            { id: 'flight', name: '機票', icon: 'Plane' },
            { id: 'hotel', name: '住宿', icon: 'Bed' },
            { id: 'ticket', name: '門票', icon: 'Ticket' },
            { id: 'shopping', name: '購物', icon: 'ShoppingBag' },
            { id: 'wifi', name: '網路', icon: 'Wifi' },
            { id: 'other', name: '其他', icon: 'Other' },
        ];

        const PAYMENT_METHODS = [
            { id: 'cash', name: '現金', icon: null }, 
            { id: 'visa', name: 'VISA', icon: 'Visa' },
            { id: 'mastercard', name: 'Master', icon: 'Mastercard' },
            { id: 'jcb', name: 'JCB', icon: 'Jcb' }, 
        ];

        // --- Helper Functions ---
        const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);

        const calculateBaseTWD = (amount, currency, rate) => {
            const num = parseFloat(amount);
            if (isNaN(num)) return 0;
            return currency === 'JPY' ? Math.ceil(num * (parseFloat(rate) || 0)) : Math.ceil(num);
        };

        const calculateSplit = (expense, allFriends) => {
            const baseTWD = expense.baseTWD;
            const finalTotal = expense.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
            const count = expense.payerIds.length;
            const perPerson = count > 0 ? Math.ceil(finalTotal / count) : 0;
            return { finalTotal, perPerson };
        };

        const calculateFriendShare = (exp, targetId) => {
            if (!exp.payerIds.includes(targetId)) return 0;
            const baseTWD = exp.baseTWD;
            const finalTotal = exp.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;

            if (exp.splitMode === 'exact') {
                const exactAmt = parseFloat(exp.exactAmounts[targetId] || 0);
                const originalTotal = parseFloat(exp.originalAmount || 1);
                if (originalTotal === 0) return 0;
                
                // 改用「比例」來分攤最後台幣總額，大幅降低浮點數運算及匯率換算帶來的四捨五入落差
                const ratio = exactAmt / originalTotal;
                return Math.round(finalTotal * ratio);
            } else {
                return Math.ceil(finalTotal / exp.payerIds.length);
            }
        };

        // --- Main Component ---
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [phase, setPhase] = useState('trip');
            const [selectedDate, setSelectedDate] = useState('');
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            
            // 個人結算明細 Modal 狀態
            const [selectedDetailUserId, setSelectedDetailUserId] = useState(null);

            // Data State
            const [myName, setMyName] = useState(() => localStorage.getItem('tokyo_pro_my_name') || '我自己');
            const [friends, setFriends] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_friends')) || []; } catch { return []; } });
            const [expenses, setExpenses] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_expenses')) || []; } catch { return []; } });
            const [lastRate, setLastRate] = useState(() => localStorage.getItem('tokyo_last_rate') || '0.22');
            const [rateConfig, setRateConfig] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_rates')) || {}; } catch { return {}; } });

            // Form State
            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({
                title: '', amount: '', currency: 'TWD', rate: lastRate,
                category: 'food', hasFee: false, payerIds: [], paidBy: 'me',
                date: new Date().toISOString().split('T')[0],
                paymentMethod: 'cash',
                note: '',
                splitMode: 'equal', 
                exactAmounts: {} 
            });
            const [newFriendName, setNewFriendName] = useState('');
            const [isFriendModalOpen, setIsFriendModalOpen] = useState(false);
            
            // Rate Center Modal State
            const [isRateModalOpen, setIsRateModalOpen] = useState(false);
            const [rateForm, setRateForm] = useState({
                date: new Date().toISOString().split('T')[0],
                cash: '', visa: '', mastercard: '', jcb: ''
            });

            // Persistence
            useEffect(() => { localStorage.setItem('tokyo_pro_my_name', myName); }, [myName]);
            useEffect(() => { localStorage.setItem('tokyo_pro_friends', JSON.stringify(friends)); }, [friends]);
            useEffect(() => { localStorage.setItem('tokyo_pro_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('tokyo_last_rate', lastRate); }, [lastRate]);
            useEffect(() => { localStorage.setItem('tokyo_pro_rates', JSON.stringify(rateConfig)); }, [rateConfig]);

            // Auto-update rate logic
            const getRateForConfig = (date, method) => {
                if (rateConfig[date] && rateConfig[date][method]) return rateConfig[date][method];
                return lastRate;
            };

            useEffect(() => {
                if (form.currency === 'JPY' && !editingId) {
                    const suggestedRate = getRateForConfig(form.date, form.paymentMethod);
                    setForm(prev => ({ ...prev, rate: suggestedRate }));
                }
            }, [form.date, form.paymentMethod, form.currency, rateConfig]);

            // Handlers
            const handleSaveExpense = () => {
                if (!form.title || !form.amount || form.payerIds.length === 0) return alert('請填寫完整資訊');
                
                if (form.splitMode === 'exact') {
                    const sumEntered = form.payerIds.reduce((acc, id) => acc + parseFloat(form.exactAmounts[id] || 0), 0);
                    const targetAmount = parseFloat(form.amount);
                    // 放寬落差驗證，允許小於等於 2 的誤差，避免外幣轉換的極小數落差
                    if (Math.abs(sumEntered - targetAmount) > 2) {
                        return alert(`個別分攤金額總和 (${sumEntered}) 與輸入總金額 (${targetAmount}) 落差過大，請修正後再儲存。`);
                    }
                }

                if (form.currency === 'JPY') setLastRate(form.rate);

                const baseTWD = calculateBaseTWD(form.amount, form.currency, form.rate);
                const newData = {
                    id: editingId || Date.now().toString(),
                    ...form,
                    originalAmount: parseFloat(form.amount),
                    baseTWD,
                    phase: phase
                };

                setExpenses(prev => editingId ? prev.map(e => e.id === editingId ? newData : e) : [newData, ...prev]);
                setForm(prev => ({ ...prev, title: '', amount: '', payerIds: [], paidBy: 'me', note: '', exactAmounts: {}, splitMode: 'equal' }));
                setEditingId(null);
                setView('dashboard');
                if (phase === 'trip') setSelectedDate(form.date);
            };

            const handleDeleteExpense = (id) => {
                if(confirm('確定刪除？')) {
                    setExpenses(prev => prev.filter(e => e.id !== id));
                    if(editingId === id) setView('dashboard');
                }
            };

            const handleEdit = (exp) => {
                setEditingId(exp.id);
                setForm({
                    title: exp.title, amount: exp.originalAmount, currency: exp.currency, rate: exp.rate,
                    category: exp.category, hasFee: exp.hasFee, payerIds: exp.payerIds, paidBy: exp.paidBy,
                    date: exp.date, paymentMethod: exp.paymentMethod || 'cash',
                    note: exp.note || '',
                    splitMode: exp.splitMode || 'equal',
                    exactAmounts: exp.exactAmounts || {}
                });
                setPhase(exp.phase);
                setView('addExpense');
            };

            // 切換視圖時清除 Modal
            const changeView = (newView) => {
                setView(newView);
                setSelectedDetailUserId(null);
            };

            // Derived Data
            const currentPhaseExpenses = expenses.filter(e => e.phase === phase);
            const tripDates = useMemo(() => {
                const tripExps = expenses.filter(e => e.phase === 'trip');
                const dates = [...new Set(tripExps.map(e => e.date))];
                return dates.sort((a, b) => new Date(b) - new Date(a));
            }, [expenses]);

            useEffect(() => {
                if (phase === 'trip' && tripDates.length > 0 && !tripDates.includes(selectedDate)) {
                    setSelectedDate(tripDates[0]);
                }
            }, [tripDates, phase, selectedDate]);

            const selectedDateExpenses = useMemo(() => {
                if (phase !== 'trip' || !selectedDate) return [];
                return currentPhaseExpenses.filter(e => e.date === selectedDate);
            }, [currentPhaseExpenses, selectedDate, phase]);

            const selectedDateTotal = useMemo(() => {
                return selectedDateExpenses.reduce((sum, item) => {
                    const baseTWD = item.baseTWD;
                    const finalTotal = item.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
                    return sum + finalTotal;
                }, 0);
            }, [selectedDateExpenses]);


            // --- View: Settings (Exchange Rate Management) ---
            if (view === 'settings') {
                const handleSaveRate = () => {
                    if (!rateForm.date) return alert('請選擇日期');
                    setRateConfig(prev => ({
                        ...prev,
                        [rateForm.date]: {
                            cash: rateForm.cash || prev[rateForm.date]?.cash || lastRate,
                            visa: rateForm.visa || prev[rateForm.date]?.visa || lastRate,
                            mastercard: rateForm.mastercard || prev[rateForm.date]?.mastercard || lastRate,
                            jcb: rateForm.jcb || prev[rateForm.date]?.jcb || lastRate
                        }
                    }));
                    setIsRateModalOpen(false); 
                };

                const handleEditRate = (date, rates) => {
                    setRateForm({
                        date: date,
                        cash: rates.cash || '',
                        visa: rates.visa || '',
                        mastercard: rates.mastercard || '',
                        jcb: rates.jcb || ''
                    });
                    setIsRateModalOpen(true); 
                };

                const handleDeleteRate = (date) => {
                    const displayDate = date.replace(/-/g, '/');
                    if (confirm(`確定要刪除 ${displayDate} 的匯率設定嗎？`)) {
                        setRateConfig(prev => {
                            const newConfig = { ...prev };
                            delete newConfig[date];
                            return newConfig;
                        });
                    }
                };

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white p-6 relative pb-24 animate-fade-in">
                        <div className="flex items-center gap-3 mb-6">
                            <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50 transition"><Icon name="ArrowLeft"/></button>
                            <h2 className="text-xl font-bold text-primary-900">匯率管理</h2>
                        </div>
                        <div className="mb-6 bg-primary-50 p-4 rounded-xl text-sm text-primary-600 leading-relaxed">
                            在此設定每天的匯率，記帳時選擇日期與卡別，系統會自動帶入對應匯率。若當日某卡別未設定，將使用最近一次的匯率。
                        </div>
                        
                        <div className="space-y-2">
                            <h3 className="font-bold text-primary-400 text-xs uppercase tracking-wider pl-1">已設定日期列表</h3>
                            <div className="bg-white border border-primary-200 rounded-xl overflow-hidden shadow-sm">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[380px]">
                                        <thead>
                                            <tr className="bg-primary-50 text-primary-500 text-[10px] uppercase tracking-wider border-b border-primary-100">
                                                <th className="p-3 font-bold">日期</th>
                                                <th className="p-3 font-bold text-center">現金</th>
                                                <th className="p-3 font-bold text-center">VISA</th>
                                                <th className="p-3 font-bold text-center">Master</th>
                                                <th className="p-3 font-bold text-center">JCB</th>
                                                <th className="p-3 font-bold text-center">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-primary-100">
                                            {Object.keys(rateConfig).length === 0 ? (
                                                <tr>
                                                    <td colSpan="6" className="p-6 text-center text-primary-300 text-sm">
                                                        暫無任何匯率設定，點擊右下角新增
                                                    </td>
                                                </tr>
                                            ) : (
                                                Object.entries(rateConfig).sort((a,b) => new Date(b[0]) - new Date(a[0])).map(([date, rates]) => (
                                                    <tr key={date} className="hover:bg-primary-50/50 transition">
                                                        <td className="p-3 text-xs font-bold text-primary-800 whitespace-nowrap">
                                                            {date.replace(/-/g, '/')}
                                                        </td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.cash}</td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.visa}</td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.mastercard}</td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.jcb || '-'}</td>
                                                        <td className="p-3">
                                                            <div className="flex items-center justify-center gap-1.5">
                                                                <button onClick={() => handleEditRate(date, rates)} className="w-7 h-7 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center hover:bg-primary-200 hover:text-primary-800 transition"><Icon name="Edit" size={12} /></button>
                                                                <button onClick={() => handleDeleteRate(date)} className="w-7 h-7 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center hover:bg-rose-100 hover:text-rose-700 transition"><Icon name="Trash2" size={12} /></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* FAB 新增按鈕 */}
                        <button onClick={() => {
                            setRateForm({ date: new Date().toISOString().split('T')[0], cash: '', visa: '', mastercard: '', jcb: '' });
                            setIsRateModalOpen(true);
                        }} className="fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-2xl bg-primary-800 text-white flex items-center justify-center active:scale-90 transition transform hover:scale-105 z-30">
                            <Icon name="Plus" size={28} />
                        </button>

                        {/* 匯率懸浮視窗 (Modal) */}
                        {isRateModalOpen && (
                            <div className="fixed inset-0 bg-primary-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                                <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                                    <div className="px-5 py-4 border-b border-primary-100 flex justify-between items-center bg-primary-50">
                                        <h3 className="font-bold text-primary-900 flex items-center gap-2">
                                            <Icon name="Edit" size={16} className="text-primary-500"/>
                                            {rateConfig[rateForm.date] ? '編輯單日匯率' : '新增單日匯率'}
                                        </h3>
                                        <button onClick={() => setIsRateModalOpen(false)} className="w-8 h-8 flex items-center justify-center rounded-full text-primary-400 hover:bg-primary-200 hover:text-primary-700 transition"><Icon name="Xmark" size={16}/></button>
                                    </div>
                                    <div className="p-5 space-y-4">
                                        <div>
                                            <label className="text-xs font-bold text-primary-400 block mb-1">生效日期</label>
                                            <input type="date" value={rateForm.date} onChange={e => setRateForm({...rateForm, date: e.target.value})} disabled={!!rateConfig[rateForm.date]} className="w-full appearance-none block bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none border border-transparent focus:border-primary-300 transition text-[16px] disabled:opacity-60 disabled:bg-primary-100 text-center" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-xs font-bold text-primary-400 block mb-1">現金</label>
                                                <input type="number" step="0.001" value={rateForm.cash} onChange={e => setRateForm({...rateForm, cash: e.target.value})} placeholder={lastRate} className="w-full bg-primary-50 border border-transparent p-3 rounded-xl font-bold outline-none focus:border-primary-300 transition text-[16px] text-primary-800" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-primary-400 block mb-1">VISA</label>
                                                <input type="number" step="0.001" value={rateForm.visa} onChange={e => setRateForm({...rateForm, visa: e.target.value})} placeholder={lastRate} className="w-full bg-primary-50 border border-transparent p-3 rounded-xl font-bold outline-none focus:border-primary-300 transition text-[16px] text-primary-800" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-primary-400 block mb-1">Mastercard</label>
                                                <input type="number" step="0.001" value={rateForm.mastercard} onChange={e => setRateForm({...rateForm, mastercard: e.target.value})} placeholder={lastRate} className="w-full bg-primary-50 border border-transparent p-3 rounded-xl font-bold outline-none focus:border-primary-300 transition text-[16px] text-primary-800" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-primary-400 block mb-1">JCB</label>
                                                <input type="number" step="0.001" value={rateForm.jcb} onChange={e => setRateForm({...rateForm, jcb: e.target.value})} placeholder={lastRate} className="w-full bg-primary-50 border border-transparent p-3 rounded-xl font-bold outline-none focus:border-primary-300 transition text-[16px] text-primary-800" />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-4 border-t border-primary-100 flex gap-3 bg-gray-50/50">
                                        <button onClick={() => setIsRateModalOpen(false)} className="flex-1 bg-white border border-primary-200 text-primary-600 py-3 rounded-xl font-bold text-sm hover:bg-primary-50 transition active:scale-[0.98]">取消</button>
                                        <button onClick={handleSaveRate} className="flex-1 bg-primary-800 text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-primary-900 transition active:scale-[0.98]">儲存設定</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // --- View: Friends (List) ---
            if (view === 'friends') {
                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white p-6 relative pb-24">
                        <div className="flex items-center gap-3 mb-6">
                            <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50"><Icon name="ArrowLeft"/></button>

            // --- View: Add Expense ---

                const { finalTotal, perPerson } = calculateSplit({...form, baseTWD}, friends);
                const allIds = ['me', ...friends.map(f => f.id)];

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in">
                        <div className="p-4 border-b border-primary-100 flex items-center justify-between sticky top-0 bg-white/95 backdrop-blur z-20">
                            <div className="flex items-center gap-2">
                                <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50"><Icon name="ArrowLeft"/></button>

                        <div className="flex-1 overflow-y-auto no-scrollbar p-6 space-y-6 pb-32">
                            <div><label className="text-xs font-bold text-primary-400 block mb-1">消費日期</label><input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="w-full appearance-none block bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none text-[16px] text-center" /></div>
                            
                            <div className="space-y-4">

                                <div className="relative input-focus bg-primary-50 rounded-2xl border border-transparent"><input type="number" inputMode="decimal" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} className="w-full bg-transparent p-4 text-4xl font-black text-primary-800 outline-none placeholder-primary-200" placeholder="0" /></div>
                                
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-2">付款方式</label>
                                    <div className="grid grid-cols-4 gap-3">
                                        {PAYMENT_METHODS.map(m => (
                                            <button 
                                                key={m.id} 
                                                onClick={() => setForm({...form, paymentMethod: m.id})} 
                                                className={`flex flex-col items-center justify-center p-2 rounded-xl border-2 transition h-[72px] ${form.paymentMethod === m.id ? 'border-primary-500 bg-primary-50 text-primary-700' : 'border-transparent bg-primary-50 text-primary-300 grayscale'}`}

                                                        <div className="h-[24px] flex items-center justify-center mb-1">
                                                            <Icon name={m.icon} size={24} />
                                                        </div>
                                                        <span className="text-[10px] font-bold">{m.name}</span>
                                                    </>

                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {isJPY && (<div className="animate-fade-in"><div className="flex items-center gap-3 bg-white border border-primary-200 rounded-xl p-3 shadow-sm input-focus"><div className="w-8 h-8 rounded-full bg-primary-50 flex items-center justify-center text-primary-500 flex-shrink-0"><Icon name="Yen" size={14}/></div><div className="flex-1"><div className="flex justify-between"><label className="block text-[10px] font-bold text-primary-400 uppercase">匯率 (JPY → TWD)</label><span className="text-[10px] text-primary-300">{rateConfig[form.date]?.[form.paymentMethod] ? '(已自動帶入設定值)' : '(使用預設)'}</span></div><input type="number" step="0.001" value={form.rate} onChange={e => setForm({...form, rate: e.target.value})} className="w-full font-bold text-primary-800 outline-none bg-transparent text-[16px]" placeholder="0.22" /></div><div className="text-xs font-bold text-primary-300">≈ {calculateBaseTWD(form.amount, 'JPY', form.rate)} TWD</div></div></div>)}
                                <div className="flex flex-col gap-2 px-1"><label className="flex items-center gap-2 text-sm font-bold text-primary-500 cursor-pointer select-none"><input type="checkbox" checked={form.hasFee} onChange={e => setForm({...form, hasFee: e.target.checked})} className="accent-primary-600 w-4 h-4 flex-shrink-0" /> 信用卡海外交易手續費 (+1.5%)</label><div className="text-right mt-1 p-3 bg-primary-50 rounded-xl"><span className="text-xs font-bold text-primary-400 block">台幣總計 (含手續費)</span><span className="text-2xl font-black text-primary-800">{formatMoney(finalTotal)}</span></div></div>
                            </div>
                            
                            <hr className="border-primary-100" />
                            
                            <div className="grid grid-cols-1 gap-4">
                                <div><label className="text-xs font-bold text-primary-400 block mb-1">項目名稱</label><input value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 text-[16px]" placeholder="例：敘敘苑" /></div>
                                <div><label className="text-xs font-bold text-primary-400 block mb-2">類別</label><div className="grid grid-cols-4 gap-3">{CATEGORIES.map(cat => (<button key={cat.id} onClick={() => setForm({...form, category: cat.id})} className={`flex flex-col items-center justify-center p-3 rounded-xl border-2 transition ${form.category === cat.id ? 'border-primary-500 bg-primary-50 text-primary-700' : 'border-transparent bg-primary-50 text-primary-300 grayscale'}`}><Icon name={cat.icon} size={20} /><span className="text-[10px] font-bold mt-1">{cat.name}</span></button>))}</div></div>
                            </div>
                            
                            <hr className="border-primary-100" />
                            
                            {/* 分攤設定 */}
                            <div className="grid grid-cols-1 gap-5">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="relative">
                                        <label className="text-xs font-bold text-primary-400 block mb-1">墊款人</label>
                                        <div className="relative">
                                            <select value={form.paidBy} onChange={e => setForm({...form, paidBy: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                                <option value="me">{myName}</option>
                                                {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                            </select>
                                            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                    </div>
                                    <div className="relative">
                                        <label className="text-xs font-bold text-primary-400 block mb-1">分攤方式</label>
                                        <div className="relative">
                                            <select value={form.splitMode} onChange={e => setForm({...form, splitMode: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                                <option value="equal">均分</option>
                                                <option value="exact">個別輸入金額</option>
                                            </select>
                                            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div>
                                    <div className="flex justify-between items-end mb-3">

                                        {form.splitMode === 'equal' && <button onClick={() => setForm({...form, payerIds: form.payerIds.length === allIds.length ? [] : allIds})} className="text-xs font-bold text-primary-600 bg-primary-50 px-2 py-1 rounded-md">全選 / 取消</button>}
                                    </div>
                                    
                                    {/* 均分模式介面 */}
                                    {form.splitMode === 'equal' && (
                                        <div className="grid grid-cols-2 gap-2">{allIds.map(id => { const name = id === 'me' ? myName : friends.find(f => f.id === id)?.name; return (<button key={id} onClick={() => { const newIds = form.payerIds.includes(id) ? form.payerIds.filter(pid => pid !== id) : [...form.payerIds, id]; setForm({...form, payerIds: newIds}); }} className={`p-2 rounded-lg flex items-center gap-2 border transition ${form.payerIds.includes(id) ? 'bg-white border-primary-500 text-primary-800 font-bold shadow-sm' : 'bg-transparent border-transparent text-primary-300'}`}><div className={`w-4 h-4 rounded-full flex items-center justify-center ${form.payerIds.includes(id) ? 'bg-primary-500 text-white' : 'bg-primary-200'}`}><Icon name="Check" size={10}/></div>{name}</button>) })}</div>
                                    )}

                                    {/* 個別輸入模式介面 */}
                                    {form.splitMode === 'exact' && (
                                        <div className="space-y-2">
                                            <div className="text-[10px] text-primary-400 mb-2">請輸入不含手續費的 {form.currency} 金額 (手續費系統會按比例附加)</div>
                                            {allIds.map(id => { 
                                                const name = id === 'me' ? myName : friends.find(f => f.id === id)?.name; 
                                                const isSelected = form.payerIds.includes(id);
                                                return (
                                                    <div key={id} className={`p-2 rounded-lg flex items-center justify-between border transition ${isSelected ? 'bg-white border-primary-500 shadow-sm' : 'bg-transparent border-transparent'}`}>
                                                        <button onClick={() => { const newIds = isSelected ? form.payerIds.filter(pid => pid !== id) : [...form.payerIds, id]; setForm({...form, payerIds: newIds}); }} className="flex items-center gap-2 min-w-0 pr-2">
                                                            <div className={`w-4 h-4 flex-shrink-0 rounded-full flex items-center justify-center ${isSelected ? 'bg-primary-500 text-white' : 'bg-primary-200'}`}><Icon name="Check" size={10}/></div>
                                                            <span className={`truncate ${isSelected ? 'text-primary-800 font-bold' : 'text-primary-400'}`}>{name}</span>
                                                        </button>
                                                        {isSelected && (
                                                            <div className="flex items-center gap-1.5 flex-shrink-0">
                                                                <input type="number" inputMode="decimal" value={form.exactAmounts[id] || ''} onChange={e => setForm({...form, exactAmounts: {...form.exactAmounts, [id]: e.target.value}})} className="w-24 text-right bg-primary-50 p-1.5 rounded-md text-sm font-bold text-primary-800 outline-none focus:ring-1 focus:ring-primary-400" placeholder="0" />
                                                                <span className="text-xs font-bold text-primary-400 w-8">{form.currency}</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                ) 
                                            })}
                                        </div>
                                    )}
                                </div>
                                
                                <hr className="border-primary-100 mt-2" />
                                
                                {/* 備註放置在最底下 */}
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">備註 (選填)</label>
                                    <textarea 
                                        value={form.note} 
                                        onChange={e => setForm({...form, note: e.target.value})} 
                                        className="w-full bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 text-[16px] resize-none leading-relaxed" 
                                        placeholder="新增備註說明..."
                                        rows="3"
                                    ></textarea>
                                </div>
                            </div>
                        </div>
                        <div className="p-4 border-t border-primary-100 bg-white sticky bottom-0 safe-bottom">
                            <div className="flex justify-between items-center mb-3 text-sm font-bold text-primary-500">
                                <span>{form.payerIds.length} 人分攤</span>
                                {form.splitMode === 'equal' ? (
                                    <span>每人: <span className="text-primary-800 text-lg">{formatMoney(perPerson)}</span></span>
                                ) : (
                                    <span className={Math.abs(exactRemaining) > 2 ? 'text-rose-500' : 'text-emerald-500'}>
                                        未分配: <span className="text-lg">{Math.abs(exactRemaining) > 0.01 ? exactRemaining.toFixed(1) : '0'}</span> {form.currency}
                                    </span>
                                )}
                            </div>
                            <button onClick={handleSaveExpense} className="w-full bg-primary-800 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-primary-200 active:scale-[0.98] transition hover:bg-primary-900">確認記帳</button>
                        </div>
                    </div>
                );
            }

            // --- View: Summary (Checkout / Settlement) ---
            if (view === 'summary') {
                return (
                    <div className="max-w-3xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in relative pb-24">
                        <div className="bg-white sticky top-0 z-20 shadow-sm border-b border-primary-100">
                            <div className="px-5 pt-6 pb-2 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50 transition active:scale-95"><Icon name="ArrowLeft" size={20}/></button>
                                    <h2 className="text-2xl font-black text-primary-900 tracking-tight">結算清單</h2>
                                </div>
                            </div>
                            <div className="flex px-5 pb-4 gap-4 mt-2">
                                <button onClick={() => { setPhase('pre'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前</button>
                                <button onClick={() => { setPhase('trip'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中</button>
                            </div>
                        </div>

                        <div className="p-5">
                            {phase === 'trip' && (
                                <div className="mb-6">
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-widest mb-2 block pl-1">選擇結算日期</label>
                                    {tripDates.length > 0 ? (
                                        <div className="relative">
                                            <select value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); setSelectedDetailUserId(null); }} className="w-full appearance-none bg-white border border-primary-200 p-3 rounded-xl font-bold text-primary-800 outline-none focus:border-primary-400 transition text-[16px] shadow-sm">
                                                {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                            </select>
                                            <div className="absolute right-4 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                    ) : (
                                        <div className="text-sm text-primary-400 bg-primary-50 p-3 rounded-xl border border-primary-100 text-center">無旅程中消費紀錄</div>
                                    )}
                                </div>
                            )}

                            {(() => {
                                // 初始化所有成員數據
                                const users = { 'me': { id: 'me', name: myName, paid: 0, shouldPay: 0 } };
                                friends.forEach(f => users[f.id] = { id: f.id, name: f.name, paid: 0, shouldPay: 0 });

                                // 過濾當前階段/日期的帳目
                                let currentExpenses = [];
                                if (phase === 'pre') {
                                    currentExpenses = expenses.filter(e => e.phase === 'pre');
                                } else {
                                    if (!selectedDate) return null;
                                    currentExpenses = expenses.filter(e => e.phase === 'trip' && e.date === selectedDate);
                                }

                                if (currentExpenses.length === 0) {
                                    return (
                                        <div className="text-center py-10 animate-fade-in">
                                            <div className="bg-primary-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-primary-300">
                                                <Icon name="Check" size={24} />
                                            </div>
                                            <p className="font-bold text-primary-500">目前無帳目需要結算</p>
                                        </div>
                                    );
                                }

                                // 計算這個畫面的「總花費」
                                const totalPhaseExpense = currentExpenses.reduce((sum, exp) => sum + (exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD), 0);

                                // 累加代墊總額與應分攤總額
                                currentExpenses.forEach(exp => {
                                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                                    
                                    // 墊款人增加 paid
                                    if (users[exp.paidBy]) users[exp.paidBy].paid += finalTotal;
                                    
                                    // 每個分攤對象增加 shouldPay
                                    exp.payerIds.forEach(pid => {
                                        if (users[pid]) users[pid].shouldPay += calculateFriendShare(exp, pid);
                                    });
                                });

                                // 計算每個人最後的 Net (正數代表需給錢，負數代表可拿回錢)
                                const balances = Object.values(users).map(u => ({
                                    ...u,
                                    net: u.shouldPay - u.paid
                                }));

                                // 決定結算中心
                                let center;
                                if (phase === 'pre') {
                                    // 出發前永遠以自己為中心
                                    center = balances.find(b => b.id === 'me');
                                } else {
                                    // 旅程中找出當天代墊最多的人
                                    center = balances.reduce((max, u) => u.paid > max.paid ? u : max, balances[0]);
                                }

                                const others = balances.filter(b => b.id !== center.id);
                                
                                // 修復結算加總誤差：強制結算中心的數字為其他人淨值的完美反向平衡
                                const othersNetSum = others.reduce((sum, b) => sum + b.net, 0);
                                center.net = -othersNetSum;
                                // 同時修復中心個人的 shouldPay 顯示，讓明細的數學算式保持完全吻合
                                center.shouldPay = center.paid + center.net;

                                return (
                                    <div className="animate-fade-in">
                                        {/* 結算中心資訊卡片 */}
                                        <div 
                                            className={`rounded-2xl p-5 text-white shadow-lg mb-6 cursor-pointer transform hover:scale-[1.01] transition-all active:scale-95 ${phase === 'pre' ? 'bg-amber-600' : 'bg-emerald-600'}`}
                                            onClick={() => setSelectedDetailUserId(center.id)}
                                        >
                                            <div className="flex justify-between items-center mb-4">
                                                <div></div>
                                                <span className="bg-black/20 px-3 py-1 rounded-full text-xs font-bold backdrop-blur-sm border border-white/10">
                                                    {phase === 'pre' ? '行前花費總額：' : '本日花費總額：'} {formatMoney(totalPhaseExpense)}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <div className="w-14 h-14 rounded-full bg-white text-primary-800 font-black flex items-center justify-center text-xl shadow-inner flex-shrink-0">
                                                    {center.id === 'me' ? (myName || '我')[0] : (center.name || '某')[0]}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className="text-2xl font-black truncate">{center.id === 'me' ? myName : center.name}</div>
                                                    <div className="text-sm text-white/90 mt-1 font-medium">
                                                        {center.net < 0 ? `扣除自身花費後，將收回 ${formatMoney(Math.abs(center.net))}` : 
                                                         center.net > 0 ? `扣除代墊後，仍需付給他人 ${formatMoney(center.net)}` : '自身花費與代墊剛好打平'}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <h3 className="text-xs font-bold text-primary-400 uppercase tracking-widest mb-3 pl-1">結算明細</h3>
                                        <div className="space-y-3">
                                            {others.map(b => (
                                                <div 
                                                    key={b.id} 
                                                    className="bg-white border border-primary-100 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer hover:border-primary-300 hover:shadow-md transition-all active:scale-[0.98]"
                                                    onClick={() => setSelectedDetailUserId(b.id)}
                                                >
                                                    <div className="flex items-center gap-3 min-w-0 pr-2">
                                                        <div className="w-10 h-10 rounded-full bg-primary-50 text-primary-700 font-bold flex items-center justify-center flex-shrink-0 border border-primary-100">{b.id === 'me' ? (myName || '我')[0] : (b.name || '某')[0]}</div>
                                                        <span className="font-bold text-primary-900 truncate">{b.id === 'me' ? myName : b.name}</span>
                                                    </div>
                                                    <div className="text-right flex-shrink-0">
                                                        {b.net > 0 ? (
                                                            <div>
                                                                <div className="text-[10px] font-bold text-rose-500 mb-0.5">應付給 {center.name}</div>
                                                                <div className="font-black text-rose-600 text-lg">{formatMoney(b.net)}</div>
                                                            </div>
                                                        ) : b.net < 0 ? (
                                                            <div>
                                                                <div className="text-[10px] font-bold text-emerald-500 mb-0.5">{center.name} 需退還</div>
                                                                <div className="font-black text-emerald-600 text-lg">{formatMoney(Math.abs(b.net))}</div>
                                                            </div>
                                                        ) : (
                                                            <div className="font-bold text-primary-400 bg-primary-50 px-3 py-1 rounded-lg text-xs border border-primary-100">剛好打平</div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* 個人明細 Modal */}
                                        {selectedDetailUserId && (() => {
                                            const dUser = balances.find(u => u.id === selectedDetailUserId);
                                            if (!dUser) return null;
                                            
                                            // 過濾出與該用戶有關的消費（他墊付的 or 他有分攤的）
                                            const dExpenses = currentExpenses.filter(e => e.paidBy === selectedDetailUserId || e.payerIds.includes(selectedDetailUserId));

                                            return (
                                                <div className="fixed inset-0 bg-primary-950/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center" onClick={() => setSelectedDetailUserId(null)}>
                                                    <div className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                                                        {/* Header */}
                                                        <div className="px-6 py-5 border-b border-primary-100 flex justify-between items-center bg-white sm:rounded-t-2xl rounded-t-3xl z-10 shrink-0">
                                                            <div>
                                                                <h3 className="text-xl font-black text-primary-900">{dUser.id === 'me' ? myName : dUser.name} 的明細</h3>
                                                                <p className="text-xs text-primary-400 mt-1">{phase === 'pre' ? '出發前 (行前款)' : `${selectedDate.replace(/-/g, '/')} (當地消費)`}</p>
                                                            </div>
                                                            <button onClick={() => setSelectedDetailUserId(null)} className="w-8 h-8 bg-primary-50 rounded-full flex items-center justify-center text-primary-500 hover:bg-primary-100 transition"><Icon name="Xmark" size={16} /></button>
                                                        </div>
                                                        
                                                        {/* 逐筆列表 */}
                                                        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-white">
                                                            {dExpenses.length === 0 ? (
                                                                <div className="text-center text-primary-400 py-6 text-sm font-bold">無相關消費明細</div>
                                                            ) : (
                                                                dExpenses.map(exp => {
                                                                    const finalT = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                                                                    const uPaid = exp.paidBy === selectedDetailUserId ? finalT : 0;
                                                                    const uShare = calculateFriendShare(exp, selectedDetailUserId);
                                                                    const uNet = uPaid - uShare; 
                                                                    const cat = CATEGORIES.find(c => c.id === exp.category);
                                                                    
                                                                    return (
                                                                        <div key={exp.id} className="bg-primary-50/50 border border-primary-100 rounded-xl p-4 flex justify-between items-center">
                                                                            <div className="flex items-center gap-3">
                                                                                <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-primary-600 border border-primary-100 flex-shrink-0">
                                                                                    <Icon name={cat?.icon || 'Other'} />
                                                                                </div>
                                                                                <div>
                                                                                    <div className="font-bold text-primary-800 text-sm leading-snug">{exp.title}</div>
                                                                                    <div className="text-[10px] text-primary-400 mt-1 font-bold tracking-wider">總額 {formatMoney(finalT)}</div>
                                                                                </div>
                                                                            </div>
                                                                            <div className="text-right text-xs space-y-0.5 whitespace-nowrap">
                                                                                {uPaid > 0 && <div className="text-emerald-600 font-bold">代墊 +{formatMoney(uPaid)}</div>}
                                                                                {uShare > 0 && <div className="text-rose-600 font-bold">應付 -{formatMoney(uShare)}</div>}
                                                                                <div className={`font-black pt-1 mt-1 border-t border-primary-200/50 ${uNet > 0 ? 'text-emerald-600' : uNet < 0 ? 'text-rose-600' : 'text-primary-400'}`}>
                                                                                    小計: {uNet > 0 ? '+' : ''}{formatMoney(uNet)}
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    )
                                                                })
                                                            )}
                                                        </div>
                                                        
                                                        {/* Summary Bottom */}
                                                        <div className="p-5 border-t border-primary-100 bg-primary-50 sm:rounded-b-2xl shrink-0">
                                                            <div className="flex justify-between items-center text-sm mb-1.5">
                                                                <span className="text-primary-500 font-bold">當日總代墊</span>
                                                                <span className="text-emerald-600 font-bold">+{formatMoney(dUser.paid)}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-sm mb-3">
                                                                <span className="text-primary-500 font-bold">當日總應付 (自身花費)</span>
                                                                <span className="text-rose-600 font-bold">-{formatMoney(dUser.shouldPay)}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-base pt-3 border-t border-primary-200">
                                                                <span className="text-primary-900 font-black tracking-widest">結算淨值</span>
                                                                <span className={`font-black text-xl ${dUser.net > 0 ? 'text-rose-600' : dUser.net < 0 ? 'text-emerald-600' : 'text-primary-500'}`}>
                                                                    {dUser.net > 0 ? `需付 ${formatMoney(dUser.net)}` : dUser.net < 0 ? `應收回 ${formatMoney(Math.abs(dUser.net))}` : '剛好打平'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                );
            }

            // --- View: Dashboard ---
            const expensesToRender = phase === 'pre' ? currentPhaseExpenses : selectedDateExpenses;

            return (
                <div className="max-w-3xl mx-auto min-h-screen pb-24 relative animate-fade-in">
                    
                    {/* 左側抽屜選單 Modal */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 z-50 flex">
                            {/* 半透明遮罩 */}
                            <div className="absolute inset-0 bg-primary-950/40 backdrop-blur-sm transition-opacity animate-fade-in" onClick={() => setIsMenuOpen(false)}></div>
                            
                            {/* 滑出式選單 */}
                            <div className="relative w-72 max-w-[80%] bg-white h-full shadow-2xl flex flex-col animate-slide-in-left">
                                <div className="p-6 border-b border-primary-100 flex items-center justify-between bg-primary-50">
                                    <h2 className="text-xl font-black text-primary-900">設定</h2>
                                    <button onClick={() => setIsMenuOpen(false)} className="text-primary-400 p-2 -mr-2 hover:bg-white rounded-full transition"><Icon name="Xmark" size={20}/></button>
                                </div>
                                <div className="flex-1 py-4">
                                    <button onClick={() => { changeView('settings'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 font-bold text-primary-700 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Settings" size={16}/></div>
                                        匯率管理
                                    </button>
                                    <button onClick={() => { changeView('friends'); setIsMenuOpen(false); }} className="w-full text-left px-6 py-4 font-bold text-primary-700 hover:bg-primary-50 flex items-center gap-4 transition text-[16px]">
                                        <div className="w-8 h-8 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center"><Icon name="Users" size={16}/></div>
                                        成員管理
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white sticky top-0 z-10 shadow-sm border-b border-primary-100">
                        <div className="px-5 pt-6 pb-2 flex items-center justify-between relative">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsMenuOpen(true)} className="p-2 -ml-2 text-primary-900 rounded-full hover:bg-primary-50 transition active:scale-95">
                                    <Icon name="Bars" size={24} />
                                </button>
                                <h1 className="text-2xl font-black text-primary-900 tracking-tight">旅遊分帳</h1>
                            </div>
                            
                            <button onClick={() => changeView('summary')} className="flex items-center gap-1.5 bg-primary-100 text-primary-700 px-3 py-1.5 rounded-full font-bold text-sm hover:bg-primary-200 transition active:scale-95 shadow-sm">
                                <Icon name="FileInvoiceDollar" size={14} />
                                結算清單
                            </button>
                        </div>
                        <div className="flex px-5 pb-4 gap-4 mt-2">
                            <button onClick={() => setPhase('pre')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前 (行前款)</button>
                            <button onClick={() => setPhase('trip')} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中 (當地消費)</button>
                        </div>
                    </div>

                    <div className="p-4 space-y-4">
                        <div className="animate-fade-in">
                            {/* Trip 日期選單與當日總額 */}
                            {phase === 'trip' && (
                                tripDates.length > 0 ? (
                                    <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                        <div className="relative w-[150px] flex-shrink-0">
                                            <select value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="w-full appearance-none bg-primary-50 py-2.5 pl-3 pr-8 rounded-xl font-bold text-primary-800 outline-none border border-transparent focus:border-primary-300 transition text-[16px] text-center">
                                                {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                            </select>
                                            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                        <div className="flex-1 text-right pr-1">
                                            <div className="text-[10px] font-bold text-primary-400 mb-0.5">當日總額</div>
                                            <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(selectedDateTotal)}</div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="text-center py-12">
                                        <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="MapPlane" size={32} className="text-primary-200" /></div>
                                        <p className="text-primary-400 font-bold">尚未新增當地消費</p>
                                        <p className="text-xs text-primary-300 mt-1">點擊右下角按鈕開始記帳</p>
                                    </div>
                                )
                            )}

                            {/* Pre 空狀態 */}
                            {phase === 'pre' && expensesToRender.length === 0 && (
                                <div className="text-center py-12 animate-fade-in">
                                    <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="Calendar" size={32} className="text-primary-200" /></div>
                                    <p className="text-primary-400 font-bold">尚未新增行前花費</p>
                                    <p className="text-xs text-primary-300 mt-1">點擊右下角按鈕開始記帳</p>
                                </div>
                            )}

                            {/* 帳目列表 (整合出發前與旅程中) */}
                            {expensesToRender.length > 0 && (
                                <div className="mt-4 bg-white rounded-2xl border border-primary-100 shadow-sm overflow-hidden animate-fade-in">
                                    <div className="divide-y divide-primary-50">
                                        {expensesToRender.map(exp => {
                                            return (
                                                <div key={exp.id} className="p-4 flex justify-between items-start cursor-pointer hover:bg-primary-50 transition active:bg-primary-100" onClick={() => handleEdit(exp)}>
                                                    <div className="flex items-start gap-3 flex-1 min-w-0 pr-4">
                                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 shadow-inner mt-0.5 ${phase === 'pre' ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                                            <Icon name={CATEGORIES.find(c=>c.id===exp.category)?.icon} />
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <div className="font-bold text-primary-800 text-[16px] leading-snug break-words">{exp.title}</div>
                                                            {exp.note && <div className="text-xs text-primary-500 mt-1 line-clamp-1">{exp.note}</div>}
                                                            <div className="text-xs text-primary-400 mt-1.5 flex items-center gap-1">
                                                                {exp.date.replace(/-/g, '/')} • {exp.paidBy === 'me' ? myName : friends.find(f=>f.id===exp.paidBy)?.name}先付
                                                                {exp.splitMode === 'exact' && <span className="ml-1 bg-primary-100 text-primary-600 px-1 rounded text-[9px] font-bold">自訂分配</span>}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="font-bold text-primary-700 whitespace-nowrap pt-0.5">
                                                        {formatMoney(exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD)}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <button onClick={() => { setEditingId(null); setForm(prev => ({...prev, title: '', amount: '', payerIds: [], paidBy: 'me', splitMode: 'equal', exactAmounts: {}, note: ''})); changeView('addExpense'); }} className={`fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-2xl text-white flex items-center justify-center active:scale-[0.85] transition-transform transform hover:scale-105 z-30 ${phase === 'pre' ? 'bg-amber-600 shadow-amber-200' : 'bg-primary-800 shadow-primary-300'}`}><Icon name="Plus" size={28} /></button>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
