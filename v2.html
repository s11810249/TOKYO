<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 防快取機制：確保 Web App 每次重整都抓取最新版本 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>旅遊分帳 Pro Max</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f4f7fb',
                            100: '#e9eef5',
                            200: '#cedce9',
                            300: '#a2bed7',
                            400: '#709bc0',
                            500: '#4a78a0',
                            600: '#3c658d',
                            700: '#315273',
                            800: '#2c4660',
                            900: '#293c51',
                            950: '#1b2736',
                        },
                        // 莫蘭迪紅 (Morandi Rose)
                        rose: {
                            50: '#fdfbfb',
                            100: '#f6eeed',
                            200: '#ebd9d6',
                            300: '#d9bbba',
                            400: '#c19694',
                            500: '#a97573',
                            600: '#8e5d5b',
                            700: '#774c4a',
                            800: '#63413f',
                            900: '#533836',
                            950: '#2b1a19',
                        },
                        // 莫蘭迪綠 (Morandi Emerald)
                        emerald: {
                            50: '#f5f8f7',
                            100: '#e5eeeb',
                            200: '#caddd8',
                            300: '#a3c2b8',
                            400: '#7aa396',
                            500: '#5b8779',
                            600: '#466c60',
                            700: '#3a574d',
                            800: '#314740',
                            900: '#2a3b36',
                            950: '#15211e',
                        },
                        // 莫蘭迪黃 (Morandi Amber)
                        amber: {
                            50: '#fdfcf9',
                            100: '#f8f5ee',
                            200: '#eee6d6',
                            300: '#e0d1b6',
                            400: '#cdb690',
                            500: '#b8996b',
                            600: '#a38156',
                            700: '#876747',
                            800: '#6e543b',
                            900: '#5a4532',
                            950: '#302318',
                        },
                        accent: {
                            500: '#a97573',
                            600: '#8e5d5b',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro TC", "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f4f7fb; 
            color: #2c4660;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .input-focus { transition: all 0.2s; }
        .input-focus:focus-within {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-color: #709bc0; 
        }
        
        /* 動畫設定 */
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .animate-slide-in-left { animation: slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* 避免 iOS Safari 點擊 input 或 select 時自動放大 */
        input:not(.text-4xl):not(.text-2xl):not(.text-3xl), 
        select, textarea { 
            font-size: 16px !important; 
        }

        /* 修復 iOS Date Input 破圖與高度壓縮問題 */
        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            min-height: 48px;
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- Icons ---
        const Icon = ({ name, size = 20, className, onClick }) => {
            const iconMap = {
                Plus: 'fa-solid fa-plus',
                Trash2: 'fa-regular fa-trash-can',
                Edit: 'fa-solid fa-pen-to-square',
                Users: 'fa-solid fa-user-group',
                Plane: 'fa-solid fa-plane',
                Bed: 'fa-solid fa-bed',
                Utensils: 'fa-solid fa-utensils',
                Bus: 'fa-solid fa-train-subway', 
                Ticket: 'fa-solid fa-ticket',
                ShoppingBag: 'fa-solid fa-bag-shopping',
                Wifi: 'fa-solid fa-wifi',
                Other: 'fa-solid fa-receipt',
                ArrowLeft: 'fa-solid fa-arrow-left',
                ArrowRight: 'fa-solid fa-arrow-right',
                Check: 'fa-solid fa-check',
                MapPin: 'fa-solid fa-location-dot',
                Calendar: 'fa-regular fa-calendar-days',
                ChevronDown: 'fa-solid fa-chevron-down',
                ChevronRight: 'fa-solid fa-chevron-right',
                MapPlane: 'fa-solid fa-plane-departure',
                Yen: 'fa-solid fa-yen-sign',
                Settings: 'fa-solid fa-gear',
                Cash: 'fa-solid fa-money-bill-wave',
                Visa: 'fa-brands fa-cc-visa',
                Mastercard: 'fa-brands fa-cc-mastercard',
                Jcb: 'fa-brands fa-cc-jcb', 
                Xmark: 'fa-solid fa-xmark',
                Bars: 'fa-solid fa-bars',
                FileInvoiceDollar: 'fa-solid fa-file-invoice-dollar',
                Wallet: 'fa-solid fa-wallet',
                RightLeft: 'fa-solid fa-right-left',
                MoneyBillTransfer: 'fa-solid fa-money-bill-transfer',
            };

            const faClass = iconMap[name] || 'fa-solid fa-circle-question';

            return (
                <i 
                    className={`${faClass} ${className || ''}`} 
                    style={{ fontSize: size, width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                    onClick={onClick}
                ></i>
            );
        };

        // --- Constants ---
        const CATEGORIES = [
            { id: 'food', name: '餐飲', icon: 'Utensils' },
            { id: 'transport', name: '交通', icon: 'Bus' },
            { id: 'flight', name: '機票', icon: 'Plane' },
            { id: 'hotel', name: '住宿', icon: 'Bed' },
            { id: 'ticket', name: '門票', icon: 'Ticket' },
            { id: 'shopping', name: '購物', icon: 'ShoppingBag' },
            { id: 'wifi', name: '網路', icon: 'Wifi' },
            { id: 'other', name: '其他', icon: 'Other' },
        ];

        const PAYMENT_METHODS = [
            { id: 'cash', name: '現金', icon: null }, 
            { id: 'visa', name: 'VISA', icon: 'Visa' },
            { id: 'mastercard', name: 'Master', icon: 'Mastercard' },
            { id: 'jcb', name: 'JCB', icon: 'Jcb' }, 
        ];

        // --- Helper Functions ---
        const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);

        const calculateBaseTWD = (amount, currency, rate) => {
            const num = parseFloat(amount);
            if (isNaN(num)) return 0;
            return currency === 'JPY' ? Math.ceil(num * (parseFloat(rate) || 0)) : Math.ceil(num);
        };

        const calculateSplit = (expense, allFriends) => {
            const baseTWD = expense.baseTWD;
            const finalTotal = expense.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
            const count = expense.payerIds.length;
            const perPerson = count > 0 ? Math.ceil(finalTotal / count) : 0;
            return { finalTotal, perPerson };
        };

        const calculateFriendShare = (exp, targetId) => {
            if (!exp.payerIds.includes(targetId)) return 0;
            const baseTWD = exp.baseTWD;
            const finalTotal = exp.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;

            if (exp.splitMode === 'exact') {
                const exactAmt = parseFloat(exp.exactAmounts[targetId] || 0);
                const originalTotal = parseFloat(exp.originalAmount || 1);
                if (originalTotal === 0) return 0;
                
                const ratio = exactAmt / originalTotal;
                return Math.round(finalTotal * ratio);
            } else {
                return Math.ceil(finalTotal / exp.payerIds.length);
            }
        };

        // --- Main Component ---
        const App = () => {
            const [view, setView] = useState('dashboard');
            const [phase, setPhase] = useState('trip');
            const [selectedDate, setSelectedDate] = useState('');
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            
            // 個人結算與結帳 Modal 狀態
            const [selectedDetailUserId, setSelectedDetailUserId] = useState(null);
            // 結帳明細 Tabs (bills = 帳單明細, records = 收付款紀錄)
            const [detailTab, setDetailTab] = useState('bills');

            // Data State
            const [myName, setMyName] = useState(() => localStorage.getItem('tokyo_pro_my_name') || '我自己');
            const [friends, setFriends] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_friends')) || []; } catch { return []; } });
            const [expenses, setExpenses] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_expenses')) || []; } catch { return []; } });
            const [repayments, setRepayments] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_repayments')) || []; } catch { return []; } });
            const [lastRate, setLastRate] = useState(() => localStorage.getItem('tokyo_last_rate') || '0.22');
            const [rateConfig, setRateConfig] = useState(() => { try { return JSON.parse(localStorage.getItem('tokyo_pro_rates')) || {}; } catch { return {}; } });

            // Form State
            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({
                title: '', amount: '', currency: 'TWD', rate: lastRate,
                category: 'food', hasFee: false, payerIds: [], paidBy: 'me',
                date: new Date().toISOString().split('T')[0],
                paymentMethod: 'cash',
                note: '',
                splitMode: 'equal', 
                exactAmounts: {} 
            });
            const [newFriendName, setNewFriendName] = useState('');
            const [isFriendModalOpen, setIsFriendModalOpen] = useState(false);
            
            // Repayment Form State
            const [repaymentForm, setRepaymentForm] = useState({
                payerId: '', payeeId: 'me', amount: '', currency: 'TWD', 
                date: new Date().toISOString().split('T')[0], refDate: '', spotBuy: '', cashBuy: '', note: ''
            });
            
            // Rate Center Modal State
            const [isRateModalOpen, setIsRateModalOpen] = useState(false);
            const [rateForm, setRateForm] = useState({
                date: new Date().toISOString().split('T')[0],
                cash: '', visa: '', mastercard: '', jcb: '', spotBuy: '', cashBuy: ''
            });

            // Persistence
            useEffect(() => { localStorage.setItem('tokyo_pro_my_name', myName); }, [myName]);
            useEffect(() => { localStorage.setItem('tokyo_pro_friends', JSON.stringify(friends)); }, [friends]);
            useEffect(() => { localStorage.setItem('tokyo_pro_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('tokyo_pro_repayments', JSON.stringify(repayments)); }, [repayments]);
            useEffect(() => { localStorage.setItem('tokyo_last_rate', lastRate); }, [lastRate]);
            useEffect(() => { localStorage.setItem('tokyo_pro_rates', JSON.stringify(rateConfig)); }, [rateConfig]);

            // Auto-update rate logic
            const getRateForConfig = useCallback((date, method) => {
                if (rateConfig[date] && rateConfig[date][method]) return rateConfig[date][method];
                return lastRate;
            }, [rateConfig, lastRate]);

            useEffect(() => {
                if (form.currency === 'JPY' && !editingId) {
                    const suggestedRate = getRateForConfig(form.date, form.paymentMethod);
                    setForm(prev => ({ ...prev, rate: suggestedRate }));
                }
            }, [form.date, form.paymentMethod, form.currency, getRateForConfig, editingId]);

            // --- 確保 useEffect 位於最外層 ---
            useEffect(() => {
                if (repaymentForm.currency === 'JPY' && repaymentForm.refDate) {
                    const sBuy = rateConfig[repaymentForm.refDate]?.spotBuy || '';
                    const cBuy = rateConfig[repaymentForm.refDate]?.cashBuy || '';
                    setRepaymentForm(prev => ({ ...prev, spotBuy: sBuy, cashBuy: cBuy }));
                }
            }, [repaymentForm.refDate, repaymentForm.currency, rateConfig]); 

            // Handlers
            const handleEdit = useCallback((exp) => {
                setEditingId(exp.id);
                setForm({
                    title: exp.title, amount: exp.originalAmount, currency: exp.currency, rate: exp.rate,
                    category: exp.category, hasFee: exp.hasFee, payerIds: exp.payerIds, paidBy: exp.paidBy,
                    date: exp.date, paymentMethod: exp.paymentMethod || 'cash',
                    note: exp.note || '',
                    splitMode: exp.splitMode || 'equal',
                    exactAmounts: exp.exactAmounts || {}
                });
                setPhase(exp.phase);
                setView('addExpense');
            }, []);

            const handleSaveExpense = () => {
                if (!form.title || !form.amount || form.payerIds.length === 0) return alert('請填寫完整資訊');
                
                if (form.splitMode === 'exact') {
                    const sumEntered = form.payerIds.reduce((acc, id) => acc + parseFloat(form.exactAmounts[id] || 0), 0);
                    const targetAmount = parseFloat(form.amount);
                    if (Math.abs(sumEntered - targetAmount) > 2) {
                        return alert(`個別分攤金額總和 (${sumEntered}) 與輸入總金額 (${targetAmount}) 落差過大，請修正後再儲存。`);
                    }
                }

                if (form.currency === 'JPY') setLastRate(form.rate);

                const baseTWD = calculateBaseTWD(form.amount, form.currency, form.rate);
                const newData = {
                    id: editingId || Date.now().toString(),
                    ...form,
                    originalAmount: parseFloat(form.amount),
                    baseTWD,
                    phase: phase
                };

                setExpenses(prev => editingId ? prev.map(e => e.id === editingId ? newData : e) : [newData, ...prev]);
                setForm(prev => ({ ...prev, title: '', amount: '', payerIds: [], paidBy: 'me', note: '', exactAmounts: {}, splitMode: 'equal' }));
                setEditingId(null);
                setView('dashboard');
                if (phase === 'trip') setSelectedDate(form.date);
            };

            const handleDeleteExpense = (id) => {
                if(confirm('確定刪除這筆花費？')) {
                    setExpenses(prev => prev.filter(e => e.id !== id));
                    if(editingId === id) setView('dashboard');
                }
            };

            const handleDeleteRepayment = (id) => {
                if(confirm('確定刪除這筆還款紀錄？')) {
                    setRepayments(prev => prev.filter(r => r.id !== id));
                }
            };

            const handleSaveRepayment = () => {
                if (!repaymentForm.payerId || !repaymentForm.payeeId || !repaymentForm.amount) {
                    return alert('請填寫完整資訊');
                }
                if (repaymentForm.payerId === repaymentForm.payeeId) {
                    return alert('還款人與收款人不能是同一人');
                }

                let finalTwdOffset = 0;
                let effectiveRate = null;

                if (repaymentForm.currency === 'TWD') {
                    finalTwdOffset = parseInt(repaymentForm.amount);
                } else {
                    const sBuy = parseFloat(repaymentForm.spotBuy) || 0;
                    const cBuy = parseFloat(repaymentForm.cashBuy) || 0;
                    if (sBuy === 0 || cBuy === 0) return alert('請輸入有效的即期買入與現鈔買入匯率');
                    
                    const costPerUnit = (sBuy - cBuy) * 0.5;
                    effectiveRate = sBuy - costPerUnit;
                    finalTwdOffset = Math.round(parseFloat(repaymentForm.amount) * effectiveRate);
                }

                const newRepayment = {
                    id: Date.now().toString(),
                    ...repaymentForm,
                    effectiveRate,
                    amountTwd: finalTwdOffset
                };

                setRepayments(prev => [newRepayment, ...prev]);
                setView('checkoutDetail');
                setDetailTab('records'); // 儲存後切換到紀錄頁籤以便查看
            };

            // 切換視圖時清除狀態
            const changeView = (newView) => {
                setView(newView);
                if (newView !== 'checkoutDetail' && newView !== 'addRepayment') {
                    setSelectedDetailUserId(null);
                }
            };

            // Derived Data for Expenses
            const currentPhaseExpenses = expenses.filter(e => e.phase === phase);
            const tripDates = useMemo(() => {
                const tripExps = expenses.filter(e => e.phase === 'trip');
                const dates = [...new Set(tripExps.map(e => e.date))];
                return dates.sort((a, b) => new Date(b) - new Date(a));
            }, [expenses]);

            useEffect(() => {
                if (phase === 'trip' && tripDates.length > 0 && !tripDates.includes(selectedDate)) {
                    setSelectedDate(tripDates[0]);
                }
            }, [tripDates, phase, selectedDate]);

            const selectedDateExpenses = useMemo(() => {
                if (phase !== 'trip' || !selectedDate) return [];
                return currentPhaseExpenses.filter(e => e.date === selectedDate);
            }, [currentPhaseExpenses, selectedDate, phase]);

            const selectedDateTotal = useMemo(() => {
                return selectedDateExpenses.reduce((sum, item) => {
                    const baseTWD = item.baseTWD;
                    const finalTotal = item.hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
                    return sum + finalTotal;
                }, 0);
            }, [selectedDateExpenses]);


            // --- View: Settings (Exchange Rate Management) ---
            if (view === 'settings') {
                const handleSaveRate = () => {
                    if (!rateForm.date) return alert('請選擇日期');
                    setRateConfig(prev => ({
                        ...prev,
                        [rateForm.date]: {
                            cash: rateForm.cash || prev[rateForm.date]?.cash || lastRate,
                            visa: rateForm.visa || prev[rateForm.date]?.visa || lastRate,
                            mastercard: rateForm.mastercard || prev[rateForm.date]?.mastercard || lastRate,
                            jcb: rateForm.jcb || prev[rateForm.date]?.jcb || lastRate,
                            spotBuy: rateForm.spotBuy || prev[rateForm.date]?.spotBuy || '',
                            cashBuy: rateForm.cashBuy || prev[rateForm.date]?.cashBuy || ''
                        }
                    }));
                    setIsRateModalOpen(false); 
                };

                const handleEditRate = (date, rates) => {
                    setRateForm({
                        date: date,
                        cash: rates.cash || '',
                        visa: rates.visa || '',
                        mastercard: rates.mastercard || '',
                        jcb: rates.jcb || '',
                        spotBuy: rates.spotBuy || '',
                        cashBuy: rates.cashBuy || ''
                    });
                    setIsRateModalOpen(true); 
                };

                const handleDeleteRate = (date) => {
                    const displayDate = date.replace(/-/g, '/');
                    if (confirm(`確定要刪除 ${displayDate} 的匯率設定嗎？`)) {
                        setRateConfig(prev => {
                            const newConfig = { ...prev };
                            delete newConfig[date];
                            return newConfig;
                        });
                    }
                };

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white p-6 relative pb-24 animate-fade-in">
                        <div className="flex items-center gap-3 mb-6">
                            <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50 transition"><Icon name="ArrowLeft"/></button>
                            <h2 className="text-xl font-bold text-primary-900">匯率管理</h2>
                        </div>
                        <div className="mb-6 bg-primary-50 p-4 rounded-xl text-sm text-primary-600 leading-relaxed">
                            在此設定每天的匯率，記帳時選擇日期與卡別，系統會自動帶入。若有設定「即期買入」與「現鈔買入」，日幣還款時會自動計算補貼匯差。
                        </div>
                        
                        <div className="space-y-2">
                            <h3 className="font-bold text-primary-400 text-xs uppercase tracking-wider pl-1">已設定日期列表</h3>
                            <div className="bg-white border border-primary-200 rounded-xl overflow-hidden shadow-sm">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[380px]">
                                        <thead>
                                            <tr className="bg-primary-50 text-primary-500 text-[10px] uppercase tracking-wider border-b border-primary-100">
                                                <th className="p-3 font-bold">日期</th>
                                                <th className="p-3 font-bold text-center">現金</th>
                                                <th className="p-3 font-bold text-center">VISA</th>
                                                <th className="p-3 font-bold text-center">Master</th>
                                                <th className="p-3 font-bold text-center">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-primary-100">
                                            {Object.keys(rateConfig).length === 0 ? (
                                                <tr>
                                                    <td colSpan="5" className="p-6 text-center text-primary-300 text-sm">
                                                        暫無任何匯率設定，點擊右下角新增
                                                    </td>
                                                </tr>
                                            ) : (
                                                Object.entries(rateConfig).sort((a,b) => new Date(b[0]) - new Date(a[0])).map(([date, rates]) => (
                                                    <tr key={date} className="hover:bg-primary-50/50 transition">
                                                        <td className="p-3 text-xs font-bold text-primary-800 whitespace-nowrap">
                                                            {date.replace(/-/g, '/')}
                                                        </td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.cash}</td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.visa}</td>
                                                        <td className="p-3 text-xs font-bold text-primary-600 text-center">{rates.mastercard}</td>
                                                        <td className="p-3">
                                                            <div className="flex items-center justify-center gap-1.5">
                                                                <button onClick={() => handleEditRate(date, rates)} className="w-7 h-7 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center hover:bg-primary-200 hover:text-primary-800 transition"><Icon name="Edit" size={12} /></button>
                                                                <button onClick={() => handleDeleteRate(date)} className="w-7 h-7 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center hover:bg-rose-100 hover:text-rose-700 transition"><Icon name="Trash2" size={12} /></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* FAB 新增按鈕 */}
                        <button onClick={() => {
                            setRateForm({ date: new Date().toISOString().split('T')[0], cash: '', visa: '', mastercard: '', jcb: '', spotBuy: '', cashBuy: '' });
                            setIsRateModalOpen(true);
                        }} className="fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-md bg-primary-800 text-white flex items-center justify-center active:scale-90 transition transform hover:scale-105 z-30">
                            <Icon name="Plus" size={28} />

                        const cost = (s - c) * 0.5;
                        const eff = s - cost;
                        effectiveRateStr = eff.toFixed(4);
                        offsetTwd = Math.round((parseFloat(repaymentForm.amount) || 0) * eff);
                    }
                } else {
                    offsetTwd = parseInt(repaymentForm.amount) || 0;
                }

                return (
                    <div className="max-w-2xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in">
                        <div className="p-4 border-b border-primary-100 flex items-center gap-3 sticky top-0 bg-white/95 backdrop-blur z-20">
                            <button onClick={() => changeView('checkoutDetail')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50"><Icon name="ArrowLeft"/></button>

                        </div>
                        <div className="flex-1 overflow-y-auto p-6 space-y-6 pb-32">
                            <div><label className="text-xs font-bold text-primary-400 block mb-1">記錄日期</label><input type="date" value={repaymentForm.date} onChange={e => setRepaymentForm({...repaymentForm, date: e.target.value})} className="w-full appearance-none block bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none text-[16px] text-center" /></div>
                            
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">還款人 (付款方)</label>
                                    <div className="relative">
                                        <select value={repaymentForm.payerId} onChange={e => setRepaymentForm({...repaymentForm, payerId: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-rose-600 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                            <option value="" disabled>選擇成員</option>
                                            <option value="me">{myName}</option>
                                            {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                        </select>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                    </div>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-primary-400 block mb-1">收款人 (收款方)</label>
                                    <div className="relative">
                                        <select value={repaymentForm.payeeId} onChange={e => setRepaymentForm({...repaymentForm, payeeId: e.target.value})} className="w-full appearance-none bg-primary-50 p-3 rounded-xl font-bold text-emerald-600 outline-none focus:ring-2 focus:ring-primary-400 transition text-[16px]">
                                            <option value="" disabled>選擇成員</option>
                                            <option value="me">{myName}</option>
                                            {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                        </select>
                                        <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-400 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                    </div>
                                </div>
                            </div>

                            <hr className="border-primary-100" />

                            <div className="space-y-4">
                                <div className="flex justify-between items-end">
                                    <label className="text-xs font-bold text-primary-400">金額 & 幣別</label>

                                            <button key={c} onClick={() => setRepaymentForm({...repaymentForm, currency: c})} className={`px-3 py-1 rounded-md text-xs font-bold transition ${repaymentForm.currency === c ? 'bg-white shadow text-primary-800' : 'text-primary-400'}`}>{c}</button>
                                        ))}
                                    </div>
                                </div>
                                <div className="relative input-focus bg-primary-50 rounded-2xl border border-transparent">
                                    <input type="number" inputMode="decimal" value={repaymentForm.amount} onChange={e => setRepaymentForm({...repaymentForm, amount: e.target.value})} className="w-full bg-transparent p-4 text-4xl font-black text-primary-800 outline-none placeholder-primary-200" placeholder="0" />
                                </div>
                            </div>

                            {/* 日幣專屬：基準日選擇與匯差計算 */}
                            {isJPY && (
                                <div className="bg-amber-50 rounded-2xl p-5 border border-amber-100 space-y-4 animate-fade-in">
                                    <div className="flex items-center gap-2 mb-2 text-amber-700 font-bold text-sm">
                                        <Icon name="RightLeft" size={16} /> 收取日幣現鈔換算
                                    </div>
                                    
                                    <div>
                                        <label className="text-[10px] font-bold text-amber-600 block mb-1 uppercase tracking-wider">選擇對應消費日 (抓取匯率)</label>
                                        <div className="relative">
                                            <select value={repaymentForm.refDate} onChange={e => setRepaymentForm({...repaymentForm, refDate: e.target.value})} className="w-full appearance-none bg-white p-3 rounded-xl font-bold text-amber-900 outline-none border border-amber-200 focus:border-amber-400 transition text-[16px]">
                                                <option value="" disabled>請選擇消費日</option>
                                                {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                            </select>
                                            <div className="absolute right-3 top-1/2 -translate-y-1/2 text-amber-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] font-bold text-amber-600 block mb-1">即期買入</label>
                                            <input type="number" step="0.0001" value={repaymentForm.spotBuy} onChange={e => setRepaymentForm({...repaymentForm, spotBuy: e.target.value})} placeholder="0.2002" className="w-full bg-white border border-amber-200 p-2.5 rounded-xl font-bold outline-none focus:border-amber-400 transition text-[16px] text-amber-900" />

                                            <input type="number" step="0.0001" value={repaymentForm.cashBuy} onChange={e => setRepaymentForm({...repaymentForm, cashBuy: e.target.value})} placeholder="0.1937" className="w-full bg-white border border-amber-200 p-2.5 rounded-xl font-bold outline-none focus:border-amber-400 transition text-[16px] text-amber-900" />
                                        </div>
                                    </div>
                                    
                                    <div className="bg-white/60 p-3 rounded-xl border border-amber-200/50 mt-2 text-[11px] leading-relaxed font-medium text-amber-800">
                                        <div className="flex justify-between mb-1">
                                            <span>有效匯率推算</span>
                                            <span className="font-bold">{effectiveRateStr}</span>
                                        </div>
                                        <div className="text-amber-600/80 mb-2 border-b border-amber-200/50 pb-2">公式: 即期 - ((即期 - 現鈔) ÷ 2)</div>
                                        <div className="flex justify-between items-center pt-1">
                                            <span className="font-bold">可折抵台幣總額</span>
                                            <span className="text-lg font-black text-amber-600">{formatMoney(offsetTwd)}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div>
                                <label className="text-xs font-bold text-primary-400 block mb-1">備註 (選填)</label>
                                <textarea 
                                    value={repaymentForm.note} 
                                    onChange={e => setRepaymentForm({...repaymentForm, note: e.target.value})} 
                                    className="w-full bg-primary-50 p-3 rounded-xl font-bold text-primary-800 outline-none focus:ring-2 focus:ring-primary-400 text-[16px] resize-none leading-relaxed" 
                                    placeholder="例：午餐代墊還款..."
                                    rows="2"
                                ></textarea>
                            </div>
                        </div>

                        <div className="p-4 border-t border-primary-100 bg-white sticky bottom-0 safe-bottom">
                            {isJPY && (
                                <div className="text-center text-xs font-bold text-primary-400 mb-3">
                                    這筆款項將為收款人折抵 <span className="text-primary-800 text-base mx-1">{formatMoney(offsetTwd)}</span> TWD 的欠款
                                </div>
                            )}
                            <button onClick={handleSaveRepayment} className="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold shadow-md active:scale-[0.98] transition hover:bg-emerald-700">儲存紀錄</button>
                        </div>
                    </div>
                );
            }

            // --- View: Summary (結算清單 - 每日/階段) ---
            if (view === 'summary') {
                return (
                    <div className="max-w-3xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in relative pb-24">
                        <div className="bg-white sticky top-0 z-20 shadow-sm border-b border-primary-100">
                            <div className="px-5 pt-6 pb-2 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => changeView('dashboard')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50 transition active:scale-95"><Icon name="ArrowLeft" size={20}/></button>
                                    <h2 className="text-2xl font-black text-primary-900 tracking-tight">結算清單</h2>
                                </div>
                                <button onClick={() => changeView('checkoutList')} className="flex items-center gap-1.5 bg-primary-100 text-primary-700 px-3 py-1.5 rounded-full font-bold text-sm hover:bg-primary-200 transition active:scale-95 shadow-sm">
                                    <Icon name="Wallet" size={14} />
                                    收付款紀錄
                                </button>
                            </div>
                            <div className="flex px-5 pb-4 gap-4 mt-2">
                                <button onClick={() => { setPhase('pre'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'pre' ? 'bg-amber-100 text-amber-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="Calendar" size={16}/> 出發前</button>
                                <button onClick={() => { setPhase('trip'); setSelectedDetailUserId(null); }} className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 ${phase === 'trip' ? 'bg-emerald-100 text-emerald-900 shadow-inner' : 'bg-primary-50 text-primary-400 hover:bg-primary-100'}`}><Icon name="MapPlane" size={16}/> 旅程中</button>
                            </div>
                        </div>

                        <div className="p-4 space-y-4">
                            {(() => {
                                // 檢查是否無旅程消費日期
                                if (phase === 'trip' && (!selectedDate || tripDates.length === 0)) {
                                    return (
                                        <div className="text-center py-12 animate-fade-in">
                                            <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="MapPlane" size={32} className="text-primary-200" /></div>
                                            <p className="text-primary-400 font-bold">無旅程中消費紀錄</p>
                                        </div>
                                    );
                                }

                                // 初始化所有成員數據
                                const users = { 'me': { id: 'me', name: myName, paid: 0, shouldPay: 0 } };
                                friends.forEach(f => users[f.id] = { id: f.id, name: f.name, paid: 0, shouldPay: 0 });

                                // 過濾當前階段/日期的帳目
                                const currentExpenses = phase === 'pre' 
                                    ? expenses.filter(e => e.phase === 'pre') 
                                    : expenses.filter(e => e.phase === 'trip' && e.date === selectedDate);

                                // 若該階段/該日沒有任何帳目
                                if (currentExpenses.length === 0) {
                                    return (
                                        <div className="text-center py-12 animate-fade-in">
                                            <div className="bg-white p-6 rounded-full inline-block shadow-sm mb-4"><Icon name="Check" size={32} className="text-primary-200" /></div>
                                            <p className="text-primary-400 font-bold">目前無帳目需要結算</p>
                                        </div>
                                    );
                                }

                                // 計算這個畫面的「總花費」
                                const totalPhaseExpense = currentExpenses.reduce((sum, exp) => sum + (exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD), 0);

                                // 累加代墊總額與應分攤總額
                                currentExpenses.forEach(exp => {
                                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                                    if (users[exp.paidBy]) users[exp.paidBy].paid += finalTotal;
                                    exp.payerIds.forEach(pid => {
                                        if (users[pid]) users[pid].shouldPay += calculateFriendShare(exp, pid);
                                    });
                                });

                                // 計算每個人最後的 Net (正數代表需付錢，負數代表可拿回錢)
                                const balances = Object.values(users).map(u => ({
                                    ...u,
                                    net: u.shouldPay - u.paid
                                }));

                                // 決定結算中心
                                let center;
                                if (phase === 'pre') {
                                    center = balances.find(b => b.id === 'me');
                                } else {
                                    center = balances.reduce((max, u) => u.paid > max.paid ? u : max, balances[0]);
                                }

                                const others = balances.filter(b => b.id !== center.id);
                                
                                // 修復結算加總誤差：強制結算中心的數字為其他人淨值的完美反向平衡
                                const othersNetSum = others.reduce((sum, b) => sum + b.net, 0);
                                center.net = -othersNetSum;
                                center.shouldPay = center.paid + center.net;

                                // 讓「我」排在第一個，後續依序排列其他人
                                const displayBalances = [
                                    balances.find(b => b.id === 'me'),
                                    ...balances.filter(b => b.id !== 'me')
                                ];

                                return (
                                    <div className="animate-fade-in">
                                        {/* 結算總額區塊 (採用與 Dashboard 相同的緊湊版型) */}
                                        {phase === 'trip' ? (
                                            <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                                <div className="relative w-[150px] flex-shrink-0">
                                                    <select value={selectedDate} onChange={(e) => { setSelectedDate(e.target.value); setSelectedDetailUserId(null); }} className="w-full appearance-none bg-primary-50 py-2.5 pl-3 pr-8 rounded-xl font-bold text-primary-800 outline-none border border-transparent focus:border-primary-300 transition text-[16px] text-center">
                                                        {tripDates.map(date => (<option key={date} value={date}>{date.replace(/-/g, '/')}</option>))}
                                                    </select>
                                                    <div className="absolute right-3 top-1/2 -translate-y-1/2 text-primary-500 pointer-events-none"><Icon name="ChevronDown" size={14} /></div>
                                                </div>
                                                <div className="flex-1 text-right pr-1">
                                                    <div className="text-[10px] font-bold text-primary-400 mb-0.5">本日花費總額</div>
                                                    <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(totalPhaseExpense)}</div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-white p-3 rounded-2xl border border-primary-100 shadow-sm mb-4 flex justify-between items-center gap-3">
                                                <div className="flex items-center gap-3 pl-3 py-1 flex-shrink-0">
                                                    <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
                                                        <Icon name="Calendar" size={20} />
                                                    </div>
                                                    <span className="font-bold text-primary-800 text-[16px]">出發前</span>
                                                </div>
                                                <div className="flex-1 text-right pr-1">
                                                    <div className="text-[10px] font-bold text-primary-400 mb-0.5">行前花費總額</div>
                                                    <div className="text-xl font-black text-primary-800 leading-none truncate">{formatMoney(totalPhaseExpense)}</div>
                                                </div>
                                            </div>
                                        )}

                                        <h3 className="text-xs font-bold text-primary-400 uppercase tracking-widest mb-3 pl-1">結算明細</h3>
                                        <div className="space-y-3">
                                            {displayBalances.map(b => {
                                                const isCenter = b.id === center.id;
                                                let statusLabel, statusAmount, statusColor;

                                                if (isCenter) {
                                                    if (b.net < 0) {
                                                        statusLabel = '總應收回';
                                                        statusAmount = formatMoney(Math.abs(b.net));
                                                        statusColor = 'emerald';
                                                    } else if (b.net > 0) {
                                                        statusLabel = '總應付給他人';
                                                        statusAmount = formatMoney(b.net);
                                                        statusColor = 'rose';
                                                    } else {
                                                        statusLabel = '剛好打平';
                                                        statusColor = 'gray';
                                                    }
                                                } else {
                                                    const centerName = center.id === 'me' ? myName : center.name;
                                                    if (b.net > 0) {
                                                        statusLabel = `應付給 ${centerName}`;
                                                        statusAmount = formatMoney(b.net);
                                                        statusColor = 'rose';
                                                    } else if (b.net < 0) {
                                                        statusLabel = `${centerName} 需退還`;
                                                        statusAmount = formatMoney(Math.abs(b.net));
                                                        statusColor = 'emerald';
                                                    } else {
                                                        statusLabel = '剛好打平';
                                                        statusColor = 'gray';
                                                    }
                                                }

                                                return (
                                                    <div 
                                                        key={b.id} 
                                                        className="bg-white border border-primary-100 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer hover:border-primary-300 hover:shadow-md transition-all active:scale-[0.98]"
                                                        onClick={() => setSelectedDetailUserId(b.id)}
                                                    >
                                                        <div className="flex items-center gap-3 min-w-0 pr-2">
                                                            <div className="w-10 h-10 rounded-full bg-primary-50 text-primary-700 font-bold flex items-center justify-center flex-shrink-0 border border-primary-100">
                                                                {b.id === 'me' ? (myName || '我')[0] : (b.name || '某')[0]}
                                                            </div>
                                                            <span className="font-bold text-primary-900 truncate">{b.id === 'me' ? myName : b.name}</span>
                                                        </div>
                                                        <div className="text-right flex-shrink-0">
                                                            {statusColor !== 'gray' ? (
                                                                <div>
                                                                    <div className={`text-[10px] font-bold text-${statusColor}-500 mb-0.5`}>{statusLabel}</div>
                                                                    <div className={`font-black text-${statusColor}-600 text-lg`}>{statusAmount}</div>
                                                                </div>
                                                            ) : (
                                                                <div className="font-bold text-primary-400 bg-primary-50 px-3 py-1 rounded-lg text-xs border border-primary-100">剛好打平</div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* 個人單日/行前 明細 Modal */}
                                        {selectedDetailUserId && (() => {
                                            const dUser = balances.find(u => u.id === selectedDetailUserId);
                                            if (!dUser) return null;
                                            
                                            // 過濾出與該用戶有關的消費（他墊付的 or 他有分攤的）
                                            const dExpenses = currentExpenses.filter(e => e.paidBy === selectedDetailUserId || e.payerIds.includes(selectedDetailUserId));

                                            return (
                                                <div className="fixed inset-0 bg-primary-950/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center" onClick={() => setSelectedDetailUserId(null)}>
                                                    <div className="bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                                                        {/* Header */}
                                                        <div className="px-6 py-5 border-b border-primary-100 flex justify-between items-center bg-white sm:rounded-t-2xl rounded-t-3xl z-10 shrink-0">
                                                            <div>
                                                                <h3 className="text-xl font-black text-primary-900">{dUser.id === 'me' ? myName : dUser.name} 的明細</h3>
                                                                <p className="text-xs text-primary-400 mt-1">{phase === 'pre' ? '出發前 (行前款)' : `${selectedDate.replace(/-/g, '/')} (當地消費)`}</p>
                                                            </div>
                                                            <button onClick={() => setSelectedDetailUserId(null)} className="w-8 h-8 bg-primary-50 rounded-full flex items-center justify-center text-primary-500 hover:bg-primary-100 transition"><Icon name="Xmark" size={16} /></button>
                                                        </div>
                                                        
                                                        {/* 逐筆列表 */}
                                                        <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-white">
                                                            {dExpenses.length === 0 ? (
                                                                <div className="text-center text-primary-400 py-6 text-sm font-bold">無相關消費明細</div>
                                                            ) : (
                                                                dExpenses.map(exp => {
                                                                    const finalT = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                                                                    const uPaid = exp.paidBy === selectedDetailUserId ? finalT : 0;
                                                                    const uShare = calculateFriendShare(exp, selectedDetailUserId);
                                                                    const uNet = uPaid - uShare; 
                                                                    const cat = CATEGORIES.find(c => c.id === exp.category);
                                                                    
                                                                    return (
                                                                        <div key={exp.id} className="bg-primary-50/50 border border-primary-100 rounded-xl p-4 flex justify-between items-center">
                                                                            <div className="flex items-center gap-3">
                                                                                <div className="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm text-primary-600 border border-primary-100 flex-shrink-0">
                                                                                    <Icon name={cat?.icon || 'Other'} />
                                                                                </div>
                                                                                <div>
                                                                                    <div className="font-bold text-primary-800 text-sm leading-snug">{exp.title}</div>
                                                                                    <div className="text-[10px] text-primary-400 mt-1 font-bold tracking-wider">總額 {formatMoney(finalT)}</div>
                                                                                </div>
                                                                            </div>
                                                                            <div className="text-right text-xs space-y-0.5 whitespace-nowrap">
                                                                                {uPaid > 0 && <div className="text-emerald-600 font-bold">代墊 +{formatMoney(uPaid)}</div>}
                                                                                {uShare > 0 && <div className="text-rose-600 font-bold">應付 -{formatMoney(uShare)}</div>}
                                                                                <div className={`font-black pt-1 mt-1 border-t border-primary-200/50 ${uNet > 0 ? 'text-emerald-600' : uNet < 0 ? 'text-rose-600' : 'text-primary-400'}`}>
                                                                                    小計: {uNet > 0 ? '+' : ''}{formatMoney(uNet)}
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    )
                                                                })
                                                            )}
                                                        </div>
                                                        
                                                        {/* Summary Bottom */}
                                                        <div className="p-5 border-t border-primary-100 bg-primary-50 sm:rounded-b-2xl shrink-0">
                                                            <div className="flex justify-between items-center text-sm mb-1.5">
                                                                <span className="text-primary-500 font-bold">當日總代墊</span>
                                                                <span className="text-emerald-600 font-bold">+{formatMoney(dUser.paid)}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-sm mb-3">
                                                                <span className="text-primary-500 font-bold">當日總應付 (自身花費)</span>
                                                                <span className="text-rose-600 font-bold">-{formatMoney(dUser.shouldPay)}</span>
                                                            </div>
                                                            <div className="flex justify-between items-center text-base pt-3 border-t border-primary-200">
                                                                <span className="text-primary-900 font-black tracking-widest">結算淨值</span>
                                                                <span className={`font-black text-xl ${dUser.net > 0 ? 'text-rose-600' : dUser.net < 0 ? 'text-emerald-600' : 'text-primary-500'}`}>
                                                                    {dUser.net > 0 ? `需付 ${formatMoney(dUser.net)}` : dUser.net < 0 ? `應收回 ${formatMoney(Math.abs(dUser.net))}` : '剛好打平'}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                );
                            })()}
                        </div>
                    </div>
                );
            }

            // --- View: Checkout List (收付款總紀錄) ---
            if (view === 'checkoutList') {
                // 計算每個人的全局餘額 (Global Balance)
                const users = { 'me': { id: 'me', name: myName }, ...friends.reduce((acc, f) => ({...acc, [f.id]: f}), {}) };
                Object.keys(users).forEach(id => {
                    users[id].totalExpenseDebt = 0; // 應付給別人的總額
                    users[id].totalPaid = 0;        // 代墊的總額
                    users[id].repaidOut = 0;        // 已還款給別人的總額
                    users[id].repaidIn = 0;         // 已收到別人還款的總額
                });

                expenses.forEach(exp => {
                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;
                    if (users[exp.paidBy]) users[exp.paidBy].totalPaid += finalTotal;
                    exp.payerIds.forEach(pid => {
                        if (users[pid]) users[pid].totalExpenseDebt += calculateFriendShare(exp, pid);
                    });
                });

                repayments.forEach(rep => {
                    if (users[rep.payerId]) users[rep.payerId].repaidOut += rep.amountTwd;
                    if (users[rep.payeeId]) users[rep.payeeId].repaidIn += rep.amountTwd;
                });

                const globalBalances = Object.values(users).map(u => {
                    // net > 0 代表該成員「欠款」，net < 0 代表該成員「被欠款 (待收)」
                    const globalNet = u.totalExpenseDebt - u.totalPaid - u.repaidOut + u.repaidIn;
                    return { ...u, globalNet };
                });

                // 讓「我」排第一
                const displayGlobal = [
                    globalBalances.find(b => b.id === 'me'),
                    ...globalBalances.filter(b => b.id !== 'me')
                ];

                return (
                    <div className="max-w-3xl mx-auto min-h-screen bg-white flex flex-col animate-fade-in relative pb-24">
                        <div className="bg-white sticky top-0 z-20 shadow-sm border-b border-primary-100">
                            <div className="px-5 py-5 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => changeView('summary')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-50 transition active:scale-95"><Icon name="ArrowLeft" size={20}/></button>
                                    <h2 className="text-xl font-black text-primary-900">總收支名單</h2>
                                </div>
                            </div>
                        </div>

                        <div className="p-5">
                            <div className="space-y-3">
                                {displayGlobal.map(b => (
                                    <div 
                                        key={b.id} 
                                        className="bg-white border border-primary-100 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer hover:border-primary-300 transition-all active:scale-[0.98]"
                                        onClick={() => { setSelectedDetailUserId(b.id); changeView('checkoutDetail'); }}
                                    >
                                        <div className="flex items-center gap-4 min-w-0 pr-2">
                                            <div className="w-12 h-12 rounded-full bg-primary-50 text-primary-700 font-bold flex items-center justify-center text-lg flex-shrink-0 border border-primary-100">
                                                {b.id === 'me' ? (myName || '我')[0] : b.name[0]}
                                            </div>
                                            <div className="truncate">
                                                <span className="font-bold text-primary-900 text-[16px]">{b.id === 'me' ? myName : b.name}</span>
                                                <div className="text-[11px] text-primary-400 mt-0.5">點擊查看收支與還款紀錄</div>
                                            </div>
                                        </div>
                                        <div className="text-right flex-shrink-0">
                                            {b.globalNet > 0 ? (
                                                <div>
                                                    <div className="text-[10px] font-bold text-rose-500 mb-0.5">待付 (欠款)</div>
                                                    <div className="font-black text-rose-600 text-xl">{formatMoney(b.globalNet)}</div>
                                                </div>
                                            ) : b.globalNet < 0 ? (
                                                <div>
                                                    <div className="text-[10px] font-bold text-emerald-500 mb-0.5">待收 (代墊)</div>
                                                    <div className="font-black text-emerald-600 text-xl">{formatMoney(Math.abs(b.globalNet))}</div>
                                                </div>
                                            ) : (
                                                <div className="font-bold text-primary-400 bg-primary-50 px-3 py-1.5 rounded-xl text-sm border border-primary-100">已結清</div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );

            // --- View: Checkout Detail (個人詳細結帳頁 - 重新設計的簡約排版 + Tabs) ---

                const userObj = userId === 'me' ? { id: 'me', name: myName } : friends.find(f => f.id === userId);
                if (!userObj) { setView('checkoutList'); return null; }

                const userRepayments = repayments.filter(r => r.payerId === userId || r.payeeId === userId);
                
                let totalExpenseDebt = 0;
                let totalPaid = 0;
                let repaidOut = 0;
                let repaidIn = 0;
                let dailyNet = { pre: 0 };
                tripDates.forEach(d => dailyNet[d] = 0);

                expenses.forEach(exp => {
                    const phaseKey = exp.phase === 'pre' ? 'pre' : exp.date;
                    const finalTotal = exp.hasFee ? Math.round(exp.baseTWD * 1.015) : exp.baseTWD;

                    if (exp.paidBy === userId) {
                        totalPaid += finalTotal;
                        dailyNet[phaseKey] -= finalTotal; 
                    }
                    if (exp.payerIds.includes(userId)) {
                        const share = calculateFriendShare(exp, userId);
                        totalExpenseDebt += share;
                        dailyNet[phaseKey] += share;
                    }
                });

                userRepayments.forEach(rep => {
                    if (rep.payerId === userId) repaidOut += rep.amountTwd;
                    if (rep.payeeId === userId) repaidIn += rep.amountTwd;
                });

                const globalNet = totalExpenseDebt - totalPaid - repaidOut + repaidIn;

                return (
                    <div className="max-w-3xl mx-auto min-h-screen bg-primary-50 flex flex-col animate-fade-in relative pb-28">

                            <div className="px-5 py-5 flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => changeView('checkoutList')} className="p-2 -ml-2 text-primary-500 rounded-full hover:bg-primary-100 transition active:scale-95"><Icon name="ArrowLeft" size={20}/></button>
                                    <h2 className="text-xl font-black text-primary-900">{userObj.name} 的收支紀錄</h2>

                                        {globalNet > 0 ? '待付款 (欠款)' : globalNet < 0 ? '待收回 (代墊)' : '已完全結清'}
                                    </div>
                                </div>
                                <div className="flex items-baseline">
                                    <div className={`text-5xl font-black tracking-tight ${globalNet > 0 ? 'text-rose-600' : globalNet < 0 ? 'text-emerald-600' : 'text-primary-800'}`}>
                                        {globalNet > 0 ? formatMoney(globalNet) : globalNet < 0 ? formatMoney(Math.abs(globalNet)) : '0'}
                                    </div>
                                </div>
