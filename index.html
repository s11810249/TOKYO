<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊分帳</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f4f7fb',
                            100: '#e9eef5',
                            200: '#cedce9',
                            300: '#a2bed7',
                            400: '#709bc0',
                            500: '#4a78a0',
                            600: '#3c658d',
                            700: '#315273',
                            800: '#2c4660',
                            900: '#293c51',
                            950: '#1b2736',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', "SF Pro TC", "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f4f7fb; 
            color: #2c4660; 
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .input-focus { transition: all 0.2s; }
        .input-focus:focus-within {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-color: #709bc0; 
        }

        /* 優化 Date Picker 樣式 */
        input[type="date"] {
            -webkit-appearance: none;
            display: block;
            width: 100%;
            min-height: 52px; /* 增加高度 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons ---
        const IconWrapper = ({ size = 24, children, className, onClick }) => (
            <svg onClick={onClick} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            Plus: (props) => <IconWrapper {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconWrapper>,
            Trash2: (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconWrapper>,
            Edit: (props) => <IconWrapper {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></IconWrapper>,
            Users: (props) => <IconWrapper {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></IconWrapper>,
            Receipt: (props) => <IconWrapper {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><line x1="12" y1="6" x2="12" y2="6.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line></IconWrapper>,
            Plane: (props) => <IconWrapper {...props}><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4 20-7z"></path></IconWrapper>,
            Bed: (props) => <IconWrapper {...props}><path d="M2 4v16"></path><path d="M2 8h18a2 2 0 0 1 2 2v10"></path><path d="M2 17h20"></path><path d="M6 8v9"></path></IconWrapper>,
            Bus: (props) => <IconWrapper {...props}><path d="M8 6v6"></path><path d="M15 6v6"></path><path d="M2 12h19.6"></path><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"></path><circle cx="7" cy="18" r="2"></circle><path d="M9 18h5"></path><circle cx="17" cy="18" r="2"></circle></IconWrapper>,
            Ticket: (props) => <IconWrapper {...props}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path></IconWrapper>,
            Wifi: (props) => <IconWrapper {...props}><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></IconWrapper>,
            Utensils: (props) => <IconWrapper {...props}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></IconWrapper>,
            ShoppingBag: (props) => <IconWrapper {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></IconWrapper>,
            ArrowLeft: (props) => <IconWrapper {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconWrapper>,
            Share: (props) => <IconWrapper {...props}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></IconWrapper>,
            Check: (props) => <IconWrapper {...props}><polyline points="20 6 9 17 4 12"></polyline></IconWrapper>,
            List: (props) => <IconWrapper {...props}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></IconWrapper>,
            FileText: (props) => <IconWrapper {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconWrapper>,
            Copy: (props) => <IconWrapper {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></IconWrapper>,
            RefreshCw: (props) => <IconWrapper {...props}><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></IconWrapper>,
            ArrowRight: (props) => <IconWrapper {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></IconWrapper>,
        };

        const CATEGORIES = [
            { id: 'food', name: '餐飲', icon: <Icons.Utensils size={18} /> },
            { id: 'transport', name: '交通', icon: <Icons.Bus size={18} /> },
            { id: 'flight', name: '機票', icon: <Icons.Plane size={18} /> },
            { id: 'hotel', name: '住宿', icon: <Icons.Bed size={18} /> },
            { id: 'ticket', name: '門票', icon: <Icons.Ticket size={18} /> },
            { id: 'wifi', name: '網路', icon: <Icons.Wifi size={18} /> },
            { id: 'shopping', name: '購物', icon: <Icons.ShoppingBag size={18} /> },
            { id: 'other', name: '其他', icon: <Icons.Receipt size={18} /> },
        ];

        const App = () => {
            const [view, setView] = useState('dashboard');
            
            // Data State
            const [friends, setFriends] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_friends')) || []; } catch { return []; }
            });
            const [expenses, setExpenses] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_expenses')) || []; } catch { return []; }
            });
            // Repayments now acts as "Transfers" between people
            const [repayments, setRepayments] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_repayments')) || []; } catch { return []; }
            });
            const [lastRate, setLastRate] = useState(() => {
                try { return localStorage.getItem('tokyo_last_rate') || '0.22'; } catch { return '0.22'; }
            });

            // Forms State
            const [newFriendName, setNewFriendName] = useState('');
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            
            // Expense Form
            const [expenseForm, setExpenseForm] = useState({
                title: '',
                amount: '',
                currency: 'TWD',
                rate: '',
                category: 'food',
                hasFee: false,
                payerId: 'me', // Default payer is ME
                payerIds: [], // People who split the bill
                date: new Date().toISOString().split('T')[0]
            });

            // Transfer Form (Settle Up)
            const [transferForm, setTransferForm] = useState({
                fromId: '',
                toId: '',
                amount: '',
                date: new Date().toISOString().split('T')[0],
                note: ''
            });

            // Persistence
            useEffect(() => { localStorage.setItem('tokyo_friends', JSON.stringify(friends)); }, [friends]);
            useEffect(() => { localStorage.setItem('tokyo_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('tokyo_repayments', JSON.stringify(repayments)); }, [repayments]);
            useEffect(() => { localStorage.setItem('tokyo_last_rate', lastRate); }, [lastRate]);

            // --- Helpers ---
            const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);
            const formatJPY = (amount) => new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(amount);

            // Calculate Base TWD
            const calculateBaseTWD = (amount, currency, rate) => {
                const num = parseFloat(amount);
                if (isNaN(num)) return 0;
                if (currency === 'JPY') {
                    const r = parseFloat(rate);
                    return isNaN(r) ? 0 : Math.round(num * r);
                }
                return Math.round(num);
            };

            const calculateFinalTotal = (baseTWD, hasFee) => hasFee ? Math.round(baseTWD * 1.015) : baseTWD;
            const calculatePerPerson = (total, count) => count === 0 ? 0 : Math.ceil(total / count);

            // --- Handlers ---
            const handleAddFriend = () => {
                if (!newFriendName.trim()) return;
                setFriends([...friends, { id: Date.now().toString(), name: newFriendName.trim() }]);
                setNewFriendName('');
            };

            const handleDeleteFriend = (id) => {
                if (confirm('確定刪除？這會影響相關帳目計算。')) {
                    setFriends(friends.filter(f => f.id !== id));
                }
            };

            const handleSaveExpense = () => {
                if (!expenseForm.title || !expenseForm.amount || expenseForm.payerIds.length === 0) {
                    alert('請填寫完整資訊');
                    return;
                }
                if (expenseForm.currency === 'JPY' && !expenseForm.rate) {
                    alert('請輸入匯率');
                    return;
                }
                if (expenseForm.currency === 'JPY') setLastRate(expenseForm.rate);

                const baseTWD = calculateBaseTWD(expenseForm.amount, expenseForm.currency, expenseForm.rate);
                const finalTotal = calculateFinalTotal(baseTWD, expenseForm.hasFee);
                
                const expenseData = {
                    id: editingExpenseId || Date.now().toString(),
                    title: expenseForm.title,
                    originalAmount: parseFloat(expenseForm.amount),
                    currency: expenseForm.currency,
                    rate: expenseForm.currency === 'JPY' ? parseFloat(expenseForm.rate) : 1,
                    baseTWD: baseTWD,
                    hasFee: expenseForm.hasFee,
                    finalTotal: finalTotal, 
                    category: expenseForm.category,
                    payerId: expenseForm.payerId, // Who paid?
                    payerIds: expenseForm.payerIds, // Who splits?
                    date: expenseForm.date
                };

                if (editingExpenseId) {
                    setExpenses(expenses.map(e => e.id === editingExpenseId ? expenseData : e));
                    setEditingExpenseId(null);
                } else {
                    setExpenses([expenseData, ...expenses]);
                }
                
                // Reset, keep date/rate
                setExpenseForm(prev => ({ 
                    ...prev, title: '', amount: '', category: 'food', hasFee: false, payerIds: [], payerId: 'me'
                }));

                if (editingExpenseId) setView('allExpenses');
                else setView('dashboard');
            };

            const handleEditExpense = (expense) => {
                setEditingExpenseId(expense.id);
                setExpenseForm({
                    title: expense.title,
                    amount: expense.originalAmount || expense.amount, 
                    currency: expense.currency || 'TWD',
                    rate: expense.rate || lastRate,
                    category: expense.category,
                    hasFee: expense.hasFee,
                    payerId: expense.payerId || 'me',
                    payerIds: expense.payerIds,
                    date: expense.date ? expense.date.split('T')[0] : new Date().toISOString().split('T')[0]
                });
                setView('addExpense');
            };

            const handleDeleteExpense = (id) => {
                if(confirm('確定刪除這筆款項？')) setExpenses(expenses.filter(e => e.id !== id));
            };

            const togglePayer = (id) => {
                setExpenseForm(prev => {
                    const current = prev.payerIds;
                    return current.includes(id) ? { ...prev, payerIds: current.filter(p => p !== id) } : { ...prev, payerIds: [...current, id] };
                });
            };

            const selectAllPayers = () => {
                const allIds = ['me', ...friends.map(f => f.id)];
                setExpenseForm(prev => ({ ...prev, payerIds: prev.payerIds.length === allIds.length ? [] : allIds }));
            };

            // --- Transfer / Settlement Handlers ---
            const handleSaveTransfer = () => {
                if (!transferForm.fromId || !transferForm.toId || !transferForm.amount) {
                    alert('請填寫完整資訊'); return;
                }
                if (transferForm.fromId === transferForm.toId) {
                    alert('轉出與轉入對象不能相同'); return;
                }

                const newTransfer = {
                    id: Date.now().toString(),
                    fromId: transferForm.fromId,
                    toId: transferForm.toId,
                    amount: parseInt(transferForm.amount),
                    date: transferForm.date,
                    note: transferForm.note
                };
                
                setRepayments([newTransfer, ...repayments]);
                setTransferForm({ fromId: '', toId: '', amount: '', date: new Date().toISOString().split('T')[0], note: '' });
                setView('dashboard');
            };

            const handleDeleteTransfer = (id) => {
                if(confirm('刪除這筆轉帳紀錄？')) setRepayments(repayments.filter(r => r.id !== id));
            };

            // --- Calculation Logic (Net Balance) ---
            const balances = useMemo(() => {
                // Initialize balances for everyone (including 'me')
                const bals = { 'me': 0 };
                friends.forEach(f => bals[f.id] = 0);

                // 1. Process Expenses
                expenses.forEach(exp => {
                    const splitCount = exp.payerIds.length;
                    if (splitCount === 0) return;
                    
                    const finalTotal = exp.finalTotal !== undefined ? exp.finalTotal : exp.amount;
                    const payer = exp.payerId || 'me';
                    
                    // Payer gets credit (+ paid amount)
                    if (bals[payer] !== undefined) bals[payer] += finalTotal;

                    // Consumers get debit (- split amount)
                    // Note: Rounding gain goes to Payer naturally because (Paid > Sum of splits) in integer math? 
                    // Wait, Math.ceil means (Sum of splits >= Paid). 
                    // If Paid 100, 3 ppl. Split 34. 34*3 = 102. 
                    // Payer (+100). A(-34), B(-34), C(-34). Net = -2. 
                    // The group "overpaid" effectively. 
                    // To be fair, let's strictly subtract what they "owe". 
                    // Payer effectively gains the extra 2. It's fine for simple travel logic.
                    
                    const perPersonShare = calculatePerPerson(finalTotal, splitCount);
                    
                    exp.payerIds.forEach(pid => {
                        if (bals[pid] !== undefined) bals[pid] -= perPersonShare;
                    });
                });

                // 2. Process Transfers (Settlements)
                repayments.forEach(tr => {
                    // From pays To.
                    // From's balance increases (Debt reduces, or Credit increases? Wait.)
                    // Balance = (Money I paid for others) - (Money I consumed)
                    // If I am Negative (I consumed more), I need to PAY.
                    // If I PAY someone, my balance should increase (become less negative).
                    if (bals[tr.fromId] !== undefined) bals[tr.fromId] += tr.amount;
                    if (bals[tr.toId] !== undefined) bals[tr.toId] -= tr.amount;
                });

                return bals;
            }, [expenses, repayments, friends]);

            // --- Views ---

            if (view === 'dashboard') {
                const myBalance = balances['me'];
                return (
                    <div className="max-w-3xl mx-auto min-h-screen pb-24">
                        {/* Header */}
                        <div className="bg-white border-b border-primary-200 sticky top-0 z-20 shadow-sm">
                            <div className="p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h1 className="text-2xl font-bold text-primary-900 tracking-tight">旅遊分帳</h1>
                                    <button onClick={() => setView('addFriend')} className="p-2.5 bg-primary-50 text-primary-600 rounded-full hover:bg-primary-100 transition-colors">
                                        <Icons.Users size={22} />
                                    </button>
                                </div>
                                
                                {/* My Card */}
                                <div className={`rounded-2xl p-6 border mb-6 transition-colors ${myBalance >= 0 ? 'bg-emerald-50 border-emerald-100' : 'bg-slate-50 border-slate-200'}`}>
                                    <p className={`text-sm font-bold tracking-wide uppercase mb-1 ${myBalance >= 0 ? 'text-emerald-600' : 'text-slate-500'}`}>
                                        {myBalance >= 0 ? '別人欠我的 (應收)' : '我欠別人的 (應付)'}
                                    </p>
                                    <div className={`text-4xl font-extrabold tracking-tight ${myBalance >= 0 ? 'text-emerald-700' : 'text-slate-700'}`}>
                                        {formatMoney(Math.abs(myBalance))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-3">
                                    <button onClick={() => setView('allExpenses')} className="bg-white border border-primary-200 hover:bg-primary-50 text-primary-700 py-3 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition shadow-sm">
                                        <Icons.List size={20} className="text-primary-400" /> 帳目明細
                                    </button>
                                    <button onClick={() => setView('summaryReport')} className="bg-white border border-primary-200 hover:bg-primary-50 text-primary-700 py-3 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition shadow-sm">
                                        <Icons.FileText size={20} className="text-primary-400" /> 結算報表
                                    </button>
                                    <button onClick={() => setView('addTransfer')} className="bg-primary-600 hover:bg-primary-700 text-white py-3 rounded-xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition shadow-md">
                                        <Icons.RefreshCw size={20} className="text-primary-200" /> 還款/轉帳
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Friends List */}
                        <div className="p-4 space-y-3">
                            <h3 className="text-xs font-bold text-primary-400 uppercase tracking-wider px-2">團員餘額狀態</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {friends.length === 0 ? (
                                    <div className="text-center py-10 text-primary-400 col-span-full">請先新增團員</div>
                                ) : (
                                    friends.map(friend => {
                                        const bal = balances[friend.id] || 0;
                                        return (
                                            <div key={friend.id} className="bg-white p-5 rounded-2xl shadow-sm border border-primary-100 flex justify-between items-center">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center font-bold text-primary-600">
                                                        {friend.name[0]}
                                                    </div>
                                                    <span className="font-bold text-lg text-primary-900">{friend.name}</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className={`font-bold text-xl ${bal >= 0 ? 'text-emerald-600' : 'text-primary-800'}`}>
                                                        {bal > 0 ? '+' : ''}{formatMoney(bal)}
                                                    </div>
                                                    <div className="text-xs font-bold text-primary-300 mt-1">
                                                        {bal >= 0 ? '應收 (墊多了)' : '應付 (欠款)'}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* FAB */}
                        <div className="fixed bottom-6 right-6 safe-bottom z-30">
                            <button 
                                onClick={() => { 
                                    setEditingExpenseId(null);
                                    setExpenseForm({ 
                                        title: '', amount: '', currency: 'TWD', rate: lastRate, 
                                        category: 'food', hasFee: false, payerIds: [], payerId: 'me',
                                        date: new Date().toISOString().split('T')[0] 
                                    });
                                    setView('addExpense'); 
                                }}
                                className="w-16 h-16 bg-primary-600 text-white rounded-full shadow-xl shadow-primary-300 flex items-center justify-center active:scale-95 transition-transform hover:bg-primary-500"
                            >
                                <Icons.Plus size={32} />
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'addExpense') {
                const baseTWD = calculateBaseTWD(expenseForm.amount, expenseForm.currency, expenseForm.rate);
                const finalAmt = calculateFinalTotal(baseTWD, expenseForm.hasFee);
                const splitCount = expenseForm.payerIds.length;
                const perPerson = calculatePerPerson(finalAmt, splitCount);
                const allPayerIds = ['me', ...friends.map(f => f.id)];
                
                // Helper to get name
                const getName = (id) => id === 'me' ? '我自己 (主揪)' : friends.find(f => f.id === id)?.name || id;

                return (
                    <div className="max-w-2xl mx-auto bg-white min-h-screen flex flex-col">
                        <div className="px-4 py-3 border-b border-primary-100 flex items-center gap-3 sticky top-0 bg-white/90 backdrop-blur z-20">
                            <button onClick={() => setView(editingExpenseId ? 'allExpenses' : 'dashboard')} className="p-2 -ml-2 text-primary-500 hover:bg-primary-50 rounded-full"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-lg text-primary-800">{editingExpenseId ? '編輯消費' : '新增消費'}</h2>
                        </div>

                        <div className="flex-1 overflow-y-auto no-scrollbar">
                            <div className="p-6 space-y-8 pb-40"> 
                                
                                {/* Date Picker - Customized */}
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">消費日期</label>
                                    <div className="relative">
                                        <input 
                                            type="date" 
                                            className="w-full bg-primary-50 rounded-xl font-bold text-primary-800 text-lg px-4 border border-transparent focus:border-primary-400 focus:bg-white transition-colors cursor-pointer"
                                            value={expenseForm.date}
                                            onChange={(e) => setExpenseForm({...expenseForm, date: e.target.value})}
                                        />
                                    </div>
                                </div>

                                {/* Who Paid? */}
                                <div className="space-y-2">
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">誰先墊的款？ (付款人)</label>
                                    <div className="flex overflow-x-auto gap-2 pb-2 no-scrollbar">
                                        <button 
                                            onClick={() => setExpenseForm({...expenseForm, payerId: 'me'})}
                                            className={`flex-shrink-0 px-5 py-3 rounded-xl font-bold border transition-all ${expenseForm.payerId === 'me' ? 'bg-primary-600 text-white border-primary-600 shadow-md' : 'bg-white border-primary-100 text-primary-500'}`}
                                        >
                                            我自己
                                        </button>
                                        {friends.map(f => (
                                            <button 
                                                key={f.id}
                                                onClick={() => setExpenseForm({...expenseForm, payerId: f.id})}
                                                className={`flex-shrink-0 px-5 py-3 rounded-xl font-bold border transition-all ${expenseForm.payerId === f.id ? 'bg-primary-600 text-white border-primary-600 shadow-md' : 'bg-white border-primary-100 text-primary-500'}`}
                                            >
                                                {f.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Amount Section */}
                                <div>
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-wider block mb-2">
                                        消費金額 ({expenseForm.currency})
                                    </label>
                                    <div className="relative input-focus bg-primary-50 rounded-2xl border border-transparent flex">
                                        <div className="flex items-center pl-2">
                                            <button onClick={() => setExpenseForm({...expenseForm, currency: 'TWD'})} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${expenseForm.currency === 'TWD' ? 'bg-white text-primary-600 shadow' : 'text-primary-400'}`}>TWD</button>
                                            <button onClick={() => setExpenseForm({...expenseForm, currency: 'JPY'})} className={`px-3 py-1 text-xs font-bold rounded-lg transition-all ${expenseForm.currency === 'JPY' ? 'bg-white text-primary-600 shadow' : 'text-primary-400'}`}>JPY</button>
                                        </div>
                                        <input 
                                            type="number" 
                                            inputMode="decimal"
                                            className="w-full text-4xl font-extrabold p-4 bg-transparent outline-none text-primary-800 placeholder-primary-300 text-right"
                                            placeholder="0"
                                            value={expenseForm.amount}
                                            onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})}
                                        />
                                    </div>
                                    {/* JPY Rate */}
                                    {expenseForm.currency === 'JPY' && (
                                        <div className="flex justify-end mt-2 items-center gap-2">
                                            <span className="text-xs font-bold text-primary-400">匯率</span>
                                            <input 
                                                type="number" 
                                                inputMode="decimal"
                                                step="0.001"
                                                className="w-20 p-2 bg-white border border-primary-100 rounded-lg text-right font-bold text-primary-700 outline-none focus:border-primary-400"
                                                placeholder="0.22"
                                                value={expenseForm.rate}
                                                onChange={(e) => setExpenseForm({...expenseForm, rate: e.target.value})}
                                            />
                                        </div>
                                    )}

                                    {/* Fee Toggle */}
                                    <div className="mt-4 flex items-center gap-3 bg-white p-3 border border-primary-100 rounded-xl">
                                        <input 
                                            type="checkbox" 
                                            id="fee" 
                                            checked={expenseForm.hasFee}
                                            onChange={(e) => setExpenseForm({...expenseForm, hasFee: e.target.checked})}
                                            className="w-5 h-5 accent-primary-600 rounded"
                                        />
                                        <label htmlFor="fee" className="flex-1 text-sm font-bold text-primary-700">海外交易手續費 (+1.5%)</label>
                                        <div className="text-right">
                                            <div className="text-xs text-primary-400">總入帳 (TWD)</div>
                                            <div className="text-lg font-bold text-primary-600">{formatMoney(finalAmt)}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Title & Category */}
                                <div className="space-y-4">
                                    <input 
                                        type="text" 
                                        className="w-full p-4 bg-primary-50 rounded-xl font-medium text-primary-700 outline-none focus:ring-2 focus:ring-primary-400 transition-all placeholder-primary-300"
                                        placeholder="項目名稱 (例如：敘敘苑燒肉)"
                                        value={expenseForm.title}
                                        onChange={(e) => setExpenseForm({...expenseForm, title: e.target.value})}
                                    />
                                    <div className="grid grid-cols-4 gap-2">
                                        {CATEGORIES.map(cat => (
                                            <button
                                                key={cat.id}
                                                onClick={() => setExpenseForm({...expenseForm, category: cat.id})}
                                                className={`flex flex-col items-center justify-center p-3 rounded-xl text-xs font-bold transition-all ${
                                                    expenseForm.category === cat.id 
                                                    ? 'bg-primary-600 text-white shadow-md transform scale-105' 
                                                    : 'bg-white border border-primary-100 text-primary-400 hover:bg-primary-50'
                                                }`}
                                            >
                                                <div className="mb-1">{cat.icon}</div>
                                                {cat.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Splitters */}
                                <div>
                                    <div className="flex justify-between items-end mb-3">
                                        <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">選擇分攤對象</label>
                                        <button onClick={selectAllPayers} className="text-xs text-primary-600 font-bold px-3 py-1 bg-primary-100 rounded-full hover:bg-primary-200 transition">
                                            {expenseForm.payerIds.length === allPayerIds.length ? '取消全選' : '全選'}
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button 
                                            onClick={() => togglePayer('me')}
                                            className={`p-3 rounded-xl flex items-center gap-3 border transition-all ${
                                                expenseForm.payerIds.includes('me') 
                                                ? 'border-primary-500 bg-primary-50 text-primary-700 font-bold' 
                                                : 'border-primary-100 bg-white text-primary-400'
                                            }`}
                                        >
                                            <div className={`w-5 h-5 rounded-full flex items-center justify-center transition-colors ${
                                                expenseForm.payerIds.includes('me') ? 'bg-primary-500 text-white' : 'bg-primary-200 text-transparent'
                                            }`}>
                                                <Icons.Check size={12} />
                                            </div>
                                            我自己
                                        </button>

                                        {friends.map(friend => (
                                            <button 
                                                key={friend.id}
                                                onClick={() => togglePayer(friend.id)}
                                                className={`p-3 rounded-xl flex items-center gap-3 border transition-all ${
                                                    expenseForm.payerIds.includes(friend.id) 
                                                    ? 'border-primary-500 bg-primary-50 text-primary-700 font-bold' 
                                                    : 'border-primary-100 bg-white text-primary-400'
                                                }`}
                                            >
                                                <div className={`w-5 h-5 rounded-full flex items-center justify-center transition-colors ${
                                                    expenseForm.payerIds.includes(friend.id) ? 'bg-primary-500 text-white' : 'bg-primary-200 text-transparent'
                                                }`}>
                                                    <Icons.Check size={12} />
                                                </div>
                                                {friend.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-primary-100 p-4 safe-bottom max-w-2xl mx-auto shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-30">
                            <div className="flex justify-between items-center mb-3 text-sm">
                                <span className="text-primary-500 font-medium">代墊人: <span className="font-bold text-primary-800">{getName(expenseForm.payerId)}</span></span>
                                <span className="text-primary-500 font-medium">每人分攤: <span className="text-primary-600 font-bold text-lg">{formatMoney(perPerson)}</span></span>
                            </div>
                            <button 
                                onClick={handleSaveExpense}
                                className="w-full bg-primary-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform hover:bg-primary-700"
                            >
                                {editingExpenseId ? '儲存修改' : '確認記帳'}
                            </button>
                        </div>
                    </div>
                );
            }

            // Transfer View
            if (view === 'addTransfer') {
                return (
                    <div className="max-w-2xl mx-auto bg-white min-h-screen flex flex-col">
                        <div className="px-4 py-3 border-b border-primary-100 flex items-center gap-3 sticky top-0 bg-white z-20">
                            <button onClick={() => setView('dashboard')} className="p-2 -ml-2 text-primary-500 hover:bg-primary-50 rounded-full"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-lg text-primary-800">新增還款 / 轉帳</h2>
                        </div>
                        <div className="p-6 space-y-6">
                            <div className="bg-primary-50 p-4 rounded-xl text-sm text-primary-600 mb-4">
                                <p>💡 <strong>飯店算帳時間：</strong></p>
                                <p>如果 A 拿了現金給 B，請在這裡紀錄。系統會自動扣除雙方的債務/餘額。</p>
                            </div>

                            <div className="space-y-1">
                                <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">日期</label>
                                <input type="date" value={transferForm.date} onChange={(e) => setTransferForm({...transferForm, date: e.target.value})} className="w-full bg-primary-50 rounded-xl font-bold text-primary-800 text-lg px-4 h-12 border border-transparent focus:border-primary-400" />
                            </div>

                            <div className="grid grid-cols-2 gap-4 items-center">
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">誰給錢 (付)</label>
                                    <select value={transferForm.fromId} onChange={(e) => setTransferForm({...transferForm, fromId: e.target.value})} className="w-full h-12 bg-white border border-primary-200 rounded-xl px-3 font-bold text-primary-800">
                                        <option value="">請選擇</option>
                                        <option value="me">我自己</option>
                                        {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                    </select>
                                </div>
                                <div className="flex justify-center pt-5 text-primary-400"><Icons.ArrowRight /></div>
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">給誰 (收)</label>
                                    <select value={transferForm.toId} onChange={(e) => setTransferForm({...transferForm, toId: e.target.value})} className="w-full h-12 bg-white border border-primary-200 rounded-xl px-3 font-bold text-primary-800">
                                        <option value="">請選擇</option>
                                        <option value="me">我自己</option>
                                        {friends.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-1">
                                <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">金額 (TWD)</label>
                                <input type="number" value={transferForm.amount} onChange={(e) => setTransferForm({...transferForm, amount: e.target.value})} className="w-full h-16 bg-primary-50 rounded-xl font-extrabold text-primary-800 text-4xl px-4 outline-none text-center" placeholder="0" />
                            </div>

                            <div className="space-y-1">
                                <label className="text-xs font-bold text-primary-400 uppercase tracking-wider">備註</label>
                                <input type="text" value={transferForm.note} onChange={(e) => setTransferForm({...transferForm, note: e.target.value})} className="w-full h-12 bg-primary-50 rounded-xl px-4 text-primary-700" placeholder="例如：還昨天的燒肉錢" />
                            </div>

                            <button onClick={handleSaveTransfer} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4 transition-colors">確認轉帳</button>
                            
                            {/* History List */}
                            <div className="pt-8">
                                <h3 className="text-xs font-bold text-primary-400 uppercase tracking-wider mb-3">最近轉帳紀錄</h3>
                                {repayments.length === 0 ? <p className="text-center text-primary-300 text-sm">無紀錄</p> : 
                                    repayments.map(r => {
                                        const fromName = r.fromId === 'me' ? '我' : friends.find(f => f.id === r.fromId)?.name;
                                        const toName = r.toId === 'me' ? '我' : friends.find(f => f.id === r.toId)?.name;
                                        return (
                                            <div key={r.id} className="flex justify-between items-center p-3 border-b border-primary-50 last:border-0">
                                                <div>
                                                    <div className="font-bold text-primary-800 text-sm">{fromName} ➜ {toName}</div>
                                                    <div className="text-xs text-primary-400">{r.date} {r.note && `• ${r.note}`}</div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="font-bold text-emerald-600">{formatMoney(r.amount)}</span>
                                                    <button onClick={() => handleDeleteTransfer(r.id)} className="text-primary-300 hover:text-rose-500"><Icons.Trash2 size={16}/></button>
                                                </div>
                                            </div>
                                        )
                                    })
                                }
                            </div>
                        </div>
                    </div>
                )
            }

            // Summary View (Consolidated)
            if (view === 'summaryReport') {
                const copyAllReport = () => {
                    let text = `【旅遊結算單】\n\n`;
                    [...friends, {id:'me', name:'我'}].forEach(p => {
                        const bal = balances[p.id] || 0;
                        if(bal !== 0) {
                            text += `${p.name}: ${bal > 0 ? '應收' : '應付'} ${formatMoney(Math.abs(bal))}\n`;
                        }
                    });
                    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); alert('已複製！');
                };
                
                return (
                    <div className="max-w-3xl mx-auto min-h-screen pb-10 bg-white">
                        <div className="px-4 py-3 border-b border-primary-100 flex items-center gap-3 sticky top-0 bg-white z-20">
                            <button onClick={() => setView('dashboard')} className="p-2 -ml-2 text-primary-500 hover:bg-primary-50 rounded-full"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-lg text-primary-800 flex-1">結算報表</h2>
                            <button onClick={copyAllReport} className="text-sm font-bold text-primary-600 bg-primary-50 px-3 py-1 rounded-lg">複製</button>
                        </div>
                        <div className="p-6">
                            <div className="bg-primary-50 p-4 rounded-xl mb-6 text-sm text-primary-600 leading-relaxed">
                                <p>這是目前的<strong>淨餘額狀態</strong>。</p>
                                <ul className="list-disc pl-5 mt-2 space-y-1">
                                    <li><span className="text-emerald-600 font-bold">綠色數字</span>：墊付比較多，其他人要給錢。</li>
                                    <li><span className="text-primary-800 font-bold">深色數字</span>：墊付比較少，需要拿錢出來。</li>
                                </ul>
                            </div>
                            <div className="space-y-4">
                                {[...friends, {id:'me', name:'我'}].map(p => {
                                    const bal = balances[p.id] || 0;
                                    return (
                                        <div key={p.id} className="flex justify-between items-center p-4 border-b border-primary-50">
                                            <div className="font-bold text-lg text-primary-800">{p.name}</div>
                                            <div className={`font-bold text-xl ${bal >= 0 ? 'text-emerald-600' : 'text-primary-800'}`}>
                                                {bal > 0 ? '+' : ''}{formatMoney(bal)}
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                )
            }

            // Simple Views (Add Friend, All Expenses) same as before but updated styles...
            // I'll keep them concise for file size limits, functionality preserved.
            if (view === 'addFriend') {
                return (
                    <div className="max-w-2xl mx-auto bg-white min-h-screen p-6">
                        <div className="flex items-center gap-2 mb-8">
                            <button onClick={() => setView('dashboard')} className="p-2 -ml-2 text-primary-500 hover:bg-primary-50 rounded-full"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-xl text-primary-800">成員管理</h2>
                        </div>
                        <div className="flex gap-3 mb-8">
                            <input type="text" value={newFriendName} onChange={(e) => setNewFriendName(e.target.value)} className="flex-1 p-4 bg-primary-50 rounded-xl outline-none focus:ring-2 focus:ring-primary-400 text-primary-700" placeholder="輸入名字" />
                            <button onClick={handleAddFriend} className="bg-primary-600 text-white px-8 rounded-xl font-bold hover:bg-primary-700">新增</button>
                        </div>
                        <div className="space-y-3">
                            {friends.map(f => (
                                <div key={f.id} className="flex justify-between items-center p-4 bg-primary-50 rounded-xl border border-primary-100">
                                    <span className="font-bold text-primary-700">{f.name}</span>
                                    <button onClick={() => handleDeleteFriend(f.id)} className="text-primary-300 hover:text-rose-500"><Icons.Trash2 size={20} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (view === 'allExpenses') {
                const sortedExpenses = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                return (
                    <div className="max-w-3xl mx-auto min-h-screen pb-10 bg-white">
                         <div className="bg-white sticky top-0 z-10 border-b border-primary-100 px-4 py-3 flex items-center gap-2">
                            <button onClick={() => setView('dashboard')} className="p-2 -ml-2 text-primary-500 hover:bg-primary-50 rounded-full"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-lg text-primary-800">所有帳目明細</h2>
                        </div>
                        <div className="p-4 space-y-3">
                            {sortedExpenses.map(exp => {
                                const cat = CATEGORIES.find(c => c.id === exp.category);
                                const finalTotal = exp.finalTotal !== undefined ? exp.finalTotal : exp.amount;
                                const payerName = exp.payerId === 'me' ? '我' : friends.find(f => f.id === exp.payerId)?.name || '未知';
                                
                                return (
                                    <div key={exp.id} className="bg-white p-4 rounded-xl shadow-sm border border-primary-100 flex justify-between items-center hover:border-primary-300 transition-colors">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-full bg-primary-100 text-primary-500 flex items-center justify-center flex-shrink-0">{cat.icon}</div>
                                            <div className="overflow-hidden">
                                                <div className="font-bold text-primary-800 truncate">{exp.title}</div>
                                                <div className="text-xs text-primary-400 font-medium flex items-center gap-2">
                                                    <span>{exp.date.split('T')[0]}</span>
                                                    <span className="bg-primary-50 px-1.5 py-0.5 rounded text-primary-600">{payerName} 墊付</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-right flex-shrink-0 pl-2">
                                            <div className="font-bold text-lg text-primary-700">{formatMoney(finalTotal)}</div>
                                            <div className="flex gap-2 justify-end mt-1">
                                                <button onClick={() => handleEditExpense(exp)} className="text-primary-400 p-1 hover:text-primary-600 hover:bg-primary-50 rounded"><Icons.Edit size={16}/></button>
                                                <button onClick={() => handleDeleteExpense(exp.id)} className="text-primary-300 p-1 hover:text-rose-500 hover:bg-rose-50 rounded"><Icons.Trash2 size={16}/></button>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
