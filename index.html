<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>東京分帳神器 V4 (總報表版)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 內建圖示組件 (SVG) ---
        const IconWrapper = ({ size = 24, children, className, onClick }) => (
            <svg onClick={onClick} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            Plus: (props) => <IconWrapper {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconWrapper>,
            Trash2: (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconWrapper>,
            Edit: (props) => <IconWrapper {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></IconWrapper>,
            Users: (props) => <IconWrapper {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></IconWrapper>,
            Receipt: (props) => <IconWrapper {...props}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"></path><line x1="12" y1="6" x2="12" y2="6.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line></IconWrapper>,
            Plane: (props) => <IconWrapper {...props}><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4 20-7z"></path></IconWrapper>,
            Bed: (props) => <IconWrapper {...props}><path d="M2 4v16"></path><path d="M2 8h18a2 2 0 0 1 2 2v10"></path><path d="M2 17h20"></path><path d="M6 8v9"></path></IconWrapper>,
            Bus: (props) => <IconWrapper {...props}><path d="M8 6v6"></path><path d="M15 6v6"></path><path d="M2 12h19.6"></path><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"></path><circle cx="7" cy="18" r="2"></circle><path d="M9 18h5"></path><circle cx="17" cy="18" r="2"></circle></IconWrapper>,
            Ticket: (props) => <IconWrapper {...props}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path></IconWrapper>,
            Wifi: (props) => <IconWrapper {...props}><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></IconWrapper>,
            Utensils: (props) => <IconWrapper {...props}><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></IconWrapper>,
            ShoppingBag: (props) => <IconWrapper {...props}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></IconWrapper>,
            ArrowLeft: (props) => <IconWrapper {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconWrapper>,
            Share: (props) => <IconWrapper {...props}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></IconWrapper>,
            Check: (props) => <IconWrapper {...props}><polyline points="20 6 9 17 4 12"></polyline></IconWrapper>,
            List: (props) => <IconWrapper {...props}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></IconWrapper>,
            Wallet: (props) => <IconWrapper {...props}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></IconWrapper>,
            FileText: (props) => <IconWrapper {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconWrapper>,
            Copy: (props) => <IconWrapper {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></IconWrapper>,
        };

        const CATEGORIES = [
            { id: 'food', name: '餐飲', icon: <Icons.Utensils size={18} /> },
            { id: 'transport', name: '交通', icon: <Icons.Bus size={18} /> },
            { id: 'flight', name: '機票', icon: <Icons.Plane size={18} /> },
            { id: 'hotel', name: '住宿', icon: <Icons.Bed size={18} /> },
            { id: 'ticket', name: '門票', icon: <Icons.Ticket size={18} /> },
            { id: 'wifi', name: '網路', icon: <Icons.Wifi size={18} /> },
            { id: 'shopping', name: '購物', icon: <Icons.ShoppingBag size={18} /> },
            { id: 'other', name: '其他', icon: <Icons.Receipt size={18} /> },
        ];

        const App = () => {
            // Views: dashboard, addFriend, addExpense, editExpense, friendDetail, allExpenses, addRepayment, summaryReport
            const [view, setView] = useState('dashboard');
            const [tab, setTab] = useState('debt'); 
            
            const [selectedFriendId, setSelectedFriendId] = useState(null);
            const [editingExpenseId, setEditingExpenseId] = useState(null);
            const [editingRepaymentId, setEditingRepaymentId] = useState(null);
            
            // Data State
            const [friends, setFriends] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_friends')) || []; } catch { return []; }
            });
            const [expenses, setExpenses] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_expenses')) || []; } catch { return []; }
            });
            const [repayments, setRepayments] = useState(() => {
                try { return JSON.parse(localStorage.getItem('tokyo_repayments')) || []; } catch { return []; }
            });

            // Forms State
            const [newFriendName, setNewFriendName] = useState('');
            
            // Expense Form (Add & Edit)
            const [expenseForm, setExpenseForm] = useState({
                title: '',
                amount: '',
                category: 'food',
                hasFee: false,
                payerIds: [],
                date: new Date().toISOString().split('T')[0]
            });

            // Repayment Form
            const [repaymentForm, setRepaymentForm] = useState({
                amount: '',
                date: new Date().toISOString().split('T')[0],
                note: ''
            });

            // Persistence
            useEffect(() => { localStorage.setItem('tokyo_friends', JSON.stringify(friends)); }, [friends]);
            useEffect(() => { localStorage.setItem('tokyo_expenses', JSON.stringify(expenses)); }, [expenses]);
            useEffect(() => { localStorage.setItem('tokyo_repayments', JSON.stringify(repayments)); }, [repayments]);

            // --- Helpers ---
            const formatMoney = (amount) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(amount);
            
            const calculateFinalAmount = (amount, hasFee) => {
                const num = parseFloat(amount);
                if (isNaN(num)) return 0;
                return hasFee ? Math.round(num * 1.015) : Math.round(num);
            };

            const calculatePerPerson = (total, count) => {
                if (count === 0) return 0;
                return Math.ceil(total / count); // 無條件進位
            };

            // --- Handlers ---
            const handleAddFriend = () => {
                if (!newFriendName.trim()) return;
                setFriends([...friends, { id: Date.now().toString(), name: newFriendName.trim() }]);
                setNewFriendName('');
            };

            const handleDeleteFriend = (id) => {
                if (confirm('確定刪除？這會影響相關帳目計算。')) {
                    setFriends(friends.filter(f => f.id !== id));
                }
            };

            const handleSaveExpense = () => {
                if (!expenseForm.title || !expenseForm.amount || expenseForm.payerIds.length === 0) {
                    alert('請填寫完整資訊');
                    return;
                }
                const finalTotal = calculateFinalAmount(expenseForm.amount, expenseForm.hasFee);
                const expenseData = {
                    id: editingExpenseId || Date.now().toString(),
                    title: expenseForm.title,
                    amount: parseFloat(expenseForm.amount),
                    hasFee: expenseForm.hasFee,
                    finalTotal: finalTotal,
                    category: expenseForm.category,
                    payerIds: expenseForm.payerIds,
                    date: expenseForm.date
                };

                if (editingExpenseId) {
                    setExpenses(expenses.map(e => e.id === editingExpenseId ? expenseData : e));
                    setEditingExpenseId(null);
                } else {
                    setExpenses([expenseData, ...expenses]);
                }
                
                setExpenseForm({ title: '', amount: '', category: 'food', hasFee: false, payerIds: [], date: new Date().toISOString().split('T')[0] });
                if (editingExpenseId) {
                    setView('allExpenses');
                } else {
                    setView('dashboard');
                }
            };

            const handleEditExpense = (expense) => {
                setEditingExpenseId(expense.id);
                setExpenseForm({
                    title: expense.title,
                    amount: expense.amount, // 使用者原本輸入的金額
                    category: expense.category,
                    hasFee: expense.hasFee,
                    payerIds: expense.payerIds,
                    date: expense.date ? expense.date.split('T')[0] : new Date().toISOString().split('T')[0]
                });
                setView('addExpense');
            };

            const handleDeleteExpense = (id) => {
                if(confirm('確定刪除這筆款項？')) {
                    setExpenses(expenses.filter(e => e.id !== id));
                }
            };

            const togglePayer = (id) => {
                setExpenseForm(prev => {
                    const current = prev.payerIds;
                    return current.includes(id) ? { ...prev, payerIds: current.filter(p => p !== id) } : { ...prev, payerIds: [...current, id] };
                });
            };

            const selectAllPayers = () => {
                const allIds = ['me', ...friends.map(f => f.id)];
                setExpenseForm(prev => ({ ...prev, payerIds: prev.payerIds.length === allIds.length ? [] : allIds }));
            };

            const handleSaveRepayment = () => {
                if (!repaymentForm.amount) return;
                const repaymentData = {
                    id: editingRepaymentId || Date.now().toString(),
                    friendId: selectedFriendId,
                    amount: parseInt(repaymentForm.amount),
                    date: repaymentForm.date,
                    note: repaymentForm.note
                };

                if (editingRepaymentId) {
                    setRepayments(repayments.map(r => r.id === editingRepaymentId ? repaymentData : r));
                    setEditingRepaymentId(null);
                } else {
                    setRepayments([repaymentData, ...repayments]);
                }

                setRepaymentForm({ amount: '', date: new Date().toISOString().split('T')[0], note: '' });
                setView('friendDetail');
            };

            const handleDeleteRepayment = (id) => {
                if(confirm('刪除這筆還款紀錄？')) setRepayments(repayments.filter(r => r.id !== id));
            };

            const handleEditRepayment = (rep) => {
                setEditingRepaymentId(rep.id);
                setRepaymentForm({ amount: rep.amount, date: rep.date, note: rep.note });
                setView('addRepayment');
            };

            // --- Statistics ---
            const debts = useMemo(() => {
                const result = {}; 
                friends.forEach(f => result[f.id] = { totalDebt: 0, totalRepaid: 0, remaining: 0 });

                expenses.forEach(exp => {
                    const splitCount = exp.payerIds.length;
                    if (splitCount === 0) return;
                    const perPersonShare = calculatePerPerson(exp.finalTotal, splitCount);
                    exp.payerIds.forEach(pid => {
                        if (pid !== 'me' && result[pid]) result[pid].totalDebt += perPersonShare;
                    });
                });

                repayments.forEach(rep => {
                    if (result[rep.friendId]) result[rep.friendId].totalRepaid += rep.amount;
                });

                Object.keys(result).forEach(fid => {
                    result[fid].remaining = result[fid].totalDebt - result[fid].totalRepaid;
                });

                return result;
            }, [expenses, repayments, friends]);

            const totalOutstanding = Object.values(debts).reduce((acc, curr) => acc + curr.remaining, 0);

            // --- Views ---

            // View: Dashboard
            if (view === 'dashboard') {
                return (
                    <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-20">
                        <div className="bg-slate-800 p-6 text-white rounded-b-3xl shadow-lg sticky top-0 z-10">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <h1 className="text-2xl font-bold">東京分帳 V4</h1>
                                    <p className="text-slate-400 text-xs mt-1">代墊總回收預估 (扣除已還款)</p>
                                </div>
                                <button onClick={() => setView('addFriend')} className="p-2 bg-slate-700 rounded-lg hover:bg-slate-600 transition">
                                    <Icons.Users size={20} />
                                </button>
                            </div>
                            <div className="text-4xl font-bold tracking-tight text-emerald-400">
                                {formatMoney(totalOutstanding)}
                            </div>
                            <div className="mt-4 flex gap-2">
                                <button 
                                    onClick={() => setView('allExpenses')}
                                    className="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition"
                                >
                                    <Icons.List size={16} /> 代墊管理
                                </button>
                                <button 
                                    onClick={() => setView('summaryReport')}
                                    className="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition"
                                >
                                    <Icons.FileText size={16} /> 結算總報表
                                </button>
                            </div>
                        </div>

                        <div className="p-4 space-y-4">
                            <div className="grid grid-cols-1 gap-3">
                                {friends.length === 0 ? (
                                    <div className="text-center py-10 text-gray-400">
                                        <p>點擊右上方按鈕新增朋友</p>
                                    </div>
                                ) : (
                                    friends.map(friend => {
                                        const data = debts[friend.id] || { totalDebt: 0, totalRepaid: 0, remaining: 0 };
                                        return (
                                            <div 
                                                key={friend.id}
                                                onClick={() => { setSelectedFriendId(friend.id); setTab('debt'); setView('friendDetail'); }}
                                                className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center active:bg-gray-50 cursor-pointer border border-transparent hover:border-indigo-100"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600">
                                                        {friend.name[0]}
                                                    </div>
                                                    <div>
                                                        <span className="font-bold text-lg text-gray-800 block">{friend.name}</span>
                                                        {data.totalRepaid > 0 && <span className="text-xs text-emerald-600">已還 {formatMoney(data.totalRepaid)}</span>}
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className={`font-bold text-lg ${data.remaining > 0 ? 'text-red-500' : 'text-gray-400'}`}>
                                                        {formatMoney(data.remaining)}
                                                    </div>
                                                    <div className="text-xs text-gray-400">剩餘欠款</div>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        <div className="fixed bottom-6 right-6 safe-bottom">
                            <button 
                                onClick={() => { 
                                    setEditingExpenseId(null);
                                    setExpenseForm({ title: '', amount: '', category: 'food', hasFee: false, payerIds: [], date: new Date().toISOString().split('T')[0] });
                                    setView('addExpense'); 
                                }}
                                className="w-14 h-14 bg-indigo-600 text-white rounded-full shadow-xl flex items-center justify-center active:scale-95 transition-transform"
                            >
                                <Icons.Plus size={28} />
                            </button>
                        </div>
                    </div>
                );
            }

            // View: Summary Report (New Feature)
            if (view === 'summaryReport') {
                const copyAllReport = () => {
                    let text = `【東京旅行 財務總結算】\n\n`;
                    friends.forEach(friend => {
                        const data = debts[friend.id];
                        text += `■ ${friend.name}\n`;
                        text += `總消費: ${formatMoney(data.totalDebt)}\n`;
                        text += `已還款: ${formatMoney(data.totalRepaid)}\n`;
                        text += `剩餘欠款: ${formatMoney(data.remaining)}\n\n`;
                    });
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    alert('全團摘要已複製！');
                };

                return (
                    <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-10">
                        <div className="bg-white sticky top-0 z-10 border-b shadow-sm">
                            <div className="p-4 flex items-center gap-2">
                                <button onClick={() => setView('dashboard')} className="p-2 -ml-2"><Icons.ArrowLeft /></button>
                                <h2 className="font-bold text-xl flex-1">結算總報表</h2>
                                <button onClick={copyAllReport} className="p-2 text-indigo-600 flex gap-1 items-center text-sm font-bold bg-indigo-50 rounded-lg px-3">
                                    <Icons.Copy size={16} /> 複製總表
                                </button>
                            </div>
                        </div>

                        <div className="p-4 space-y-6">
                            {friends.map(friend => {
                                const friendExpenses = expenses
                                    .filter(e => e.payerIds.includes(friend.id))
                                    .sort((a,b) => new Date(a.date) - new Date(b.date)); // 按日期排序
                                
                                const data = debts[friend.id];

                                return (
                                    <div key={friend.id} className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                                        <div className="bg-slate-50 p-3 border-b border-gray-100 flex justify-between items-center">
                                            <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                                <div className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-xs text-slate-600">
                                                    {friend.name[0]}
                                                </div>
                                                {friend.name}
                                            </h3>
                                            <div className="text-sm font-bold text-indigo-600">
                                                欠款 {formatMoney(data.remaining)}
                                            </div>
                                        </div>
                                        
                                        {/* Table Header */}
                                        <div className="grid grid-cols-12 bg-gray-50 p-2 text-xs text-gray-500 font-medium border-b">
                                            <div className="col-span-3">日期</div>
                                            <div className="col-span-5">項目/手續費</div>
                                            <div className="col-span-4 text-right">分攤金額(小計)</div>
                                        </div>

                                        {/* Table Body */}
                                        <div className="divide-y divide-gray-50">
                                            {friendExpenses.length === 0 ? (
                                                <div className="p-4 text-center text-gray-400 text-sm">無消費紀錄</div>
                                            ) : (
                                                friendExpenses.map(exp => {
                                                    const share = calculatePerPerson(exp.finalTotal, exp.payerIds.length);
                                                    return (
                                                        <div key={exp.id} className="grid grid-cols-12 p-2 text-sm hover:bg-gray-50 items-center">
                                                            <div className="col-span-3 text-gray-500 text-xs">
                                                                {exp.date.split('T')[0].slice(5)}
                                                            </div>
                                                            <div className="col-span-5">
                                                                <div className="font-medium text-gray-800 truncate">{exp.title}</div>
                                                                {exp.hasFee && (
                                                                    <div className="text-[10px] text-red-500 font-bold bg-red-50 inline-block px-1 rounded">
                                                                        +1.5%手續費
                                                                    </div>
                                                                )}
                                                            </div>
                                                            <div className="col-span-4 text-right font-medium text-slate-700">
                                                                {formatMoney(share)}
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                        </div>

                                        {/* Footer Summary */}
                                        <div className="bg-slate-50 p-3 border-t border-gray-100 text-xs text-gray-500 flex justify-between items-center">
                                            <div>
                                                <div>總消費: {formatMoney(data.totalDebt)}</div>
                                                <div>已還款: {formatMoney(data.totalRepaid)}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-gray-400">合計應付</div>
                                                <div className="text-lg font-bold text-slate-800">{formatMoney(data.remaining)}</div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            // View: All Expenses List
            if (view === 'allExpenses') {
                const sortedExpenses = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date));
                return (
                    <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-10">
                         <div className="bg-white sticky top-0 z-10 border-b shadow-sm">
                            <div className="p-4 flex items-center gap-2">
                                <button onClick={() => setView('dashboard')} className="p-2 -ml-2"><Icons.ArrowLeft /></button>
                                <h2 className="font-bold text-xl flex-1">代墊明細管理</h2>
                                <div className="text-sm text-gray-500">共 {expenses.length} 筆</div>
                            </div>
                        </div>
                        <div className="p-4 space-y-3">
                            {sortedExpenses.map(exp => {
                                const cat = CATEGORIES.find(c => c.id === exp.category);
                                return (
                                    <div key={exp.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex items-center gap-3">
                                                <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center">
                                                    {cat.icon}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-gray-800">{exp.title}</div>
                                                    <div className="text-xs text-gray-400">
                                                        {exp.date.split('T')[0]} • {cat.name}
                                                        {exp.hasFee && <span className="ml-1 text-red-400 font-bold">+1.5%</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="font-bold text-lg text-slate-700">{formatMoney(exp.finalTotal)}</div>
                                        </div>
                                        <div className="flex justify-between items-center mt-3 pt-3 border-t border-gray-50">
                                            <div className="text-xs text-gray-500">
                                                分攤: {exp.payerIds.length} 人 (一人 {formatMoney(calculatePerPerson(exp.finalTotal, exp.payerIds.length))})
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={() => handleDeleteExpense(exp.id)} className="text-gray-400 hover:text-red-500"><Icons.Trash2 size={18} /></button>
                                                <button onClick={() => handleEditExpense(exp)} className="text-indigo-600 hover:text-indigo-800"><Icons.Edit size={18} /></button>
                                            </div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                );
            }

            // View: Add/Edit Expense
            if (view === 'addExpense') {
                const finalAmt = calculateFinalAmount(expenseForm.amount, expenseForm.hasFee);
                const splitCount = expenseForm.payerIds.length;
                const perPerson = calculatePerPerson(finalAmt, splitCount);
                const allPayerIds = ['me', ...friends.map(f => f.id)];

                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen flex flex-col">
                        <div className="p-4 border-b flex items-center gap-2 sticky top-0 bg-white z-10">
                            <button onClick={() => setView(editingExpenseId ? 'allExpenses' : 'dashboard')} className="p-2"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-xl">{editingExpenseId ? '編輯消費' : '新增消費'}</h2>
                        </div>

                        <div className="p-6 space-y-6 flex-1 overflow-y-auto pb-24">
                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">日期</label>
                                <input 
                                    type="date" 
                                    className="w-full p-2 bg-gray-50 rounded-lg mb-4 font-bold text-gray-700"
                                    value={expenseForm.date}
                                    onChange={(e) => setExpenseForm({...expenseForm, date: e.target.value})}
                                />

                                <label className="block text-sm font-medium text-gray-500 mb-1">總金額 (日幣)</label>
                                <div className="relative">
                                    <input 
                                        type="number" 
                                        inputMode="numeric"
                                        className="w-full text-4xl font-bold p-2 border-b-2 border-gray-200 focus:border-indigo-500 focus:outline-none bg-transparent"
                                        placeholder="0"
                                        value={expenseForm.amount}
                                        onChange={(e) => setExpenseForm({...expenseForm, amount: e.target.value})}
                                    />
                                    {expenseForm.hasFee && (
                                        <span className="absolute right-0 top-1/2 -translate-y-1/2 text-sm text-red-500 font-bold bg-red-50 px-2 py-1 rounded">
                                            +1.5%
                                        </span>
                                    )}
                                </div>
                                <div className="mt-2 flex items-center gap-2">
                                    <input 
                                        type="checkbox" 
                                        id="fee" 
                                        checked={expenseForm.hasFee}
                                        onChange={(e) => setExpenseForm({...expenseForm, hasFee: e.target.checked})}
                                        className="w-5 h-5 accent-indigo-600"
                                    />
                                    <label htmlFor="fee" className="text-gray-600 text-sm">海外手續費 (總額 x 1.5%)</label>
                                </div>
                                <div className="mt-1 text-right text-gray-400 text-sm">
                                    入帳金額: {formatMoney(finalAmt)}
                                </div>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-1">項目名稱</label>
                                    <input 
                                        type="text" 
                                        className="w-full p-3 bg-gray-50 rounded-xl focus:outline-indigo-500"
                                        placeholder="例如：敘敘苑燒肉"
                                        value={expenseForm.title}
                                        onChange={(e) => setExpenseForm({...expenseForm, title: e.target.value})}
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-gray-500 mb-2">消費類別</label>
                                    <div className="grid grid-cols-4 gap-2">
                                        {CATEGORIES.map(cat => (
                                            <button
                                                key={cat.id}
                                                onClick={() => setExpenseForm({...expenseForm, category: cat.id})}
                                                className={`flex flex-col items-center justify-center p-2 rounded-xl text-xs transition-all ${
                                                    expenseForm.category === cat.id 
                                                    ? 'bg-indigo-600 text-white shadow-md' 
                                                    : 'bg-gray-50 text-gray-500'
                                                }`}
                                            >
                                                <div className="mb-1">{cat.icon}</div>
                                                {cat.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-end mb-2">
                                    <label className="text-sm font-medium text-gray-500">誰有份？ (分母)</label>
                                    <button onClick={selectAllPayers} className="text-xs text-indigo-600 font-bold px-2 py-1 bg-indigo-50 rounded">
                                        {expenseForm.payerIds.length === allPayerIds.length ? '取消全選' : '全選'}
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button 
                                        onClick={() => togglePayer('me')}
                                        className={`p-3 rounded-xl flex items-center gap-2 border transition-all ${
                                            expenseForm.payerIds.includes('me') 
                                            ? 'border-indigo-500 bg-indigo-50 text-indigo-700 font-bold' 
                                            : 'border-gray-200 text-gray-400'
                                        }`}
                                    >
                                        <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                                            expenseForm.payerIds.includes('me') ? 'border-indigo-500 bg-indigo-500' : 'border-gray-300'
                                        }`}>
                                            {expenseForm.payerIds.includes('me') && <Icons.Check size={10} className="text-white"/>}
                                        </div>
                                        我自己 (主揪)
                                    </button>

                                    {friends.map(friend => (
                                        <button 
                                            key={friend.id}
                                            onClick={() => togglePayer(friend.id)}
                                            className={`p-3 rounded-xl flex items-center gap-2 border transition-all ${
                                                expenseForm.payerIds.includes(friend.id) 
                                                ? 'border-indigo-500 bg-indigo-50 text-indigo-700 font-bold' 
                                                : 'border-gray-200 text-gray-400'
                                            }`}
                                        >
                                            <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                                                expenseForm.payerIds.includes(friend.id) ? 'border-indigo-500 bg-indigo-500' : 'border-gray-300'
                                            }`}>
                                                {expenseForm.payerIds.includes(friend.id) && <Icons.Check size={10} className="text-white"/>}
                                            </div>
                                            {friend.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t safe-bottom max-w-md mx-auto">
                            <div className="flex justify-between items-center mb-2 text-sm text-gray-500">
                                <span>分攤人數: {splitCount} 人</span>
                                <span>每人應付: <span className="text-indigo-600 font-bold">{formatMoney(perPerson)}</span></span>
                            </div>
                            <button 
                                onClick={handleSaveExpense}
                                className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition"
                            >
                                {editingExpenseId ? '儲存修改' : '確認記帳'}
                            </button>
                        </div>
                    </div>
                );
            }

            // View: Friend Detail (Tabs: Expense / Repayment)
            if (view === 'friendDetail' && selectedFriendId) {
                const friend = friends.find(f => f.id === selectedFriendId);
                const myExpenses = expenses.filter(e => e.payerIds.includes(selectedFriendId)).map(e => ({
                    ...e,
                    share: calculatePerPerson(e.finalTotal, e.payerIds.length)
                })).sort((a,b) => new Date(b.date) - new Date(a.date));

                const myRepayments = repayments.filter(r => r.friendId === selectedFriendId).sort((a,b) => new Date(b.date) - new Date(a.date));
                const { totalDebt, totalRepaid, remaining } = debts[selectedFriendId];

                const copyReport = () => {
                    let text = `致 ${friend.name} 的東京帳單：\n\n`;
                    text += `【消費明細】\n`;
                    myExpenses.forEach(item => text += `${item.date.split('T')[0]} ${item.title}: ${item.share}日圓\n`);
                    text += `\n消費總額: ${formatMoney(totalDebt)}\n`;
                    if (totalRepaid > 0) {
                        text += `已還款: -${formatMoney(totalRepaid)}\n`;
                    }
                    text += `----------------\n`;
                    text += `剩餘欠款: ${formatMoney(remaining)}`;

                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    alert('帳單已複製到剪貼簿');
                };

                return (
                    <div className="max-w-md mx-auto bg-gray-50 min-h-screen pb-20">
                        <div className="bg-white sticky top-0 z-10 border-b">
                            <div className="p-4 flex items-center gap-2">
                                <button onClick={() => setView('dashboard')} className="p-2 -ml-2"><Icons.ArrowLeft /></button>
                                <h2 className="font-bold text-xl flex-1">{friend?.name}</h2>
                                <button onClick={copyReport} className="p-2 text-indigo-600"><Icons.Share size={20} /></button>
                            </div>
                            <div className="px-6 pb-6 text-center">
                                <p className="text-gray-500 text-sm mb-1">剩餘欠款</p>
                                <div className={`text-4xl font-bold ${remaining > 0 ? 'text-red-500' : 'text-emerald-500'}`}>{formatMoney(remaining)}</div>
                                <div className="flex justify-center gap-4 text-xs mt-2 text-gray-400">
                                    <span>總消費 {formatMoney(totalDebt)}</span>
                                    <span>已還款 {formatMoney(totalRepaid)}</span>
                                </div>
                            </div>
                            <div className="flex border-t">
                                <button onClick={() => setTab('debt')} className={`flex-1 py-3 text-sm font-bold ${tab === 'debt' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-400'}`}>
                                    消費明細
                                </button>
                                <button onClick={() => setTab('repayment')} className={`flex-1 py-3 text-sm font-bold ${tab === 'repayment' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-gray-400'}`}>
                                    還款紀錄
                                </button>
                            </div>
                        </div>

                        <div className="p-4 space-y-3">
                            {tab === 'debt' ? (
                                myExpenses.length === 0 ? <div className="text-center text-gray-400 py-10">無消費紀錄</div> :
                                myExpenses.map(item => {
                                    const cat = CATEGORIES.find(c => c.id === item.category);
                                    return (
                                        <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm">
                                            <div className="flex justify-between items-start">
                                                <div className="flex items-center gap-3">
                                                    <div className="text-indigo-100 bg-indigo-600 rounded-full w-8 h-8 flex items-center justify-center text-xs">
                                                        {cat.icon}
                                                    </div>
                                                    <div>
                                                        <div className="font-bold text-gray-800">{item.title}</div>
                                                        <div className="text-xs text-gray-400">{item.date.split('T')[0]}</div>
                                                    </div>
                                                </div>
                                                <div className="font-bold text-red-500">{formatMoney(item.share)}</div>
                                            </div>
                                        </div>
                                    )
                                })
                            ) : (
                                <div>
                                    <button 
                                        onClick={() => { setEditingRepaymentId(null); setRepaymentForm({ amount: '', date: new Date().toISOString().split('T')[0], note: '' }); setView('addRepayment'); }}
                                        className="w-full py-3 border-2 border-dashed border-emerald-300 text-emerald-600 rounded-xl font-bold mb-4 hover:bg-emerald-50"
                                    >
                                        + 新增還款紀錄
                                    </button>
                                    {myRepayments.length === 0 ? <div className="text-center text-gray-400 py-4">無還款紀錄</div> :
                                    myRepayments.map(rep => (
                                        <div key={rep.id} className="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-400 flex justify-between items-center mb-3">
                                            <div>
                                                <div className="font-bold text-gray-800">還款 {formatMoney(rep.amount)}</div>
                                                <div className="text-xs text-gray-400">{rep.date} {rep.note && `• ${rep.note}`}</div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => handleEditRepayment(rep)} className="text-emerald-600"><Icons.Edit size={16} /></button>
                                                <button onClick={() => handleDeleteRepayment(rep.id)} className="text-gray-300 hover:text-red-500"><Icons.Trash2 size={16} /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // View: Add/Edit Repayment
            if (view === 'addRepayment') {
                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen p-4">
                        <div className="flex items-center gap-2 mb-6">
                            <button onClick={() => setView('friendDetail')} className="p-2 -ml-2"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-xl">{editingRepaymentId ? '編輯還款' : '新增還款'}</h2>
                        </div>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">還款日期</label>
                                <input 
                                    type="date" 
                                    value={repaymentForm.date}
                                    onChange={(e) => setRepaymentForm({...repaymentForm, date: e.target.value})}
                                    className="w-full p-3 bg-gray-50 rounded-xl"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">還款金額 (日幣)</label>
                                <input 
                                    type="number" 
                                    value={repaymentForm.amount}
                                    onChange={(e) => setRepaymentForm({...repaymentForm, amount: e.target.value})}
                                    className="w-full p-3 bg-gray-50 rounded-xl text-2xl font-bold"
                                    placeholder="0"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-500 mb-1">備註 (選填)</label>
                                <input 
                                    type="text" 
                                    value={repaymentForm.note}
                                    onChange={(e) => setRepaymentForm({...repaymentForm, note: e.target.value})}
                                    className="w-full p-3 bg-gray-50 rounded-xl"
                                    placeholder="例如：先還一半"
                                />
                            </div>
                            <button 
                                onClick={handleSaveRepayment}
                                className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-4"
                            >
                                確認儲存
                            </button>
                        </div>
                    </div>
                );
            }

            // View: Add Friend (Keep simple)
            if (view === 'addFriend') {
                return (
                    <div className="max-w-md mx-auto bg-white min-h-screen p-4">
                        <div className="flex items-center gap-2 mb-6">
                            <button onClick={() => setView('dashboard')} className="p-2 -ml-2"><Icons.ArrowLeft /></button>
                            <h2 className="font-bold text-xl">成員管理</h2>
                        </div>
                        <div className="flex gap-2 mb-6">
                            <input 
                                type="text" 
                                value={newFriendName}
                                onChange={(e) => setNewFriendName(e.target.value)}
                                className="flex-1 p-3 bg-gray-50 rounded-xl"
                                placeholder="輸入名字"
                            />
                            <button onClick={handleAddFriend} className="bg-slate-700 text-white px-6 rounded-xl font-bold">新增</button>
                        </div>
                        <div className="space-y-2">
                            {friends.map(f => (
                                <div key={f.id} className="flex justify-between items-center p-3 border rounded-xl">
                                    <span className="font-bold">{f.name}</span>
                                    <button onClick={() => handleDeleteFriend(f.id)} className="text-gray-400 hover:text-red-500"><Icons.Trash2 size={18} /></button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
